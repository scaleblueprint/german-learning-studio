/* Teacher-created learning experiences */
.experience-studio{margin:43px 0 37px}
.experience-intro{margin:0 0 21px;align-items:center}
.experience-intro h2{max-width:720px;margin-top:8px}
.experience-intro> .tag{font-size:11px;padding:10px 14px}
.experience-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:15px}
.experience-flow>div{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:10px;row-gap:3px;padding:19px;background:#eaece4;border-radius:14px;min-width:0}
.experience-flow b{grid-row:span 2;display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:#dfe6d8;color:#496457;font-size:11px}
.experience-flow strong{font-size:12px}
.experience-flow span{color:var(--muted);font-size:10px;line-height:1.45}
.template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.template-card{min-width:0;padding:24px;border:1px solid #dfdfd5;border-radius:17px;background:var(--paper);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:11px;align-items:flex-start;transition:transform .2s,border-color .2s,box-shadow .2s}
.template-card:hover,.template-card:focus-visible{transform:translateY(-3px);border-color:#b1c4b1;box-shadow:0 17px 37px #2b413a18}
.template-glyph{display:grid;place-items:center;width:48px;height:48px;background:#e6ece1;border-radius:14px;color:#31594b;font-size:24px}
.template-glyph.small{width:40px;height:40px;font-size:21px;border-radius:12px}
.template-card:nth-child(2) .template-glyph{background:#f2e8d9;color:#a4653e}
.template-card:nth-child(3) .template-glyph{background:#e3e8ea;color:#56757e}
.template-card strong{font-family:Fraunces,Georgia,serif;font-size:23px;font-weight:500}
.template-card>span:not(.template-glyph){font-size:12px;color:var(--ink-soft);line-height:1.6}
.template-card em{margin-top:auto;font-style:normal;font-size:11px;color:var(--copper-dark);font-weight:800}
.experience-work-heading{margin:42px 0 19px}

.experience-shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.experience-shelf-card{min-width:0;padding:20px;display:flex;flex-direction:column;gap:11px}
.experience-shelf-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.experience-shelf-head .tag{white-space:normal;text-align:right;line-height:1.3}
.experience-shelf-card h3{font-size:23px;overflow-wrap:anywhere}
.experience-shelf-card p{font-size:12px;color:var(--ink-soft);line-height:1.6}
.experience-responses{font-size:11px;color:var(--muted);font-weight:700;margin-top:auto}
.experience-shelf-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.experience-shelf-actions .btn{padding:9px 11px}
.mission-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;font-size:9px}
.builder-panel{margin:18px 0 30px;padding:29px;background:#fdfbf5;scroll-margin-top:98px}
.builder-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
.builder-top h3{font-size:28px;margin:8px 0}
.builder-top p{font-size:12px;color:var(--ink-soft);max-width:600px}
.builder-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.75fr);gap:25px}
.builder-fields{display:grid;gap:15px;min-width:0}
.builder-double{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.builder-field{display:flex;flex-direction:column;gap:7px;min-width:0}
.builder-field>span{font-size:11px;font-weight:800;color:var(--ink-soft)}
.builder-field input,.builder-field textarea,.builder-field select{display:block;width:100%;min-width:0;border-radius:10px;border:1px solid #d7dcd2;background:#fff;padding:12px 13px;font-size:13px;color:var(--ink);outline-offset:2px}
.builder-field textarea{resize:vertical;line-height:1.6}
.builder-field input:focus,.builder-field textarea:focus,.builder-field select:focus{border-color:var(--forest)}
.builder-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.builder-aside{align-self:start;background:#e7ede5;border-radius:17px;padding:24px;min-width:0}
.builder-aside-icon{font-size:32px;margin-bottom:15px}
.builder-aside h3{font-size:27px;margin:15px 0 10px}
.builder-aside p{font-size:12px;line-height:1.75;color:#52675b}
.builder-aside ul{padding-left:18px;margin:18px 0;font-size:12px;line-height:1.85;color:#496054}
.builder-aside .study-note{font-size:11px;background:#fafcf8}
.experience-preview{padding:27px;margin-top:16px;background:#fdfcf8}
.experience-preview h3{margin:8px 0 10px}
.experience-preview>p{font-size:13px;color:var(--ink-soft)}
.experience-preview .phrase-panel{margin-bottom:14px}
.experience-preview .stage-foot{margin-top:16px}
.rubric-note{font-size:11px;color:var(--forest);background:#eef3e9;padding:12px;border-radius:8px;line-height:1.6;margin-top:8px}

  let recording = false;
  let recordedURL = null;
  let toastTimeout;

  function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{notify('Browser storage is unavailable; progress may not persist.');}}
  function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),3000);}
  function icon(name){const icons={arrow:'→',check:'✓',listen:'♫',back:'←',clock:'◷',book:'▤',teacher:'◉',source:'↗',record:'●',stop:'■'};return icons[name]||name;}
  function progress(){return Math.round(100*state.completed.length/Math.max(lessons.length,1));}

  function currentLesson(){return lessons.find(l=>l.id===ui.lessonId)||lessons[0];}
  function sourceNote(id){return `<a href="https://tatoeba.org/en/sentences/show/${id}" target="_blank" rel="noopener noreferrer">Tatoeba CC0 · sentence #${id} ↗</a>`;}
  function resetLessonUI(id){ui.lessonId=id;ui.stage='discover';ui.questionIndex=0;ui.selected=null;ui.checked=false;ui.answers={};}
  function routeFromHash(){const hash=decodeURIComponent(location.hash.replace(/^#/,''));if(hash.startsWith('lesson/')){const id=hash.slice(7);if(lessons.some(l=>l.id===id)){ui.route='lesson';if(ui.lessonId!==id)resetLessonUI(id);return;}}if(hash.startsWith('experience/')){const id=hash.slice(11);if(state.experiences.some(x=>x.id===id&&x.status==='published')){ui.route='experience';ui.experienceId=id;return;}}if(hash.startsWith('session/')){const id=hash.slice(8);if(state.sessions.some(x=>x.id===id&&x.status==='published')){ui.route='session';ui.sessionId=id;return;}}ui.route=['home','student','teacher','sources'].includes(hash)?hash:'home';}
  function navigate(route,id){const target=route==='lesson'?`lesson/${id}`:route==='experience'?`experience/${id}`:route==='session'?`session/${id}`:route;if(route==='session'&&ui.sessionId!==id){ui.sessionId=id;const session=state.sessions.find(s=>s.id===id);const p=sessionProgress(id);ui.sessionBlockIndex=session?Math.max(0,session.blocks.findIndex(b=>!p.completed.includes(b.id))):0;ui.sessionSelection={};}if(location.hash.slice(1)===target){if(route==='lesson'&&ui.lessonId!==id)resetLessonUI(id);if(route==='experience')ui.experienceId=id;ui.route=route;render();}else{location.hash=target;}window.scrollTo({top:0,behavior:'instant'});}
  function navButton(route,label){const selected=(route==='student'&&['student','lesson','experience','session'].includes(ui.route))||ui.route===route;return `<button type="button" class="nav-btn ${selected?'active':''}" data-route="${route}">${label}</button>`;}
  function renderShell(content){

    root.innerHTML=`<div class="top-notice"><span>Interactive concept preview</span> Sample learners · Local progress · No real accounts</div>
      <header class="site-header"><div class="head-inner"><a class="brand" href="#home" aria-label="AmberTheory German Studio home"><span class="brand-mark">At</span><span class="brand-text"><span class="brand-name">AmberTheory</span><span class="brand-sub">German Studio</span></span></a>
      <nav class="primary-nav" aria-label="Main navigation">${navButton('home','Overview')}${navButton('student','My learning')}${navButton('teacher','Teacher studio')}${navButton('sources','Sources')}</nav>
      <div class="role-toggle" aria-label="Demo role switch"><button type="button" data-role="student" class="${!isTeacher?'active':''}">Student</button><button type="button" data-role="teacher" class="${isTeacher?'active':''}">Teacher</button></div></div></header>
      <nav class="mobile-nav" aria-label="Mobile navigation"><button type="button" data-route="home" class="${ui.route==='home'?'active':''}"><span>⌂</span>Home</button><button type="button" data-route="student" class="${['student','lesson','experience','session'].includes(ui.route)?'active':''}"><span>▤</span>Learn</button><button type="button" data-route="teacher" class="${isTeacher?'active':''}"><span>◎</span>Teach</button><button type="button" data-route="sources" class="${ui.route==='sources'?'active':''}"><span>↗</span>Sources</button></nav>
      <main class="shell page">${content}</main><footer class="footer"><div class="shell footer-inner"><span>AmberTheory · German Studio concept · Teacher-led learning</span><div class="footer-links"><a href="#sources">Open materials & credits</a><a href="https://www.coe.int/en/web/common-european-framework-reference-languages" target="_blank" rel="noopener noreferrer">CEFR reference ↗</a><span>Demo only · No real accounts</span></div></div></footer>`;
  }
  function render(){routeFromHash();let page='';if(ui.route==='student')page=renderStudent();else if(ui.route==='lesson')page=renderLesson();else if(ui.route==='experience')page=renderExperience();else if(ui.route==='session')page=renderSession();else if(ui.route==='teacher')page=renderTeacher();else if(ui.route==='sources')page=renderSources();else page=renderHome();renderShell(page);}

  function renderHome(){
    const next=nextLesson();
    return `<section class="hero"><div class="hero-copy"><span class="eyebrow">A new way to learn together</span><h1>Learn German.<br/><em>Find your voice.</em></h1><p class="lead">A considered place to discover the language, practise between classes and grow with guidance from a real teacher.</p><div class="hero-actions"><button class="btn btn-primary" data-lesson="${next.id}">Try the first lesson ${icon('arrow')}</button><button class="btn btn-outline" data-route="teacher">Explore teacher view</button></div><div class="hero-foot"><span><b></b> Beginner-friendly</span><span><b></b> Interactive practice</span><span><b></b> Human feedback</span></div></div><div class="hero-art" aria-hidden="true"><div class="sun"></div><div class="arch"></div><div class="street-line"></div><svg class="squiggle" viewBox="0 0 500 440" preserveAspectRatio="none"><path d="M37 343 C 95 234, 147 359, 192 243 S 320 104, 439 190"/></svg><div class="bubble bubble-a">Hallo!<span>Hello</span></div><div class="bubble bubble-b">Wie geht's?<span>How are you?</span></div></div></section>
    <div class="stat-row"><div class="stat card"><div class="stat-icon">◌</div><div><strong>A1</strong><p>Beginner pathway</p></div></div><div class="stat card"><div class="stat-icon">▤</div><div><strong>${lessons.length}</strong><p>Complete sample lessons</p></div></div><div class="stat card"><div class="stat-icon">◎</div><div><strong>2 views</strong><p>Student and teacher</p></div></div></div>
    <section><div class="section-intro"><div><span class="eyebrow">Your learning path</span><h2>Start with real conversations</h2><p>Original A1 demo lessons created for this prototype. Your teacher will validate and refine the complete curriculum.</p></div><button class="view-link" data-route="student">My learning dashboard ${icon('arrow')}</button></div><div class="lesson-grid">${lessons.map(lessonCard).join('')}</div></section>
    <section><div class="section-intro"><div><span class="eyebrow">One shared experience</span><h2>Learning meets guidance</h2></div></div><div class="split-feature"><article class="feature green"><span class="feature-icon">▤</span><h3>A student’s own rhythm</h3><p>Short lessons, everyday dialogue, practice checks and a personal path back to what matters.</p><button class="btn btn-white btn-small" data-route="student">See student dashboard ${icon('arrow')}</button></article><article class="feature cream"><span class="feature-icon">◎</span><h3>A teacher’s perspective</h3><p>See practice results, review written work, guide a cohort and make every class more personal.</p><button class="btn btn-primary btn-small" data-route="teacher">See teacher studio ${icon('arrow')}</button></article></div></section>`;
  }
  function lessonCard(l){const done=state.completed.includes(l.id);return `<article class="lesson-card card"><div class="lesson-head"><span class="lesson-number">LESSON ${l.unit} / A1</span><span class="tag ${done?'tag-dark':'tag-muted'}">${done?'✓ Completed':escape(l.duration)}</span></div><div><h3>${escape(l.title)}</h3><p>${escape(l.subtitle)}</p></div><div class="mini-phrase">${escape(l.phrase.de.split('.')[0])}</div><button class="view-link" data-lesson="${l.id}">${done?'Revisit lesson':'Open lesson'} ${icon('arrow')}</button></article>`;}

  function experienceTemplate(kind){return experienceTemplates.find(t=>t.kind===kind)||experienceTemplates[0];}
  function experienceSubmissions(id){return state.experienceSubmissions.filter(s=>s.experienceId===id);}
  function missionCard(x){
    const template=experienceTemplate(x.kind);const submitted=experienceSubmissions(x.id);
    return `<article class="mission-card card"><div class="mission-icon">${template.icon}</div><div class="mission-main"><div class="mission-meta"><span>${escape(template.name)} · ${escape(x.level)}</span><span>${escape(x.duration)} min</span></div><h3>${escape(x.title)}</h3><p>${escape(x.goal)}</p><div class="mission-action"><span class="tag ${submitted.length?'tag-dark':'tag-warm'}">${submitted.length?'✓ Practised':'Ready to practise'}</span><button class="btn btn-primary btn-small" data-open-experience="${escape(x.id)}">${submitted.length?'Practise again':'Start mission'} →</button></div></div></article>`;
  }
  function renderStudentExperiences(){

    return `<section class="missions-section"><div class="section-intro"><div><span class="eyebrow">Made by your teacher</span><h2>Practice with a purpose</h2><p>Short, personal missions turn your next lesson into something you can say or write. Assignments here are shared only inside this browser.</p></div><span class="tag tag-warm">${published.length} available</span></div>${published.length?`<div class="mission-grid">${published.map(missionCard).join('')}</div>`:'<div class="empty">No personalised missions are published yet. Switch to Teacher Studio to create one.</div>'}</section>`;
  }
  function renderExperience(){
    const x=state.experiences.find(e=>e.id===ui.experienceId&&e.status==='published');
    if(!x)return `<div class="empty">This mission is no longer assigned. <button class="btn btn-outline btn-small" data-route="student">Return to learning</button></div>`;
    const t=experienceTemplate(x.kind);const draft=state.experienceDrafts[x.id]||'';const responses=experienceSubmissions(x.id);
    return `<div class="experience-detail"><button class="view-link" data-route="student">← Back to my learning</button><section class="mission-banner"><div><span class="eyebrow">A mission from your teacher · ${escape(x.level)}</span><h1>${escape(x.title)}</h1><p>${escape(x.goal)}</p><div class="mission-banner-meta"><span>${t.icon} ${escape(t.name)}</span><span>◷ About ${escape(x.duration)} minutes</span></div></div><span class="mission-banner-symbol" aria-hidden="true">${t.icon}</span></section>
    <div class="experience-detail-grid"><article class="card card-pad"><span class="eyebrow">Your challenge</span><h2 style="margin:12px 0">Try it in your own words</h2><p class="explain">${escape(x.prompt)}</p><div class="task-card"><strong>What good looks like</strong><p>${escape(x.criteria)}</p></div><div class="phrase-panel"><div><span class="upper">A helpful starting phrase</span><div class="phrase-de">${escape(x.example)}</div><p class="muted" style="font-size:11px;margin-top:8px">Use this as inspiration. Make the response your own.</p></div><button class="sound-button" data-speak="${escape(x.example)}" aria-label="Hear the example phrase">♫</button></div><label class="form-field" for="mission-response">${x.kind==='speaking'?'Write what you would say after speaking aloud':'Your response in German'}</label><textarea class="text-entry" id="mission-response" data-experience-draft="${escape(x.id)}" maxlength="900" placeholder="Schreib deine Antwort auf Deutsch …">${escape(draft)}</textarea><div class="stage-foot"><p>Your writing is saved on this device.</p><button class="btn btn-copper" data-submit-experience="${escape(x.id)}" ${draft.trim().length<5?'disabled':''}>Send to teacher queue →</button></div></article>
    <aside class="card card-pad mission-side"><span class="eyebrow">Your practice history</span><h3 style="margin:12px 0">Feedback makes it stick.</h3><p class="subtle" style="font-size:12px">Try the mission, get a short note and improve your next response.</p><div class="queue" style="margin-top:17px">${responses.length?responses.map(s=>`<div class="queue-item"><div class="queue-head"><strong>Your response</strong><span class="tag ${state.reviews[s.id]?'tag-dark':'tag-warm'}">${state.reviews[s.id]?'Reviewed':'Awaiting feedback'}</span></div><blockquote>${escape(s.text)}</blockquote>${state.reviews[s.id]?`<div class="feedback"><b>Teacher note:</b> ${escape(state.reviews[s.id].note)}</div>`:''}</div>`).join(''):'<div class="empty">Your first attempt will appear here after you submit it.</div>'}</div><div class="study-note"><b>Demo note:</b> Speaking rehearsal happens locally. Only the written response is visible in the Teacher Studio on this browser.</div></aside></div></div>`;
  }

  function renderStudent(){
    const next=nextLesson();const pts=progress();const assignments=state.assigned;
    const skills=[['Listening',30],['Speaking',20],['Reading',35],['Writing',25]].map(([name,base])=>{const value=Math.min(100,base+Math.round(pts*.55));return `<div class="card skill"><div class="skill-top"><span>${name}</span><span class="tag tag-muted">A1 demo</span></div><strong>${value}%</strong><div class="progress-shell"><div class="progress-fill" style="width:${value}%"></div></div></div>`;}).join('');
    return `<div class="dash-header"><div><span class="eyebrow">Your learning space</span><h1>Guten Tag, learner.</h1><p class="lead">A little progress every day becomes a language you can use. Pick up where you left off.</p></div><span class="tag tag-warm">Demo learner · Local browser</span></div>
    <div class="dash-grid"><section class="learning-panel"><span class="tag tag-dark">A1 · Beginner German</span><h2>Make the next conversation yours.</h2><p>${pts===100?'All sample lessons completed. Revisit a lesson or try a different example.':'Your path is ready. Listen, understand, check your knowledge and try saying it yourself.'}</p><div class="progress-shell"><div class="progress-fill" style="width:${pts}%"></div></div><div class="minor-progress"><span>${state.completed.length} of ${lessons.length} lessons finished</span><span>${pts}%</span></div><button class="btn btn-white" data-lesson="${next.id}">${pts===100?'Revisit lessons':'Continue learning'} ${icon('arrow')}</button></section><section class="card card-pad"><div class="lesson-head"><h3>Your next steps</h3><span class="tag tag-muted">A1</span></div><p class="subtle" style="font-size:12px;margin:8px 0 19px">Small, useful steps towards confident conversations.</p><div class="next-list">${lessons.slice(0,4).map((l,i)=>`<div class="next-item"><span class="next-dot">${state.completed.includes(l.id)?'✓':i+1}</span><div><strong>${escape(l.title)}</strong><p>${escape(l.duration)} · ${escape(l.skill)}</p></div><button class="btn btn-ghost btn-small" data-lesson="${l.id}">Open →</button></div>`).join('')}</div></section></div>
    ${renderStudentSessions()}
    ${renderStudentExperiences()}
    <div class="assignment-strip"><div><span class="upper">Quick lesson assignment</span><h3 style="margin-top:6px">${assignments?'Introduce yourself in two sentences':'No quick assignment'}</h3><p>${assignments?'Practise the first lesson, write your introduction and send it for demo teacher feedback.':'Your teacher can assign a writing task from the Teacher Studio view.'}</p></div><button class="btn btn-primary" data-lesson="hello">${assignments?'Start assignment':'Practise anyway'} ${icon('arrow')}</button></div>
    ${state.submissions.length?`<section class="card card-pad" style="margin-top:18px"><div class="lesson-head"><h3>Teacher feedback</h3><span class="tag tag-muted">Your submitted work</span></div><div class="queue" style="margin-top:17px">${state.submissions.slice(0,4).map(s=>`<div class="queue-item"><div class="queue-head"><strong>${escape(lessons.find(l=>l.id===s.lessonId)?.title||'Practice')}</strong><span class="tag ${state.reviews[s.id]?'tag-dark':'tag-warm'}">${state.reviews[s.id]?'Reviewed':'Awaiting review'}</span></div><blockquote>${escape(s.text)}</blockquote>${state.reviews[s.id]?`<div class="feedback"><b>From your teacher:</b> ${escape(state.reviews[s.id].note)}</div>`:'<p>A teacher can respond in the Teacher Studio demo.</p>'}</div>`).join('')}</div></section>`:''}
    <section><div class="section-intro"><div><span class="eyebrow">Sample skill picture</span><h2>Four ways to grow</h2><p>Illustrative skill indicators for the concept; these are not measured proficiency scores.</p></div></div><div class="skill-grid">${skills}</div></section>
    <section><div class="section-intro"><div><span class="eyebrow">Course outline</span><h2>Your A1 sample lessons</h2></div></div><div class="lesson-grid">${lessons.map(lessonCard).join('')}</div></section>`;
  }

  function sidebar(){return `<aside class="course-sidebar card" aria-label="Lesson outline"><div class="sidebar-overline">Course outline</div><div class="sidebar-title">German A1</div>${lessons.map(l=>`<button class="sidebar-lesson ${l.id===ui.lessonId?'active':''} ${state.completed.includes(l.id)?'done':''}" data-lesson="${l.id}"><span class="count">${state.completed.includes(l.id)?'✓':l.unit}</span><span><b>${escape(l.title)}</b><small>${escape(l.duration)} · ${escape(l.skill)}</small></span></button>`).join('')}</aside>`;}
  const stageNames=[['discover','01 · Discover'],['understand','02 · Understand'],['check','03 · Check'],['apply','04 · Use it']];
  function renderLesson(){const l=currentLesson();if(!l)return '<p>No lessons available.</p>';const stage=stageNames.find(x=>x[0]===ui.stage)||stageNames[0];const done=state.completed.includes(l.id);
    return `<div class="course-layout">${sidebar()}<div class="lesson-main"><div class="lesson-banner"><div><span class="eyebrow">German A1 · Lesson ${l.unit}</span><h1>${escape(l.title)}</h1><p>${escape(l.subtitle)}</p></div><span class="tag ${done?'tag-dark':'tag-warm'}">${done?'✓ Completed':escape(l.duration)}</span></div><nav class="lesson-stage" aria-label="Lesson stages">${stageNames.map(([id,label])=>`<button class="stage-tab ${id===ui.stage?'active':''}" data-stage="${id}">${label}</button>`).join('')}</nav><article class="lesson-body card"><span class="eyebrow">${escape(stage[1])}</span>${renderStage(l)}</article><div class="lesson-nav"><button data-route="student">← My learning</button><button data-lesson="${lessons[(lessons.indexOf(l)+1)%lessons.length].id}">Next lesson →</button></div></div></div>`;
  }
  function renderStage(l){
    if(ui.stage==='discover')return `<h2>A moment from everyday life</h2><p class="explain">${escape(l.scene)}</p><div class="phrase-panel"><div><div class="upper">Hear the language</div><div class="phrase-de">${escape(l.phrase.de)}</div><div class="phrase-en">${escape(l.phrase.en)}</div>${l.phrase.sourceId?`<div class="phrase-source">${sourceNote(l.phrase.sourceId)}</div>`:''}</div><button class="sound-button" data-speak="${escape(l.phrase.de)}" aria-label="Play German pronunciation" title="Play browser German voice">♫</button></div><div class="study-note"><b>Listen and repeat.</b> Use the sound button to hear a German browser voice, then say the phrase aloud. Voice quality depends on the voices installed on your device.</div><div class="stage-foot"><p>Try to hear the rhythm before focusing on every word.</p><button class="btn btn-primary" data-stage="understand">Understand the words ${icon('arrow')}</button></div>`;
    if(ui.stage==='understand')return `<h2>Understand it, word by word</h2><p class="explain">${l.pattern}</p><div class="word-list">${l.words.map(([de,en])=>`<div class="word"><b>${escape(de)}</b><p>${escape(en)}</p><button class="view-link" data-speak="${escape(de)}" aria-label="Hear ${escape(de)}" style="font-size:11px;margin-top:7px">♫ Listen</button></div>`).join('')}</div><div class="tip"><b>Pronunciation and usage tip:</b> ${escape(l.tip)}</div><div class="dialogue">${l.dialogue.map(([name,de,en])=>`<div class="speech"><span>${escape(name)}</span><strong>${escape(de)}</strong><div class="muted" style="font-size:11px;margin-top:5px">${escape(en)}</div></div>`).join('')}</div><div class="stage-foot"><button class="btn btn-outline" data-stage="discover">← Back</button><button class="btn btn-primary" data-stage="check">Check understanding ${icon('arrow')}</button></div>`;
    if(ui.stage==='check')return renderQuiz(l);
    return renderApply(l);
  }
  function renderQuiz(l){
    if(ui.questionIndex>=l.questions.length){const score=Object.values(ui.answers).filter(a=>a.correct).length;return `<div class="finish-panel"><span class="tag tag-dark">Practice completed</span><div class="finish-score">${score}/${l.questions.length}</div><h2>Good work — keep practising.</h2><p>Your score reflects these sample questions, not a certified language level. Review the explanation of anything you missed.</p><button class="btn btn-primary" data-stage="apply">Use it in a real sentence ${icon('arrow')}</button><button class="btn btn-ghost" data-retake style="margin-top:20px">Retake quiz</button></div>`;}
    const q=l.questions[ui.questionIndex];const answer=ui.answers[ui.questionIndex];const checked=ui.checked;return `<div class="quiz-counter">QUESTION ${ui.questionIndex+1} OF ${l.questions.length}</div><h2 style="margin-top:17px">${escape(q.q)}</h2><p>Choose an answer, check it and see why it works.</p><div class="choice-list">${q.options.map((opt,i)=>`<button class="choice ${ui.selected===i?'selected':''} ${checked&&i===q.correct?'correct':''} ${checked&&ui.selected===i&&i!==q.correct?'incorrect':''}" data-choice="${i}" ${checked?'disabled':''}>${escape(opt)}</button>`).join('')}</div>${checked?`<div class="feedback ${answer?.correct?'':'error'}"><b>${answer?.correct?'Correct!':'Not quite.'}</b> ${escape(q.why)}</div>`:''}<div class="stage-foot"><button class="btn btn-outline" data-stage="understand">← Review lesson</button>${checked?`<button class="btn btn-primary" data-next-question>${ui.questionIndex+1===l.questions.length?'See my result':'Next question'} ${icon('arrow')}</button>`:`<button class="btn btn-primary" data-check-answer ${ui.selected===null?'disabled':''}>Check answer ${icon('arrow')}</button>`}</div>`;
  }
  function renderApply(l){const draft=state.drafts[l.id]||'';const hasSubmission=state.submissions.some(s=>s.lessonId===l.id);const ready=ui.questionIndex>=l.questions.length;return `<h2>Your turn to use German</h2><p class="explain">Learning becomes useful when you form your own sentences. Write a response now and then try speaking it aloud.</p><div class="task-card"><strong>Teacher practice task</strong><p>${escape(l.apply)}</p><div class="study-note" style="margin-top:12px">Example: <b>${escape(l.sample)}</b></div></div><label class="form-field" for="student-response">Write your German response</label><textarea class="text-entry" id="student-response" data-draft="${l.id}" maxlength="600" placeholder="Schreiben Sie auf Deutsch …">${escape(draft)}</textarea><div class="stage-foot"><p>Saved locally in this browser. Your teacher can view it in this demonstration.</p><button class="btn btn-copper" data-submit-response="${l.id}" ${draft.trim().length<5?'disabled':''}>Send for teacher feedback ${icon('arrow')}</button></div>${hasSubmission?'<div class="status-success">✓ A written response from this lesson appears in the Teacher Studio review queue.</div>':''}<div class="recorder"><button class="btn btn-outline btn-small" data-record>${recording?'■ Stop recording':'● Record speaking'}</button>${recordedURL?`<audio controls src="${recordedURL}"></audio>`:'<span class="muted">Optional microphone practice stays on this device. It is not sent to your teacher.</span>'}</div><div class="stage-foot"><button class="btn btn-outline" data-stage="check">← Review quiz</button><button class="btn btn-primary" data-finish-lesson="${l.id}">${ready?'Finish lesson':'Complete quiz to finish'} ${icon('arrow')}</button></div>`;}

  function renderExperienceBuilder(){
    const existing=state.experiences.find(x=>x.id===ui.editingExperienceId);const t=experienceTemplate(existing?.kind||ui.builderKind);const e=existing||{...t,level:'A1'};
    const input=(name,label,value,max)=>`<label class="builder-field"><span>${label}</span><input data-builder-field="${name}" value="${escape(value)}" maxlength="${max}" /></label>`;
    const area=(name,label,value,max,rows)=>`<label class="builder-field"><span>${label}</span><textarea data-builder-field="${name}" maxlength="${max}" rows="${rows}">${escape(value)}</textarea></label>`;

  // A session is an ordered set of small reusable learning blocks. The static

  function sessionType(type){return composerTypes.find(t=>t.type===type)||composerTypes[0];}
  function sessionProgress(id){return state.sessionProgress[id]||{completed:[],answers:{},drafts:{}};}
  function mutableSessionProgress(id){if(!state.sessionProgress[id])state.sessionProgress[id]={completed:[],answers:{},drafts:{}};return state.sessionProgress[id];}
  function sessionDoneCount(session){const p=sessionProgress(session.id);return session.blocks.filter(b=>p.completed.includes(b.id)).length;}
  function sessionBlock(type){
    const id=`block-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
    const examples={
      vocabulary:{title:'Useful words',entries:'Guten Tag | hello / good day\nbitte | please\ndanke | thank you'},
      listening:{title:'Listen and repeat',phrase:'Guten Tag! Wie geht es Ihnen?',instruction:'Listen twice and repeat the phrase aloud.'},
      quiz:{title:'Check understanding',question:'Which phrase means thank you?',options:'Danke\nBitte\nHallo',correct:'0',explanation:'Danke is German for thank you.'},
      roleplay:{title:'Have a conversation',prompt:'Imagine a short everyday encounter. Write two lines of dialogue in German.',starter:'Guten Tag! Ich hätte gern ...',criteria:'Use a greeting, a polite request and a thank-you.'},
      assessment:{title:'Final knowledge check',question:'Which German expression is polite?',options:'Ein Wasser, bitte.\nGute Nacht!\nNein.',correct:'0',explanation:'Bitte makes the request polite.'}
    };
    return {id,type,...examples[type]};
  }
  function incompleteSessionBlock(session){
    return session.blocks.find(b=>{
      if(!b.title?.trim())return true;
      if(b.type==='vocabulary')return !(b.entries||'').split('\n').some(row=>{const pair=row.split('|');return pair.length===2&&pair.every(part=>part.trim());});
      if(b.type==='listening')return !b.phrase?.trim()||!b.instruction?.trim();
      if(b.type==='roleplay')return !b.prompt?.trim()||!b.starter?.trim()||!b.criteria?.trim();
      if(['quiz','assessment'].includes(b.type)){
        const options=(b.options||'').split('\n').filter(x=>x.trim());
        return !b.question?.trim()||!b.explanation?.trim()||options.length<2||!Number.isInteger(Number(b.correct))||Number(b.correct)<0||Number(b.correct)>=options.length;
      }
      return true;
    });
  }

session-draft>${ui.sessionPreviewDraft?'Hide student preview':'Preview as student →'}</button><button class="btn btn-outline" data-save-session="draft">Save draft</button><button class="btn btn-primary" data-save-session="published">Publish & assign →</button></div></div><aside class="composer-palette"><span class="eyebrow">Block library</span><h4>Make learning active.</h4><p>Combine explanation, listening, decisions and real-world practice.</p>${composerTypes.map(t=>`<button class="composer-palette-item" data-add-session-block="${t.type}"><span>${t.icon}</span><div><strong>${t.name}</strong><small>${t.hint}</small></div><b>+</b></button>`).join('')}<div class="composer-palette-foot">Each block is editable. Pronunciation uses the browser voice; assessments use teacher-defined answers.</div></aside></div>${ui.sessionPreviewDraft?sessionPreview(s):''}</section>`;

an></article>`;}).join('')}</div></div>${selected?sessionPreview(selected):''}</section>`;

  function speak(text){if(!('speechSynthesis' in window)){notify('Audio pronunciation is unavailable in this browser.');return;}const utterance=new SpeechSynthesisUtterance(text);utterance.lang='de-DE';utterance.rate=.83;const germanVoice=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('de'));if(germanVoice)utterance.voice=germanVoice;window.speechSynthesis.cancel();window.speechSynthesis.speak(utterance);}
  async function toggleRecording(){
    if(recording&&mediaRecorder){mediaRecorder.stop();recording=false;notify('Recording complete. Play it back below.');return;}
    if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){notify('Microphone recording is unavailable here.');return;}
    try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];mediaRecorder=new MediaRecorder(mediaStream);mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};mediaRecorder.onstop=()=>{if(recordedURL)URL.revokeObjectURL(recordedURL);recordedURL=URL.createObjectURL(new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'}));mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;render();};mediaRecorder.start();recording=true;render();notify('Recording locally — click stop when ready.');}catch{notify('Microphone access was declined or unavailable.');}
  }
  function handleAction(target){
    const button=target.closest('button');if(!button||button.disabled)return;
    if(button.hasAttribute('data-route'))return navigate(button.dataset.route);
    if(button.hasAttribute('data-role'))return navigate(button.dataset.role==='teacher'?'teacher':'student');
    if(button.hasAttribute('data-lesson')){if(ui.lessonId!==button.dataset.lesson)resetLessonUI(button.dataset.lesson);return navigate('lesson',button.dataset.lesson);}
    if(button.hasAttribute('data-open-experience'))return navigate('experience',button.dataset.openExperience);
    if(button.hasAttribute('data-open-session'))return navigate('session',button.dataset.openSession);
    if(button.hasAttribute('data-new-session'))return openSessionComposer(null);
    if(button.hasAttribute('data-edit-session'))return openSessionComposer(button.dataset.editSession);
    if(button.hasAttribute('data-close-session-composer')){ui.sessionComposerOpen=false;ui.sessionDraft=null;ui.sessionPreviewDraft=false;render();return;}
    if(button.hasAttribute('data-add-session-block')){ui.sessionDraft?.blocks.push(sessionBlock(button.dataset.addSessionBlock));ui.sessionPreviewDraft=false;render();return;}
    if(button.hasAttribute('data-remove-session-block')){ui.sessionDraft?.blocks.splice(Number(button.dataset.removeSessionBlock),1);ui.sessionPreviewDraft=false;render();return;}
    if(button.hasAttribute('data-move-session-block')){const [at,direction]=button.dataset.moveSessionBlock.split(':').map(Number);const blocks=ui.sessionDraft?.blocks||[];const to=at+direction;if(at>=0&&at<blocks.length&&to>=0&&to<blocks.length){[blocks[at],blocks[to]]=[blocks[to],blocks[at]];ui.sessionPreviewDraft=false;render();}return;}
    if(button.hasAttribute('data-preview-session-draft')){ui.sessionPreviewDraft=!ui.sessionPreviewDraft;render();document.querySelector('.session-preview')?.scrollIntoView?.({behavior:'smooth',block:'start'});return;}
    if(button.hasAttribute('data-preview-session')){ui.sessionPreviewId=ui.sessionPreviewId===button.dataset.previewSession?null:button.dataset.previewSession;ui.sessionPreviewDraft=false;render();document.querySelector('.session-preview')?.scrollIntoView?.({behavior:'smooth',block:'start'});return;}
    if(button.hasAttribute('data-close-session-preview')){ui.sessionPreviewId=null;ui.sessionPreviewDraft=false;render();return;}
    if(button.hasAttribute('data-save-session')){
      const s=ui.sessionDraft;if(!s)return;
      if(s.title.trim().length<4||s.description.trim().length<10||s.blocks.length===0){notify('Add a session title, learning goal and at least one block.');return;}
      if(button.dataset.saveSession==='published'){
        if(incompleteSessionBlock(s)){notify('Complete the content and answer key in every block before publishing.');return;}
      }
      const old=state.sessions.find(x=>x.id===ui.editingSessionId);
      const entry=JSON.parse(JSON.stringify({...s,id:old?.id||`session-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,status:button.dataset.saveSession,sample:old?.sample||false}));
      state.sessions=old?state.sessions.map(x=>x.id===entry.id?entry:x):[entry,...state.sessions];save();ui.sessionComposerOpen=false;ui.sessionDraft=null;ui.sessionPreviewDraft=false;ui.sessionPreviewId=entry.id;render();notify(entry.status==='published'?'Session assigned in the demo learner view.':'Session draft saved.');return;
    }
    if(button.hasAttribute('data-toggle-session')){const s=state.sessions.find(x=>x.id===button.dataset.toggleSession);if(!s)return;if(s.status!=='published'&&incompleteSessionBlock(s)){notify('Complete every block in the editor before publishing.');return;}s.status=s.status==='published'?'draft':'published';save();render();notify(s.status==='published'?'Session assigned in this browser.':'Session moved to drafts.');return;}
    if(button.hasAttribute('data-jump-session-step')){ui.sessionBlockIndex=Number(button.dataset.jumpSessionStep);render();return;}
    if(button.hasAttribute('data-complete-session-block')){const p=mutableSessionProgress(ui.sessionId);const id=button.dataset.completeSessionBlock;if(!p.completed.includes(id))p.completed.push(id);ui.sessionBlockIndex++;save();render();return;}
    if(button.hasAttribute('data-session-choice')){const s=state.sessions.find(x=>x.id===ui.sessionId);const b=s?.blocks[ui.sessionBlockIndex];if(b){ui.sessionSelection[b.id]=Number(button.dataset.sessionChoice);render();}return;}
    if(button.hasAttribute('data-check-session-answer')){const s=state.sessions.find(x=>x.id===ui.sessionId),b=s?.blocks[ui.sessionBlockIndex];if(!b||b.id!==button.dataset.checkSessionAnswer)return;const choice=ui.sessionSelection[b.id];if(choice===undefined)return;const p=mutableSessionProgress(s.id);p.answers[b.id]={blockId:b.id,choice,correct:choice===Number(b.correct)};if(!p.completed.includes(b.id))p.completed.push(b.id);save();render();return;}
    if(button.hasAttribute('data-retry-session-answer')){const p=mutableSessionProgress(ui.sessionId),id=button.dataset.retrySessionAnswer;delete p.answers[id];p.completed=p.completed.filter(x=>x!==id);delete ui.sessionSelection[id];save();render();return;}
    if(button.hasAttribute('data-submit-session-roleplay')){const s=state.sessions.find(x=>x.id===ui.sessionId),b=s?.blocks[ui.sessionBlockIndex];if(!b||b.id!==button.dataset.submitSessionRoleplay)return;const p=mutableSessionProgress(s.id),draft=(p.drafts[b.id]||'').trim();if(draft.length<5){notify('Write your conversation before sending.');return;}state.sessionSubmissions.unshift({id:`session-work-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,sessionId:s.id,blockId:b.id,text:draft});p.drafts[b.id]='';if(!p.completed.includes(b.id))p.completed.push(b.id);save();render();notify('Conversation sent to the demo teacher queue.');return;}
    if(button.hasAttribute('data-open-builder')){ui.builderKind=button.dataset.openBuilder;ui.editingExperienceId=null;ui.previewExperienceId=null;ui.builderOpen=true;render();document.getElementById('experience-builder')?.scrollIntoView?.({behavior:'smooth',block:'start'});return;}
    if(button.hasAttribute('data-edit-experience')){const x=state.experiences.find(e=>e.id===button.dataset.editExperience);if(!x)return;ui.builderKind=x.kind;ui.editingExperienceId=x.id;ui.previewExperienceId=null;ui.builderOpen=true;render();document.getElementById('experience-builder')?.scrollIntoView?.({behavior:'smooth',block:'start'});return;}

    if(button.hasAttribute('data-publish-experience')){const x=state.experiences.find(e=>e.id===button.dataset.publishExperience);if(!x)return;x.status=x.status==='published'?'draft':'published';save();notify(x.status==='published'?'Mission assigned to the demo learner.':'Mission moved to drafts.');render();return;}
    if(button.hasAttribute('data-save-experience')){
      const field=name=>(document.querySelector(`[data-builder-field="${name}"]`)?.value||'').trim();
      const title=field('title'),goal=field('goal'),prompt=field('prompt'),example=field('example'),criteria=field('criteria');
      if(title.length<4||goal.length<8||prompt.length<15||example.length<5||criteria.length<10){notify('Add a clear title, goal, instructions, example and success criteria.');return;}
      const old=state.experiences.find(x=>x.id===ui.editingExperienceId);const id=old?.id||`exp-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
      const entry={id,kind:old?.kind||ui.builderKind,title,goal,prompt,example,criteria,level:['A1','A2'].includes(field('level'))?field('level'):'A1',duration:field('duration')||'10',status:button.dataset.saveExperience==='publish'?'published':'draft',sample:old?.sample||false};
      state.experiences=old?state.experiences.map(x=>x.id===id?entry:x):[entry,...state.experiences];save();ui.builderOpen=false;ui.editingExperienceId=null;ui.previewExperienceId=id;render();notify(entry.status==='published'?'New mission assigned to the demo learner.':'Experience saved as a draft.');return;
    }
    if(button.hasAttribute('data-submit-experience')){const id=button.dataset.submitExperience;const x=state.experiences.find(e=>e.id===id&&e.status==='published');if(!x)return;const draft=(state.experienceDrafts[id]||'').trim();if(draft.length<5){notify('Write a response before submitting.');return;}state.experienceSubmissions.unshift({id:`mission-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,experienceId:id,text:draft});state.experienceDrafts[id]='';save();notify('Mission response sent to the demo teacher queue.');render();return;}
    if(button.hasAttribute('data-stage')){ui.stage=button.dataset.stage;render();return;}
    if(button.hasAttribute('data-speak'))return speak(button.dataset.speak);
    if(button.hasAttribute('data-choice')){if(!ui.checked){ui.selected=Number(button.dataset.choice);render();}return;}
    if(button.hasAttribute('data-check-answer')){const l=currentLesson();const q=l.questions[ui.questionIndex];if(ui.selected===null)return;ui.answers[ui.questionIndex]={chosen:ui.selected,correct:ui.selected===q.correct};ui.checked=true;render();return;}
    if(button.hasAttribute('data-next-question')){ui.questionIndex++;ui.selected=null;ui.checked=false;render();return;}
    if(button.hasAttribute('data-retake')){ui.questionIndex=0;ui.selected=null;ui.checked=false;ui.answers={};render();return;}
    if(button.hasAttribute('data-submit-response')){const id=button.dataset.submitResponse;const draft=(state.drafts[id]||'').trim();if(draft.length<5){notify('Write a sentence before submitting.');return;}state.submissions.unshift({id:`entry-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,lessonId:id,text:draft});save();notify('Response added to the demo teacher queue.');render();return;}
    if(button.hasAttribute('data-finish-lesson')){const l=currentLesson();if(Object.keys(ui.answers).length<l.questions.length){ui.stage='check';notify('Complete the three practice questions to finish.');render();return;}if(!state.completed.includes(l.id))state.completed.push(l.id);state.scores[l.id]=Math.round(100*Object.values(ui.answers).filter(x=>x.correct).length/l.questions.length);save();notify('Lesson progress saved on this device.');navigate('student');return;}
    if(button.hasAttribute('data-record')){toggleRecording();return;}
    if(button.hasAttribute('data-review')){const id=button.dataset.review;const note=(document.querySelector(`[data-feedback="${CSS.escape(id)}"]`)?.value||'').trim();if(note.length<5){notify('Write a short feedback note first.');return;}state.reviews[id]={note,at:new Date().toISOString()};save();notify('Review saved in this browser.');render();return;}
    if(button.hasAttribute('data-assignment')){state.assigned=button.dataset.assignment==='on';save();notify(state.assigned?'Assignment is visible to the demo learner.':'Demo assignment removed.');render();return;}
    if(button.hasAttribute('data-reset')){if(confirm('Clear lesson progress and local demo reviews from this browser?')){state=defaultState();save();resetLessonUI('hello');navigate('home');notify('Demo reset.');}return;}
  }
  root.addEventListener('click',e=>handleAction(e.target));
  function handleInput(e){
    const target=e.target;
    if(target.matches('[data-draft]')){const id=target.dataset.draft;state.drafts[id]=target.value;save();const submit=document.querySelector('[data-submit-response]');if(submit)submit.disabled=target.value.trim().length<5;}
    if(target.matches('[data-experience-draft]')){const id=target.dataset.experienceDraft;state.experienceDrafts[id]=target.value;save();const submit=document.querySelector('[data-submit-experience]');if(submit)submit.disabled=target.value.trim().length<5;}
    if(target.matches('[data-session-field]')&&ui.sessionDraft){ui.sessionDraft[target.dataset.sessionField]=target.value;}
    if(target.matches('[data-session-block-field]')&&ui.sessionDraft){const [i,field]=target.dataset.sessionBlockField.split(':');const b=ui.sessionDraft.blocks[Number(i)];if(b)b[field]=target.value;}
    if(target.matches('[data-session-answer-index]')&&ui.sessionDraft){const b=ui.sessionDraft.blocks[Number(target.dataset.sessionAnswerIndex)];if(b)b.correct=String(Number(target.value)-1);}
    if(target.matches('[data-session-writing]')){const p=mutableSessionProgress(ui.sessionId);p.drafts[target.dataset.sessionWriting]=target.value;save();const submit=document.querySelector('[data-submit-session-roleplay]');if(submit)submit.disabled=target.value.trim().length<5;}
  }
  root.addEventListener('input',handleInput);
  root.addEventListener('change',handleInput);
  window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
  window.addEventListener('beforeunload',()=>{if(recordedURL)URL.revokeObjectURL(recordedURL);mediaStream?.getTracks().forEach(t=>t.stop());});
  fetch('./data/tatoeba-cc0.json').then(r=>r.ok?r.json():null).then(data=>{if(data&&Array.isArray(data.sentences)){openPhrases=data.sentences;if(ui.route==='sources')render();}}).catch(()=>{});
  render();
})();

</script>
</body>
</html>
