  }
];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(number){const ch=data.find(x=>x.number===Number(number));if(!ch)return '';
return `<section class="chapter-study-guide" id="chapter-${ch.number}-start" aria-label="Chapter ${ch.number} study guide"><div class="chapter-study-head"><span class="eyebrow">Start here · Chapter understanding</span><h5>The big idea</h5><p>${esc(ch.intro)}</p><strong class="chapter-study-goal">${esc(ch.goal)}</strong></div>${ch.number===1?'<nav class="chapter-one-shortcuts" aria-label="Chapter 1 learning sections"><button type="button" data-jump-target="chapter-1-numbers">Learn numbers 1–20 ↓</button><button type="button" data-jump-target="chapter-1-spelling">Learn to spell your name ↓</button></nav>':''}<details class="chapter-study-patterns" open><summary>See four useful sentence patterns <span aria-hidden="true">↓</span></summary><div class="chapter-study-pattern-grid">${ch.patterns.map(([de,en,why])=>`<div class="chapter-study-pattern"><strong lang="de">${esc(de)}</strong><span>${esc(en)}</span><p>${esc(why)}</p><button type="button" class="view-link" data-speak="${esc(de)}" aria-label="Hear German example">♫ Listen</button></div>`).join('')}</div></details>${ch.number===1?(window.GERMAN_CH1_VISUAL_LAB?.render()||'')+(window.GERMAN_CHAPTER_ONE?.render()||''):(window.GERMAN_PREREQUISITES?.render(ch.number)||'')+(window.GERMAN_A11_VISUAL_EXTENSIONS?.render(ch.number)||'')+(window.GERMAN_A11_PHOTO_STUDIO?.render(ch.number)||'')+(window.GERMAN_A11_VISUAL_EXTENSIONS?.renderReview(ch.number)||'')}<details class="chapter-study-patterns" open><summary>Check your understanding <span aria-hidden="true">↓</span></summary><div class="chapter-study-selfcheck"><p><strong>Common mix-up:</strong> ${esc(ch.pitfall)}</p><p><strong>Try it:</strong> ${esc(ch.tryIt)}</p><details><summary>Reveal an original model answer</summary><p lang="de">${esc(ch.model)}</p></details></div></details></section>`;}
window.GERMAN_CHAPTER_STUDY={data,render};
})();

</script>
<script>
/* Chapter 2–6 original deeper reading and independent checks. Based on previously audited A1.1 chapter objectives; not publisher exercises. */
(()=>{'use strict';
const DATA={"edition":"Original Netzwerk A1.1","provenance":"Previously audited uploaded 166-page A1.1 Kurs- und Arbeitsbuch; chapter-level scope only; original instructional material pending teacher language QA","chapters":[{"number":2,"title":"Freunde, Kollegen und ich","coursebook":[17,26],"workbook":[88,99],"topics":[{"id":"c2-hobbies","title":"Talk about hobbies","goal":"Use an action with gern and ask about somebody else's interest.","explain":"A hobby becomes meaningful when you can do more than recognise its name. German often uses a verb followed by gern to say that you enjoy an activity: ich lese gern, ich schwimme gern or ich spiele gern Fußball. Begin with a complete sentence, then turn it into a question for another person. Notice that verbs change with the subject: ich spiele but du spielst. In an ordinary statement the conjugated verb normally takes second position. In a yes/no question it comes first. Build a two-person exchange instead of studying disconnected word lists.","examples":[["Ich spiele gern Tennis.","I enjoy playing tennis.","The action verb is followed by gern."],["Spielst du auch gern Tennis?","Do you also like playing tennis?","The yes/no question begins with spielst."],["Meine Freundin liest gern.","My friend likes reading.","The third-person verb takes the ending -t."]],"mistake":"Do not say Ich gern spiele Tennis. Keep spiele in second position in a statement.","check":{"question":"Choose the natural German sentence about enjoying music.","options":["Ich höre gern Musik.","Ich Musik hören gern.","Ich gern höre Musik."],"correct":0,"why":"Ich höre gern Musik uses the conjugated verb in second position and gern after it."}},{"id":"c2-calendar","title":"Days and meeting plans","goal":"Read a weekly plan and negotiate a meeting.","explain":"To arrange to meet, first find a day and then check availability. German weekdays are capitalised because they are nouns: Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag and Sonntag. Use am with a weekday, and combine it with expressions such as Zeit haben or sich treffen. A real conversation usually includes a question, a response and a possible alternative. Practise how to say that a day does not work without stopping the conversation. Look at a simple calendar, rather than memorising each day in isolation, and notice what happens when a time expression begins a sentence.","examples":[["Hast du am Donnerstag Zeit?","Do you have time on Thursday?","Am introduces the day."],["Am Freitag habe ich keine Zeit.","I have no time on Friday.","After the time phrase, habe still occupies the second position."],["Geht Samstag? Ja, gern.","Would Saturday work? Yes, gladly.","A simple way to agree on a new day."]],"mistake":"Am Donnerstag habe ich Zeit is correct; Am Donnerstag ich habe Zeit is not the usual statement order.","check":{"question":"Which invitation asks whether somebody has time on Tuesday?","options":["Hast du am Dienstag Zeit?","Haben ich Dienstag Zeit?","Wo ist die Dienstag?"],"correct":0,"why":"The correct yes/no question begins with Hast and uses am Dienstag."}},{"id":"c2-occupations","title":"Jobs and working hours","goal":"Recognise a simple occupational profile and describe work.","explain":"Short profiles commonly give a name, occupation, workplace and working hours. First find those facts before worrying about every unknown word. With sein, an occupation is usually named without ein or eine in a neutral job statement: Er ist Koch; Sie ist Ärztin. A workplace can then be expressed with arbeitet in. Work schedules use von … bis … followed by Uhr when necessary. Practising a complete profile helps you distinguish the occupation from the place where somebody works. It also reinforces pronouns and present-tense verb endings with er, sie, ich and wir.","examples":[["Lea ist Ärztin.","Lea is a doctor.","A profession after sein is normally stated without eine."],["Sie arbeitet im Krankenhaus.","She works in a hospital.","Arbeitet describes the workplace."],["Sie arbeitet von acht bis sechzehn Uhr.","She works from eight to sixteen o'clock.","Von ... bis ... states a time range."]],"mistake":"Do not use hat for the job in Sie hat Ärztin; use ist Ärztin.","check":{"question":"Which statement identifies a person's occupation?","options":["Er arbeitet Lehrer.","Er haben Lehrer.","Er ist Lehrer."],"correct":2,"why":"Er ist Lehrer uses sein to state the profession."}},{"id":"c2-articles","title":"Nouns, articles and plurals","goal":"Read nouns together with their articles and plural forms.","explain":"German nouns begin with capital letters and belong to grammatical genders. A noun should be learned together with der, die or das; the English meaning alone does not tell you the article. Plurals need separate attention because German uses several patterns: der Tag – die Tage, die Kollegin – die Kolleginnen, das Buch – die Bücher. The plural article is die, but that does not mean every singular noun takes die. Match article and noun on vocabulary cards, then add an example sentence and its plural. This helps you read professional profiles, hobbies and short texts accurately.","examples":[["der Tag – die Tage","the day – the days","A plural with -e."],["die Kollegin – die Kolleginnen","the female colleague – the female colleagues","A feminine noun with -nen in the plural."],["das Buch – die Bücher","the book – the books","The plural changes the vowel and adds -er."]],"mistake":"Do not assume a plural can always be made by adding -s.","check":{"question":"Which pair shows the correct plural of die Kollegin?","options":["die Kollegin – die Kolleginnen","die Kollegin – der Kollegin","die Kollegin – die Kollegins"],"correct":0,"why":"Kolleginnen is the ordinary plural; all plural nouns use die as the definite article."}},{"id":"c2-seasons","title":"Seasons, dates and short profiles","goal":"Connect leisure activities to the calendar.","explain":"A learner profile can include hobbies, days and seasons, but these are different kinds of time information. Use im with seasons: im Winter, im Frühling, im Sommer and im Herbst. Use am with weekdays, and practise numbers above twenty when you read ages, schedules and simple prices. To describe routines in a short profile, choose a person, an activity and a time phrase: Im Sommer fährt Jonas Rad. Starting with im Sommer puts the verb second; it does not change the person–verb agreement. Combine this with job information to write a believable three- or four-sentence introduction.","examples":[["Im Sommer fahre ich Rad.","I cycle in summer.","Im introduces a season."],["Am Montag arbeite ich.","I work on Monday.","Am introduces a weekday."],["Jonas ist Koch. Im Winter liest er gern.","Jonas is a cook. In winter he likes reading.","A short profile combines work and free time."]],"mistake":"Do not use am Sommer for a simple seasonal expression; use im Sommer.","check":{"question":"Which sentence refers to an activity in winter?","options":["Am Winter lese ich.","Im Winter lese ich gern.","Der Winter ich lese gern."],"correct":1,"why":"Im Winter is the expected phrase, with lese in second position."}}]},{"number":3,"title":"In der Stadt","coursebook":[27,36],"workbook":[100,111],"topics":[{"id":"c3-landmarks","title":"Places in the city","goal":"Identify public buildings and the nouns for them.","explain":"Start with an imagined city map and find a few recognisable places: der Bahnhof, das Rathaus, die Bank, das Museum and die Haltestelle. German nouns should be read with their articles because the article helps build later sentences. Ask Wo ist …? when you need the location of a known place. Ask Gibt es hier …? to find out whether a place exists nearby. Pictures and maps are useful only when their labels match the object being discussed. Say the full German phrase while pointing at the corresponding landmark rather than just naming a word from memory.","examples":[["Wo ist der Bahnhof?","Where is the station?","Wo asks for its location."],["Das ist das Rathaus.","That is the town hall.","The noun is paired with das."],["Gibt es hier eine Bank?","Is there a bank here?","The question asks whether the place exists."]],"mistake":"Do not learn Bahnhof without der, or Rathaus without das.","check":{"question":"What does das Rathaus identify?","options":["A museum","A town hall","A train station"],"correct":1,"why":"Rathaus is the town hall; Bahnhof is the railway station."}},{"id":"c3-articles","title":"Definite and indefinite articles","goal":"Introduce a place and refer to it again.","explain":"When a speaker introduces a new place, an indefinite article can be natural: Das ist ein Museum. After it is known, the speaker can refer to the same building with the definite article: Das Museum ist groß. Learn the pairs der/ein, die/eine and das/ein in simple nominative statements. These are not interchangeable endings. In a map conversation, one person can name an unfamiliar building and another can ask whether it is the same building they are looking for. Short contrastive examples help beginners see what articles do in context.","examples":[["Das ist ein Museum.","That is a museum.","An indefinite introduction."],["Das Museum ist groß.","The museum is big.","The same known museum."],["Das ist eine Schule. Die Schule ist alt.","That is a school. The school is old.","Feminine indefinite and definite forms."]],"mistake":"Do not use eine Museum; Museum takes das/ein in these examples.","check":{"question":"Which article completes Das ist ___ Museum?","options":["einen","ein","eine"],"correct":1,"why":"Museum is neuter and takes ein in this nominative phrase."}},{"id":"c3-negation","title":"Say that something is not there","goal":"Use kein to negate a noun phrase.","explain":"City conversations often involve something that cannot be found. One helpful pattern is Hier ist kein Bahnhof, meaning there is no station here. For feminine nouns, the form is keine: Hier ist keine Bank. Distinguish this from the general word nicht, which can negate other parts of a statement. Build the negative phrase around the noun rather than adding nein in front of an otherwise positive statement. It is useful to compare what a street has with what it does not have while looking at a small map. This gives the grammar a practical purpose.","examples":[["Hier ist ein Museum.","There is a museum here.","A positive noun phrase."],["Hier ist kein Museum.","There is no museum here.","The matching negative noun phrase."],["Hier ist keine Bank.","There is no bank here.","Feminine nouns use keine in this pattern."]],"mistake":"Nein Bahnhof is not a complete replacement for kein Bahnhof in a sentence.","check":{"question":"Choose the correct negative: Hier ist ___ Bank.","options":["kein","keinen","keine"],"correct":2,"why":"Die Bank is feminine, so the negative nominative article is keine."}},{"id":"c3-transport","title":"Use public transport words","goal":"Read a simple route notice and choose the right stop.","explain":"Transport vocabulary is easier when learned on a journey rather than as a list. Begin at der Bahnhof, find a bus or tram, then look for die Haltestelle. A passenger might ask Wo ist die Haltestelle? or Fährt der Bus zum Bahnhof? Practise recognising street names and stops before trying to give a route. A short notice can state a destination, a transport mode and a departure point. The task is to identify these three facts, not to translate every sign. Linking each phrase to a visual route helps students understand which direction or vehicle is appropriate.","examples":[["Wo ist die Haltestelle?","Where is the stop?","Asks for the stop's location."],["Ich fahre mit dem Bus.","I travel by bus.","A common useful phrase for transport."],["Der Bus fährt zum Bahnhof.","The bus goes to the station.","A route and destination."]],"mistake":"Do not confuse der Bahnhof (station) with die Haltestelle (stop).","check":{"question":"Which word identifies a bus or tram stop?","options":["das Rathaus","die Haltestelle","die Bäckerei"],"correct":1,"why":"Die Haltestelle is the stop; the other words name unrelated places."}},{"id":"c3-directions","title":"Give polite directions","goal":"Trace a route and give clear steps in order.","explain":"Directions must match the map. First locate a starting point and a destination; then trace the route with your finger. Combine geradeaus, links and rechts with a polite Sie command when speaking to a stranger: Gehen Sie bitte geradeaus. Biegen Sie dann rechts ab. Place the directions in order, because changing even one step may take the person elsewhere. Use Entschuldigung to ask politely and Danke at the end. Students should practise both understanding directions and producing them. A partner can check the instructions against the same simple map and identify the first step that goes wrong.","examples":[["Entschuldigung, wo ist das Museum?","Excuse me, where is the museum?","An appropriate opening request."],["Gehen Sie bitte geradeaus.","Please go straight ahead.","A polite instruction with Sie."],["Dann biegen Sie links ab.","Then turn left.","Dann signals the next step."]],"mistake":"Gehen Sie and Biegen Sie are polite commands; Gehst du is an ordinary question.","check":{"question":"Which polite direction means 'Turn right'?","options":["Rechts Sie biegen.","Biegen Sie rechts ab.","Gehen Sie links ab."],"correct":1,"why":"Biegen Sie rechts ab is a suitable polite imperative."}}]},{"number":4,"title":"Guten Appetit!","coursebook":[41,50],"workbook":[116,127],"topics":[{"id":"c4-meals","title":"Meals and food groups","goal":"Identify foods and talk about what you eat.","explain":"Learn food words through the situations in which they are needed. Frühstück, Mittagessen and Abendessen name meals; Brot, Käse, Obst and Gemüse name foods or food groups. German food nouns have articles that are worth learning with them: das Brot, der Käse, die Tomate. One useful starter exchange is Was isst du zum Frühstück? followed by a simple answer. Students should see real foods when possible and practise recognising them before composing long descriptions. Knowing whether a word is a meal, an ingredient or a place to shop prevents confusion in listening and reading tasks.","examples":[["Zum Frühstück esse ich Brot.","I eat bread for breakfast.","Names a meal and food."],["Der Käse ist frisch.","The cheese is fresh.","Käse takes der."],["Was isst du zum Mittagessen?","What do you eat for lunch?","A question about a meal."]],"mistake":"Do not treat die Bäckerei as a food; it is a shop.","check":{"question":"Which German word names the evening meal?","options":["das Abendessen","das Frühstück","das Mittagessen"],"correct":0,"why":"Das Abendessen is the evening meal."}},{"id":"c4-shops","title":"Where food is sold","goal":"Connect a product to the appropriate shop.","explain":"A shopping conversation becomes clearer when learners first identify where to buy something. Die Bäckerei is a bakery; die Metzgerei is a butcher's shop; der Markt may offer vegetables and other food. Ask whether the shop has the item before asking for a quantity. A short dialogue could begin Guten Tag. Haben Sie noch Brot? and continue Ja, natürlich. Students should distinguish a shop name from a food noun and listen for the central item in a request. Real shop photographs are helpful if they clearly show the product being discussed, rather than being only decorative.","examples":[["Ich gehe zur Bäckerei.","I am going to the bakery.","A place to buy bread."],["Haben Sie noch Brötchen?","Do you still have bread rolls?","Asks about availability."],["Ich kaufe Tomaten auf dem Markt.","I buy tomatoes at the market.","Connects an item to a place."]],"mistake":"Do not use die Metzgerei when the prompt is asking for the name of a bakery.","check":{"question":"Which shop is most suitable for bread rolls?","options":["die Apotheke","der Bahnhof","die Bäckerei"],"correct":2,"why":"Baked goods are commonly sold at a Bäckerei."}},{"id":"c4-quantities","title":"Quantities, lists and prices","goal":"Read a grocery list and ask how much something costs.","explain":"A useful shopping list contains quantities, not only item names. Compare zwei Tomaten, ein Stück Käse, eine Flasche Wasser and eine Packung Milch. These phrases help make the amount unambiguous. In a shop, you may ask Was kostet das? or Wie viel kostet das? and listen for the price. When several items are involved, ask Was kostet das zusammen? A reader should be able to find the needed quantity and total even if they do not understand every word on a receipt. Match the words to a drawn or photographed object and practise the full short request.","examples":[["Wir brauchen zwei Tomaten.","We need two tomatoes.","A countable quantity."],["Eine Packung Milch, bitte.","One carton of milk, please.","A packaging unit."],["Was kostet das zusammen?","How much is that altogether?","Requests a total."]],"mistake":"Eine Milch can be understood in some contexts, but eine Packung Milch is clearer for a carton on a list.","check":{"question":"Which phrase clearly requests a carton of milk?","options":["ein Milch","eine Packung Milch","einen Packung Milch"],"correct":1,"why":"Eine Packung Milch specifies the unit and matches Packung's feminine article."}},{"id":"c4-accusative","title":"Objects and the accusative","goal":"See why der becomes den in common purchase sentences.","explain":"In Das ist der Saft, the juice is the subject complement and the familiar nominative article is der. In Ich kaufe den Saft, the juice is the direct object of kaufe, and the masculine article changes to den. The parallel indefinite pair is ein → einen. In these simple examples, feminine die/eine and neuter das/ein do not change their form. Practice with full sentences instead of an isolated grammar table: Ich kaufe einen Apfel, eine Tomate und ein Brot. Ask what is being bought and identify the noun. Once the student understands the purpose, article choices become easier to remember.","examples":[["Der Apfel ist rot.","The apple is red.","Masculine nominative subject."],["Ich kaufe den Apfel.","I buy the apple.","Masculine accusative object."],["Ich kaufe einen Apfel und eine Tomate.","I buy an apple and a tomato.","Only the masculine indefinite article changes here."]],"mistake":"Ich kaufe ein Apfel is incorrect for an accusative masculine noun.","check":{"question":"Complete: Ich kaufe ___ Apfel.","options":["einen","ein","eine"],"correct":0,"why":"Apfel is masculine, so the direct object takes einen."}},{"id":"c4-shop-dialogue","title":"A complete shop exchange","goal":"Use greetings, requests, prices and thanks naturally.","explain":"To practise communication rather than isolated vocabulary, work through an entire short shopping situation. The customer greets the shopkeeper, asks for an item, checks the quantity or price, and ends politely. The shopkeeper may ask Sonst noch etwas?, meaning Anything else? Each line should have a clear purpose. A useful independent practice task gives the student a short list of food items and asks them to choose appropriate quantities. A partner acts as the seller and replies with prices. This is shop language for Chapter 4; a longer sit-down restaurant exchange is studied in Chapter 6.","examples":[["Guten Tag. Ich möchte zwei Brötchen.","Good day. I'd like two rolls.","A clear opening purchase request."],["Sonst noch etwas? Nein, danke.","Anything else? No, thanks.","Closes the ordering phase."],["Das macht drei Euro. Danke!","That's three euros. Thanks!","A short payment exchange."]],"mistake":"A shop exchange is not complete if it only gives a food word without a request.","check":{"question":"Which reply politely closes an offer of another item?","options":["Nein, danke.","Ich bin Arzt.","Wo wohnst du?"],"correct":0,"why":"Nein, danke politely declines an additional item."}}]},{"number":5,"title":"Tag für Tag","coursebook":[51,60],"workbook":[128,139],"topics":[{"id":"c5-clocks","title":"Read analogue and digital time","goal":"Translate a time into everyday German language.","explain":"Time-telling is easiest when a student can see both the clock and the corresponding phrase. For 07:30, you may hear sieben Uhr dreißig or halb acht. The everyday phrase halb acht means half an hour before eight, not after it. Viertel nach acht is 08:15, while Viertel vor neun is 08:45. First practise recognising the hands or digits, then speak the German expression. When scheduling an event, add um to a precise time: Der Kurs beginnt um acht Uhr. Listening exercises should check whether the learner understood the hour, not just repeated a familiar sound.","examples":[["Es ist halb acht.","It is 7:30.","Halfway to eight."],["Es ist Viertel nach acht.","It is 8:15.","A quarter past eight."],["Der Kurs beginnt um neun Uhr.","The course starts at nine.","Um introduces a precise time."]],"mistake":"Halb neun is 08:30, not 09:30.","check":{"question":"Which time does halb neun indicate?","options":["09:30","09:15","08:30"],"correct":2,"why":"Halb neun means thirty minutes before nine."}},{"id":"c5-routine","title":"Describe a daily routine","goal":"Use time expressions with everyday actions and separable verbs.","explain":"A daily routine is a sequence, so start with the order of activities. Ich stehe um sieben Uhr auf, ich frühstücke um halb acht, and danach gehe ich zur Arbeit are linked statements about one day. Some common verbs are separable: aufstehen becomes ich stehe … auf in a simple statement. Notice that the verb stays in its usual position but its prefix appears at the end. If the time phrase begins the sentence, the finite verb remains second: Um sieben Uhr stehe ich auf. A short timetable helps students connect grammar with the order of their day.","examples":[["Ich stehe um sieben Uhr auf.","I get up at seven.","Auf stands at the end."],["Um halb acht frühstücke ich.","I have breakfast at 7:30.","The finite verb follows the initial time phrase."],["Danach gehe ich zur Arbeit.","Afterwards I go to work.","Danach orders the routine."]],"mistake":"Ich aufstehe um sieben Uhr is not the ordinary finite sentence pattern.","check":{"question":"Which sentence correctly uses aufstehen?","options":["Ich aufstehe um sieben Uhr.","Ich stehe um sieben Uhr auf.","Ich stehen auf sieben Uhr."],"correct":1,"why":"A separable verb places the prefix auf at the end."}},{"id":"c5-family","title":"Family and possessive words","goal":"Introduce family members with mein or meine.","explain":"When talking about family, learn both the relationship word and its grammatical gender: der Vater, die Mutter, das Kind. Possessive forms agree with the noun in these nominative patterns. Compare mein Vater, meine Mutter and mein Kind. This does not mean you change the form according to whether the speaker is male or female. Create a simple family profile with a name, relationship and one activity. A meaningful reading task might show a family photo with captions, asking which person is described. The captions should explicitly state the relationships rather than expecting students to guess them from appearance.","examples":[["Das ist mein Vater.","This is my father.","Vater is masculine."],["Das ist meine Mutter.","This is my mother.","Mutter is feminine."],["Mein Bruder arbeitet heute.","My brother is working today.","A possessive and a simple statement."]],"mistake":"Meine Vater is incorrect in this nominative phrase; use mein Vater.","check":{"question":"Which phrase is right for 'my mother'?","options":["meinen Mutter","mein Mutter","meine Mutter"],"correct":2,"why":"Mutter is feminine, so meine is used here."}},{"id":"c5-modal","title":"Modal verbs and sentence structure","goal":"Use können or müssen with a second verb.","explain":"Modal verbs express ability, possibility, necessity or desire. The modal changes with the person while the other verb remains an infinitive toward the end of the clause: Ich kann morgen kommen. Ich muss heute arbeiten. In a yes/no question, the modal comes first: Kannst du morgen kommen? The two-part structure is easier to understand if students highlight the conjugated modal and then the final action. Use real appointment or daily-routine examples rather than filling an arbitrary gap. Learners should be able to decline politely and explain why they cannot attend.","examples":[["Ich kann am Dienstag kommen.","I can come on Tuesday.","Können introduces the ability or possibility."],["Ich muss heute arbeiten.","I must work today.","Arbeiten is the final infinitive."],["Kannst du morgen kommen?","Can you come tomorrow?","The modal opens the yes/no question."]],"mistake":"Ich kann kommen morgen sounds unnatural for the intended simple sentence; keep kommen at the end.","check":{"question":"Complete: Ich ___ heute arbeiten.","options":["musst","muss","müssen"],"correct":1,"why":"Ich takes muss, followed by infinitive arbeiten."}},{"id":"c5-appointments","title":"Make, move and decline appointments","goal":"Combine a weekday and time in a polite message.","explain":"An appointment message should include a day, a time and a clear response. In German, am introduces a weekday and um introduces an exact hour: Haben Sie am Mittwoch um elf Uhr Zeit? A refusal can be polite and useful: Tut mir leid, am Mittwoch kann ich nicht. Then offer a realistic alternative instead of ending with no. A weekly calendar gives students enough information to check whether an appointment can actually be accepted. Practise reading a date and time from a note, proposing a new appointment, and confirming the final plan so both speakers agree on the same details.","examples":[["Haben Sie am Mittwoch Zeit?","Are you free on Wednesday?","Am introduces the weekday."],["Um elf Uhr habe ich Zeit.","I am free at eleven.","Um introduces the hour."],["Tut mir leid, am Donnerstag kann ich nicht.","Sorry, I can't on Thursday.","A polite decline using a modal."]],"mistake":"Do not mix up am for weekday and um for the clock time.","check":{"question":"Which question asks about an appointment at 11 on Wednesday?","options":["Haben Sie im Mittwoch elf Uhr Zeit?","Haben Sie am Mittwoch um elf Uhr Zeit?","Haben Sie um Mittwoch am elf Zeit?"],"correct":1,"why":"Use am Mittwoch and um elf Uhr."}}]},{"number":6,"title":"Zeit mit Freunden","coursebook":[61,70],"workbook":[140,151],"topics":[{"id":"c6-calendar","title":"Dates and invitations","goal":"Read a date correctly and give essential event details.","explain":"An invitation gives more than an activity name. A useful message states the occasion, date, time and place, then asks for a reply. German dates after am generally use an ordinal form: am dritten Mai, am vierzehnten Juni. When listening to an announcement, identify these pieces of information one at a time. A student can first highlight the date on a card, then write a short invitation and compare it with a sample. The writing task should be simple enough for an A1 beginner while still conveying where and when the guest should arrive.","examples":[["Ich habe am vierzehnten Juni Geburtstag.","My birthday is on 14 June.","The date uses an ordinal."],["Die Feier ist um vier Uhr.","The celebration is at four.","Um introduces the time."],["Kommst du am Samstag?","Are you coming on Saturday?","A direct invitation question."]],"mistake":"Am vierzehn Juni is not the full ordinal form used in this date phrase.","check":{"question":"Which phrase means 'on 3 May'?","options":["am drei Mai","am dritten Mai","um dritte Mai"],"correct":1,"why":"Am dritten Mai uses the ordinal with -ten in this example."}},{"id":"c6-plans","title":"Leisure plans and separable verbs","goal":"Use einladen and prepare a reply to an invitation.","explain":"A social plan can be accepted, declined or changed. The separable verb einladen illustrates how German verbs can split in ordinary present-tense statements: Ich lade dich ein. With a day added, Ich lade dich am Samstag ein. Similar everyday verbs can behave this way, so students should look at the whole sentence rather than searching only for a dictionary form. An invitation exchange is complete when the guest replies. Learn Ja, gern and Leider kann ich nicht before attempting a longer explanation. A practical activity lets students choose a real date from a calendar and propose an alternative when they are busy.","examples":[["Ich lade dich morgen ein.","I invite you tomorrow.","Lade and ein belong to einladen."],["Danke für die Einladung!","Thank you for the invitation!","A friendly reply."],["Leider kann ich nicht kommen.","Unfortunately I can't come.","A polite refusal with final infinitive."]],"mistake":"Ich einlade dich is incorrect in an ordinary finite statement.","check":{"question":"Choose the correctly separated statement.","options":["Ich laden dich morgen ein.","Ich einlade dich morgen.","Ich lade dich morgen ein."],"correct":2,"why":"The finite form is lade and the separated prefix is ein."}},{"id":"c6-restaurant","title":"A restaurant conversation","goal":"Order, check the total and ask for the bill.","explain":"A restaurant exchange follows a sequence: greeting, menu, ordering, a short response and payment. Practise identifying the stage of the exchange before focusing on grammatical endings. A useful customer phrase is Ich möchte eine Suppe, bitte. A waiter may ask Möchten Sie noch etwas? At the end, Die Rechnung, bitte is a common way to request the bill. A sample menu or receipt can connect words to prices, but the amounts must be internally consistent. Learners should rehearse a complete two-person exchange and verify that each line responds naturally to the previous one. This is different from the grocery-shop task in Chapter 4.","examples":[["Ich möchte eine Suppe, bitte.","I'd like a soup, please.","Polite ordering."],["Möchten Sie noch etwas?","Would you like anything else?","A server's follow-up question."],["Die Rechnung, bitte.","The bill, please.","Requests payment."]],"mistake":"Die Speisekarte (menu) and die Rechnung (bill met or invited. The student should be able to identify whether the event is about now or yesterday from the verb and the time expression.","examples":[["Heute bin ich im Café.","Today I am at the café.","Present form bin."],["Gestern war ich im Café.","Yesterday I was at the café.","Past form war."],["Ich hatte gestern Zeit.","I had time yesterday.","Past form hatte."]],"mistake":"War is the past of sein, not a general past marker for every verb.","check":{"question":"Which means 'Yesterday I had time'?","options":["Gestern habe ich Zeit morgen.","Gestern bin ich Zeit.","Gestern hatte ich Zeit."],"correct":2,"why":"Hatte is the simple past form of haben."}}]}]};

reader-selfcheck"><span class="eyebrow">Check your understanding</span><h6>${esc(t.check.question)}</h6><div class="reader-choices">${t.check.options.map((o,j)=>`<button type="button" data-reader-choice="${esc(t.id)}|${j}" ${answer?'disabled':''} class="${answer&&j===t.check.correct?'right':answer&&j===answer.chosen?'wrong':''}" aria-pressed="${answer?String(j===answer.chosen):'false'}">${esc(o)}</button>`).join('')}</div>${answer?`<p class="reader-feedback ${answer.correct?'right':'review'}"><strong>${answer.correct?'Correct.':'Review the pattern.'}</strong> ${esc(t.check.why)} <button type="button" class="view-link" data-reader-retry="${esc(t.id)}">Try again</button></p>`:''}</div></div></details>`;}).join('')}</div><p class="reader-source-note">Reference: original A1.1 Kursbuch PDF pages ${c.coursebook[0]}–${c.coursebook[1]}; corresponding Arbeitsbuch pages ${c.workbook[0]}–${c.workbook[1]}. No publisher text, artwork or audio reproduced.</p></div></details></section>`;

<script>
/* Original image-led reinforcement, separate from protected textbook exercises. */
(()=>{
 const indices={1:[0,1],2:[0,1],3:[1,2],4:[0,1],5:[0,2],6:[0,1]};
 const data=()=>window.GERMAN_RICH_SCENES?.data?.chapters||{};
 const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const get=(chapter,index)=>{
   const n=Number(chapter),i=Number(index),photo=data()[n]?.[indices[n]?.[i]];
   if(!photo||!Number.isInteger(i)||i<0||i>1)return null;
   const chapterScenes=data()[n]||[],other=chapterScenes.filter((_,j)=>j!==indices[n][i]);
   const wrong1=other[0]?.de,wrong2=other[1]?.de;
   if(!wrong1||!wrong2)return null;
   const correct=(n+i)%3,options=[wrong1,wrong2];options.splice(correct,0,photo.de);
   return {photo,question:'Look at the picture. Which German sentence fits this everyday situation?',options,correct,why:photo.cue+'. '+photo.de};
 };
 const stats=(chapter,progress={})=>{
   const n=Number(chapter),items=[0,1].filter(i=>get(n,i));
   return {answered:items.filter(i=>progress[n+':'+i]).length,correct:items.filter(i=>progress[n+':'+i]?.correct).length,total:items.length};
 };
 const render=(chapter,progress={},selection={})=>{
   const n=Number(chapter),tasks=[get(n,0),get(n,1)];if(tasks.some(x=>!x))return '';
   const score=stats(n,progress);
   return '<section class="photo-practice" aria-label="Chapter '+n+' picture practice"><div class="visual-section-title">'+
     '<span class="eyebrow">Look · Choose · Say</span><h2>German through real-life pictures</h2>'+
     '<p>Look at each photograph, choose a phrase that belongs in the situation, and listen to the model after checking. Original exercises awaiting German-teacher review.</p>'+
     '<strong>'+score.answered+'/'+score.total+' attempted · '+score.correct+' correct</strong></div><div class="photo-practice-grid">'+
     tasks.map((q,i)=>{
       const key=n+':'+i,answer=progress[key],selected=answer?answer.chosen:selection[key],p=q.photo;
       return '<article class="card photo-practice-card"><figure><img src="'+esc(p.src)+'" alt="'+esc(p.alt)+'" loading="lazy" decoding="async" referrerpolicy="no-referrer"/>'+
         '<figcaption>Photo: <a href="'+esc(p.source)+'" target="_blank" rel="noopener noreferrer">Pexels / '+esc(p.credit)+'</a></figcaption></figure>'+
         '<div class="photo-practice-content"><span class="eyebrow">Scene '+(i+1)+'</span><h3>'+esc(q.question)+'</h3>'+
         '<div class="photo-practice-choices">'+q.options.map((phrase,j)=>'<button type="button" lang="de" class="choice '+(selected===j?'selected ':'')+
         (answer&&j===q.correct?'correct ':'')+(answer&&j===answer.chosen&&!answer.correct?'incorrect':'')+
         '" data-photo-choice="'+key+':'+j+'" '+(answer?'disabled':'')+'>'+esc(phrase)+'</button>').join('')+'</div>'+
         (answer?'<div class="feedback '+(answer.correct?'':'error')+'"><b>'+(answer.correct?'Correct!':'Not quite.')+'</b> '+esc(q.why)+
           '<button type="button" class="view-link" data-speak="'+esc(q.options[q.correct])+'">♫ Listen to the model</button></div>'+
           '<button type="button" class="view-link" data-photo-retry="'+key+'">Retry scene</button>':
           '<button type="button" class="btn btn-primary btn-small" data-photo-check="'+key+'" '+(selected===undefined?'disabled':'')+'>Check phrase</button>')+
         '</div></article>';
     }).join('')+'</div><p class="workbook-disclaimer">Photographs require internet access. Alternative text describes the scene. Scores remain in this browser only.</p></section>';
 };
 window.GERMAN_PHOTO_PRACTICE={get,stats,render};
})();

<script>
/* Phase 3: original, original-edition Netzwerk A1.1 visual situation lessons. Not copied from textbook pages or artwork. Teacher validation required. */
(()=>{
'use strict';
const data={"a11-greetings":{"chapter":1,"title":"Greeting choices","tiles":[["Classmate","du","informal"],["Teacher","Sie","polite"],["Farewell","Auf Wiedersehen","polite"]],"scenes":[{"name":"Meeting a classmate","context":"A new learner sits beside you. Greet them and ask their name without using an overly formal expression.","model":"Hallo! Ich heiße Sara. Wie heißt du?","translation":"Hello! My name is Sara. What is your name?","insight":"Use du with a classmate; the matching verb is heißt. A greeting followed by a short question starts the conversation naturally.","question":"Which question fits a classmate?","options":["Wie heißen Sie?","Wie heißt du?","Was kostet das?"],"correct":1,"why":"Wie heißt du? is the informal name question."},{"name":"Meeting a teacher","context":"You enter the school office and speak to an unfamiliar teacher. Use the polite form consistently.","model":"Guten Tag. Ich bin Leon. Wie heißen Sie?","translation":"Good day. I am Leon. What is your name?","insight":"Formal Sie takes the conjugated verb heißen and starts with a capital letter. Avoid mixing du and Sie in the same formal exchange.","question":"Which question is polite?","options":["Wie heißen Sie?","Wie heißt du?","Was machst du?"],"correct":0,"why":"Wie heißen Sie? correctly pairs Sie with heißen."},{"name":"Saying goodbye","context":"The conversation at the school office has ended. Choose a farewell suitable for the person and setting.","model":"Vielen Dank. Auf Wiedersehen!","translation":"Thank you very much. Goodbye!","insight":"Auf Wiedersehen is a reliable polite farewell. Tschüss suits friends; Gute Nacht is usually said before going to sleep.","question":"Choose a polite farewell.","options":["Gute Nacht!","Hallo!","Auf Wiedersehen!"],"correct":2,"why":"Auf Wiedersehen is a polite farewell."}]},"a11-origin-spelling":{"chapter":1,"title":"Names and places","tiles":[["Vorname","Lea","first name"],["Land","Indien","country"],["Buchstaben","L · E · A","spelling"]],"scenes":[{"name":"Origin versus home","context":"Someone asks where you come from and where you currently live. These are two different questions.","model":"Ich komme aus Indien. Ich wohne in Berlin.","translation":"I come from India. I live in Berlin.","insight":"Woher? is about origin and often uses komme aus. Wo? asks for location and can be answered with wohne in.","question":"Which asks about origin?","options":["Woher kommst du?","Wo wohnst du?","Wie heißt du?"],"correct":0,"why":"Woher means from where."},{"name":"Spell your name","context":"At reception your name is hard to hear. Repeat it and offer the letters one by one.","model":"Mein Name ist Lea: L – E – A.","translation":"My name is Lea: L – E – A.","insight":"Wie schreibt man das? is useful for asking how something is spelled. The letters should be spoken separately.","question":"Which asks for a spelling?","options":["Wo ist das?","Wie schreibt man das?","Was kostet das?"],"correct":1,"why":"Wie schreibt man das? asks how it is written."},{"name":"Languages you speak","context":"You meet learners with different languages. Give a short, truthful answer about your German.","model":"Ich spreche Englisch und ein bisschen Deutsch.","translation":"I speak English and a little German.","insight":"Use sprechen for languages. The ich form is spreche and the du form is sprichst. Ein bisschen means a little.","question":"Complete: Ich ___ Deutsch.","options":["sprichst","sprechen","spreche"],"correct":2,"why":"The ich form is spreche."}]},"a11-hobbies":{"chapter":2,"title":"Interests and plans","tiles":[["Montag","Musik","busy"],["Donnerstag","frei","available"],["Freitag","Kino","plan"]],"scenes":[{"name":"Describe a hobby","context":"Two classmates are comparing interests. Say which activity you enjoy instead of only naming the activity.","model":"Ich lese gern. Und du?","translation":"I like reading. And you?","insight":"Verb plus gern expresses enjoyment: Ich lese gern. Gut describes doing something well; it does not mean the same as gern.","question":"Which expresses enjoyment?","options":["Ich spiele gern Tennis.","Ich bin Tennis.","Ich habe Tennis gut."],"correct":0,"why":"Gern after the verb expresses enjoyment."},{"name":"Ask about a day","context":"You want to see a film on Friday. Check whether your classmate can join you.","model":"Hast du am Freitag Zeit?","translation":"Do you have time on Friday?","insight":"Use am before weekdays: am Freitag, am Montag. Hast du … Zeit? is a practical invitation question.","question":"Which asks about Friday?","options":["Wo ist Freitag?","Hast du am Freitag Zeit?","Wie heißt Freitag?"],"correct":1,"why":"Am Freitag means on Friday."},{"name":"Offer another day","context":"Your friend is unavailable today but free tomorrow. Keep the plan alive by suggesting a different time.","model":"Heute habe ich keine Zeit. Morgen geht es.","translation":"I have no time today. Tomorrow works.","insight":"Heute and morgen can start a sentence. The conjugated verb still follows in second position: Morgen geht es.","question":"Which says tomorrow works?","options":["Ich bin morgen nicht.","Heute ist Dienstag.","Morgen geht es."],"correct":2,"why":"Morgen geht es means tomorrow works."}]},"a11-jobs-seasons":{"chapter":2,"title":"Work and seasons","tiles":[["Name","Jonas","person"],["Beruf","Koch","job"],["Arbeitszeit","10–18 Uhr","hours"]],"scenes":[{"name":"Read a job profile","context":"A short profile lists someone's occupation and workplace. Tell the two facts apart.","model":"Jonas ist Koch. Er arbeitet im Restaurant.","translation":"Jonas is a cook. He works in a restaurant.","insight":"A profession after sein is commonly used without an indefinite article: Er ist Koch. Use arbeitet to describe the workplace.","question":"Which describes a profession?","options":["Er ist Koch.","Er hat Koch.","Er sein Koch."],"correct":0,"why":"Er ist Koch is a natural occupation statement."},{"name":"Understand work hours","context":"The job profile shows the person's shift. Describe the hours using an interval expression.","model":"Ich arbeite von zehn bis achtzehn Uhr.","translation":"I work from ten until eighteen o’clock.","insight":"Von … bis … means from … until … and works with opening hours, shifts and travel times.","question":"Which gives an interval?","options":["am zehn nach achtzehn","von zehn bis achtzehn Uhr","bei zehn achtzehn"],"correct":1,"why":"Von … bis … gives a time range."},{"name":"Choose a season","context":"You describe an activity you like in summer. The time expression starts your sentence.","model":"Im Sommer fahre ich gern Rad.","translation":"In summer I like cycling.","insight":"Im Sommer and im Winter name seasons. When the time phrase begins the sentence, the verb comes next.","question":"Choose correct word order.","options":["Im Sommer ich fahre Rad.","Sommer ich Rad fahre.","Im Sommer fahre ich Rad."],"correct":2,"why":"Fahre follows the opening time phrase."}]},"a11-city-places":{"chapter":3,"title":"Places in town","tiles":[["der Bahnhof","station","masculine"],["das Museum","museum","neuter"],["die Bank","bank","feminine"]],"scenes":[{"name":"Read the labels","context":"A visitor studies a town map with public buildings. Say the names with their correct articles.","model":"Das Museum ist in der Stadt.","translation":"The museum is in the city.","insight":"Learn nouns and articles together: der Bahnhof, das Museum, die Bank. The article is an important part of the German word.","question":"Which article goes with Museum?","options":["die Museum","das Museum","der Museum"],"correct":1,"why":"Museum is neuter: das Museum."},{"name":"Identify a station","context":"A city visitor points to a station on the map. Use an indefinite article to introduce this place.","model":"Das ist ein Bahnhof.","translation":"That is a train station.","insight":"Bahnhof is masculine, so a newly identified place is ein Bahnhof when it follows ist in this simple sentence. The later accusative einen is introduced in Chapter 4.","question":"Complete: Das ist ___ Bahnhof.","options":["einen","ein","eine"],"correct":1,"why":"Bahnhof is masculine and ein is the nominative indefinite article here."},{"name":"What is not here?","context":"A map does not show a bank at the marked location. State that there is no bank here.","model":"Hier ist keine Bank.","translation":"There is no bank here.","insight":"Use keine with the feminine noun Bank in this nominative sentence. It is the negative form paired with eine.","question":"Which says there is no bank here?","options":["Hier ist nicht Bank.","Hier ist keinen Bank.","Hier ist keine Bank."],"correct":2,"why":"Die Bank is feminine, so a negative nominative phrase uses keine Bank."}]},"a11-city-directions":{"chapter":3,"title":"Finding your way","tiles":[["Start","Bahnhof","station"],["Weg","geradeaus","straight"],["Ziel","Museum","destination"]],"scenes":[{"name":"Ask for directions","context":"You have reached the train station but cannot find the museum. Get someone's attention politely.","model":"Entschuldigung, wo ist das Museum?","translation":"Excuse me, where is the museum?","insight":"Entschuldigung is a polite opening. Wo ist …? asks for the location of a particular place.","question":"Which asks where the museum is?","options":["Wo ist das Museum?","Wie heißt das Museum?","Was kostet das Museum?"],"correct":0,"why":"Wo ist …? is a location question."},{"name":"Follow the route","context":"A passer-by tells you to go straight, then turn right. Identify the direction words.","model":"Gehen Sie geradeaus und dann rechts.","translation":"Go straight ahead and then right.","insight":"Geradeaus means straight, rechts means right, and links means left. Gehen Sie is a polite imperative.","question":"Which means right?","options":["links","rechts","geradeaus"],"correct":1,"why":"Rechts means right."},{"name":"Travel by bus","context":"Your destination is too far to walk. Ask whether the bus goes there.","model":"Fährt der Bus zum Museum?","translation":"Does the bus go to the museum?","insight":"A yes/no question often puts the conjugated verb first. Zum combines zu and dem.","question":"Which asks about the bus?","options":["Wo Bus Museum?","Der Bus ist Museum?","Fährt der Bus zum Museum?"],"correct":2,"why":"Fährt starts the yes/no question."}]},"a11-food-shops":{"chapter":4,"title":"Meals and shopping","tiles":[["Frühstück","morning","breakfast"],["Mittagessen","midday","lunch"],["Abendessen","evening","dinner"]],"scenes":[{"name":"Name the meal","context":"A weekly plan shows food for the morning, midday and evening. Identify the midday meal.","model":"Zum Mittagessen gibt es Brot und Käse.","translation":"For lunch there is bread and cheese.","insight":"Frühstück is breakfast, Mittagessen is lunch and Abendessen is the evening meal. Keep the articles with food nouns.","question":"Which means lunch?","options":["das Mittagessen","das Frühstück","das Abendessen"],"correct":0,"why":"Mittagessen names the midday meal."},{"name":"Check the cupboard","context":"Before shopping, work out what the household already has and what it needs.","model":"Haben wir Tomaten? Nein, wir brauchen Tomaten.","translation":"Do we have tomatoes? No, we need tomatoes.","insight":"Haben wir …? checks availability. Wir brauchen … states a need. Together they support a real shopping conversation.","question":"Which means we need tomatoes?","options":["Wir heißen Tomaten.","Wir brauchen Tomaten.","Wir wohnen Tomaten."],"correct":1,"why":"Brauchen means need."},{"name":"Choose a shop","context":"You want fresh bread rolls for the morning. Match the food to the right kind of shop.","model":"Ich kaufe Brötchen in der Bäckerei.","translation":"I buy rolls at the bakery.","insight":"A Bäckerei sells bread and rolls. Use in der Bäckerei when describing where the purchase happens.","question":"Where can you buy Brötchen?","options":["in der Bank","im Museum","in der Bäckerei"],"correct":2,"why":"Brötchen are usually bought at a bakery."}]},"a11-accusative-restaurant":{"chapter":4,"title":"In the shop","tiles":[["der Apfel","apple","noun"],["einen Apfel","an apple","object"],["zwei Äpfel","two apples","quantity"]],"scenes":[{"name":"Choose an object","context":"You add an apple to your basket. Say what you are buying and notice the article.","model":"Ich kaufe einen Apfel.","translation":"I am buying an apple.","insight":"Masculine ein becomes einen when the noun is a direct object. This is the accusative. Feminine eine and neuter ein stay unchanged in this pattern.","question":"Complete: Ich kaufe ___ Apfel.","options":["ein","eine","einen"],"correct":2,"why":"Apfel is masculine, so use einen."},{"name":"Make a request","context":"A café worker asks what you would like. Ask politely for tea.","model":"Ich möchte einen Tee, bitte.","translation":"I would like a tea, please.","insight":"Ich möchte … is useful for polite requests. Tee is masculine and takes einen here as the object.","question":"Which request is correct?","options":["Ich möchte einen Tee, bitte.","Ich möchte eine Tee, bitte.","Ich möchte ein Tee, bitte."],"correct":0,"why":"Einen is the accusative article for Tee."},{"name":"Ask the price","context":"You are buying a kilogram of apples. Ask the assistant the cost.","model":"Was kostet ein Kilo Äpfel?","translation":"How much does a kilogram of apples cost?","insight":"Was kostet …? asks about the price of one item or quantity. Ein Kilo is a precise quantity phrase.","question":"Which asks about a price?","options":["Woher kommen die Äpfel?","Was kostet ein Kilo Äpfel?","Wie heißen die Äpfel?"],"correct":1,"why":"Was kostet …? asks the price."}]},"a11-daily-time":{"chapter":5,"title":"Clocks and routine","tiles":[["07:30","halb acht","time"],["08:00","acht Uhr","time"],["18:15","Viertel nach sechs","time"]],"scenes":[{"name":"Half past the hour","context":"The clock reads 07:30. German calls this time by looking forward to the next hour.","model":"Es ist halb acht.","translation":"It is half past seven.","insight":"Halb acht means halfway to eight, so the clock reads 07:30, not 08:30. Compare the spoken expression with the hour hand.","question":"What is halb acht?","options":["08:30","07:30","07:15"],"correct":1,"why":"Halb acht means 07:30."},{"name":"Describe a routine","context":"You leave for work at eight. Explain the time and the activity in a single sentence.","model":"Um acht Uhr fahre ich zur Arbeit.","translation":"At eight o’clock I travel to work.","insight":"Um introduces an exact time. With a time expression first, the conjugated verb follows: Um acht Uhr fahre ich …","question":"Which has correct word order?","options":["Um acht Uhr fahre ich zur Arbeit.","Um acht Uhr ich fahre zur Arbeit.","Ich um acht Uhr fahre zur Arbeit."],"correct":0,"why":"Fahre follows the time phrase."},{"name":"Express a need","context":"You have homework to finish. Explain the necessity using a modal verb.","model":"Ich muss heute lernen.","translation":"I have to study today.","insight":"After a modal verb such as muss, the second verb appears at the end in the infinitive form.","question":"Complete: Ich muss heute ___.","options":["lerne","lernst","lernen"],"correct":2,"why":"After muss use the infinitive lernen."}]},"a11-family-appointments":{"chapter":5,"title":"Family and appointments","tiles":[["Familie","meine Schwester","relative"],["Mittwoch","15 Uhr","meeting"],["Antwort","Leider nicht","reply"]],"scenes":[{"name":"Introduce family","context":"Your classmate asks about a member of your family. Use a possessive form with the correct gender.","model":"Das ist meine Schwester.","translation":"This is my sister.","insight":"Schwester is feminine, so use meine in this simple expression. Mein and meine must agree with the noun.","question":"Complete: Das ist ___ Schwester.","options":["mein","meine","meinen"],"correct":1,"why":"Use meine with Schwester."},{"name":"Arrange a meeting","context":"You propose Wednesday at three in the afternoon. Combine day and time correctly.","model":"Hast du am Mittwoch um fünfzehn Uhr Zeit?","translation":"Do you have time on Wednesday at 3 p.m.?","insight":"Use am with a weekday and um with a clock time. In the question Hast du …?, the conjugated verb comes first.","question":"Which gives Wednesday at 3 p.m.?","options":["am Mittwoch um fünfzehn Uhr","um Mittwoch am fünfzehn Uhr","in Mittwoch für fünfzehn Uhr"],"correct":0,"why":"Am is for weekdays, um for clock time."},{"name":"Say no politely","context":"You cannot make the suggested meeting. Decline and leave room for another plan.","model":"Leider kann ich am Mittwoch nicht. Geht Donnerstag?","translation":"Unfortunately I cannot on Wednesday. Does Thursday work?","insight":"Leider softens a refusal. Kann expresses ability or availability; another day can follow as an alternative.","question":"Which is a polite refusal?","options":["Ja, um acht Uhr.","Wie heißt du?","Leider kann ich nicht."],"correct":2,"why":"Leider kann ich nicht is a polite refusal."}]},"a11-birthdays-invitations":{"chapter":6,"title":"Dates and invitations","tiles":[["Anlass","Geburtstag","birthday"],["Wann","12. Mai · 18 Uhr","date"],["Ort","bei mir","place"]],"scenes":[{"name":"Say a date","context":"Your birthday invitation needs a date. Read it as a German calendar expression.","model":"Ich habe am zwölften Mai Geburtstag.","translation":"My birthday is on the twelfth of May.","insight":"Use am with calendar dates and an ordinal form such as am zwölften Mai. A specific time is introduced by um.","question":"Which goes with a date?","options":["am","um","aus"],"correct":0,"why":"Calendar dates commonly use am."},{"name":"Invite a friend","context":"You plan a party on Saturday. Ask a friend whether they will come.","model":"Kommst du am Samstag zu meiner Party?","translation":"Are you coming to my party on Saturday?","insight":"In a yes/no question the conjugated verb starts the sentence: Kommst du …? Ja, gern! accepts the invitation.","question":"Which is an invitation?","options":["Was kostet die Party?","Kommst du am Samstag zu meiner Party?","Woher kommst du?"],"correct":1,"why":"Kommst du …? is an invitation question."},{"name":"Use anrufen","context":"You are going to phone a friend tomorrow. Say this in a present-tense sentence.","model":"Ich rufe dich morgen an.","translation":"I will call you tomorrow.","insight":"Anrufen is separable. Rufe is near the start of the main clause and an goes at the end.","question":"Complete: Ich rufe dich morgen ___.","options":["auf","mit","an"],"correct":2,"why":"Anrufen separates to rufe … an."}]},"a11-restaurant-past":{"chapter":6,"title":"Meal and memory","tiles":[["Speisekarte","menu","choose"],["Rechnung","bill","pay"],["Gestern","war · hatte","past"]],"scenes":[{"name":"Request the bill","context":"You have finished your meal and want to pay. Make a short polite request.","model":"Die Rechnung, bitte.","translation":"The bill, please.","insight":"Die Rechnung is the bill. Bitte makes the request polite. The Speisekarte is the menu, which is not what you need now.","question":"Which asks for the bill?","options":["Die Rechnung, bitte.","Der Bahnhof, bitte.","Das Wörterbuch, bitte."],"correct":0,"why":"Die Rechnung, bitte is a polite bill request."},{"name":"Describe the meal","context":"You tell a friend about yesterday's dinner. Use the past form of sein.","model":"Das Essen war sehr gut.","translation":"The food was very good.","insight":"War is a past form of sein. Contrast Das Essen ist gut (now) and Das Essen war gut (then).","question":"Which describes the past?","options":["Das Essen ist gut.","Das Essen war sehr gut.","Das Essen sind gut."],"correct":1,"why":"War is a past form of sein."},{"name":"Say what you had","context":"Someone asks about yesterday's meal. Answer using the past form of haben.","model":"Ich hatte gestern eine Suppe.","translation":"I had a soup yesterday.","insight":"Hatte is the ich simple-past form of haben. Gestern signals yesterday.","question":"Complete: Ich ___ gestern eine Suppe.","options":["habe","bin","hatte"],"correct":2,"why":"Hatte expresses past possession or experience."}]}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function stats(id,all){const d=data[id],p=all?.[id]||{};return {total:d?.scenes.length||0,answered:d?.scenes.filter((_,i)=>!!p[i]).length||0,correct:d?.scenes.filter((_,i)=>p[i]?.correct).length||0};}

 const a=done[i],selected=choices?.[id+':'+i];
 return '<details class="p3-scene" '+(i===0||selected!==undefined||!!a?'open':'')+'><summary><span class="p3-scene-no">'+(i+1)+'</span><strong>'+esc(s.name)+'</strong><span class="p3-scene-status">'+(a?(a.correct?'✓ Correct':'↻ Review'):'Practise')+'</span></summary><div class="p3-scene-body"><p>'+esc(s.context)+'</p><div class="p3-example"><div><strong lang="de">'+esc(s.model)+'</strong><span>'+esc(s.translation)+'</span></div><button type="button" class="view-link" data-speak="'+esc(s.model)+'" aria-label="Listen to German example">♫ Listen</button></div><p class="p3-rule"><b>Understand:</b> '+esc(s.insight)+'</p><h4>'+esc(s.question)+'</h4><div class="p3-options" role="group" aria-label="'+esc(s.question)+'">'+s.options.map((o,j)=>'<button type="button" class="p3-option '+(selected===j?'selected ':'')+(a&&j===s.correct?'correct ':'')+(a&&j===a.chosen&&!a.correct?'incorrect':'')+'" data-phase3-choice="'+id+'|'+i+'|'+j+'" aria-pressed="'+(selected===j)+'" '+(a?'disabled':'')+'>'+esc(o)+'</button>').join('')+'</div>'+(a?'<div class="p3-feedback '+(a.correct?'':'p3-review')+'" role="status"><b>'+(a.correct?'Correct.':'Review this point.')+'</b> '+esc(s.why)+' <button type="button" class="view-link" data-phase3-retry="'+id+'|'+i+'">Try again</button></div>':'<button type="button" class="btn btn-primary btn-small" data-phase3-check="'+id+'|'+i+'" '+(!Number.isInteger(selected)?'disabled':'')+'>Check answer</button>')+'</div></details>';
}).join('')+'</div><p class="p3-foot">Independent AmberTheory learning material · Not reproduced textbook exercises · Language review pending</p></section>';
}

it.","prompt":"What time is it?","options":["07:30","08:30","07:45"],"correct":0,"explanation":"Halb acht is 07:30, halfway to eight."},{"audio":"Um acht Uhr fahre ich zur Arbeit. Um sechs Uhr bin ich wieder zu Hause.","prompt":"When does the person leave for work?","options":["At six","At eight","At nine"],"correct":1,"explanation":"Um acht Uhr is the departure time."}],"phrase":"Um halb acht frühstücke ich. Dann fahre ich zur Arbeit.","checklist":["I understand halb acht means 07:30.","I keep the verb after an opening time phrase.","I speak the routine naturally."]},"a11-family-appointments":{"chapter":5,"title":"Listen for family and appointments","questions":[{"audio":"Meine Schwester heißt Lara. Sie wohnt in Köln.","prompt":"Who lives in Cologne?","options":["The speaker's brother","The speaker's sister","The speaker's teacher"],"correct":1,"explanation":"Meine Schwester refers to the sister."},{"audio":"Am Mittwoch habe ich keine Zeit. Können wir uns am Donnerstag treffen?","prompt":"Which day is suggested instead?","options":["Tuesday","Wednesday","Thursday"],"correct":2,"explanation":"Am Donnerstag is the proposed alternative day."}],"phrase":"Hast du am Donnerstag um fünfzehn Uhr Zeit?","checklist":["I use am for the day.","I use um for the clock time.","I ask clearly whether the person is available."]},"a11-birthdays-invitations":{"chapter":6,"title":"Listen for dates and invitations","questions":[{"audio":"Meine Geburtstagsparty ist am zwölften Mai um achtzehn Uhr.","prompt":"When does the party start?","options":["At 18:00","At 12:00","At 20:00"],"correct":0,"explanation":"Um achtzehn Uhr is 6 p.m."},{"audio":"Kommst du am Samstag? Leider kann ich nicht. Ich komme am Sonntag.","prompt":"When can the second speaker come?","options":["Saturday","Sunday","Friday"],"correct":1,"explanation":"Ich komme am Sonntag gives the alternative day."}],"phrase":"Kommst du am Samstag zu meiner Party?","checklist":["I use the verb-first invitation question.","I pronounce <script>
/* Phase 5 teacher authoring: independent, original classroom demo workflows. Browser local, never actual enrolment. */
(()=>{
'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const templates=[
{id:'conversation',title:'Everyday conversation',description:'Vocabulary, listen, role-play and a quick check'},
{id:'listening',title:'Listening workshop',description:'Hear, select and speak in familiar chapter situations'},
{id:'grammar',title:'Grammar in action',description:'Find a pattern, choose an answer, use it in context'},
{id:'assessment',title:'Chapter assessment',description:'Skill check, language in context and final review'}
];
const defaultRubric=['Meaning and task completion','Relevant A1 vocabulary and grammar','Clarity and appropriate register'];
const validDate=v=>!v||/^\d{4}-\d{2}-\d{2}$/.test(v);
const localToday=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');};
function windowState(s,today=localToday()){
 if(s.status!=='published')return 'draft';
 if(s.releaseFrom&&today<s.releaseFrom)return 'upcoming';
 if(s.releaseUntil&&today>s.releaseUntil)return 'closed';
 return 'available';
}
function rubric(s){return (Array.isArray(s.rubric)&&s.rubric.length===3?s.rubric:defaultRubric).map(x=>String(x||''));}
function validate(s){if(!['supported','core','challenge'].includes(s.difficulty||'core'))return 'Select a supported practice difficulty.';if(!['learner','group'].includes(s.audience))return 'Choose an available demo audience.';if(!validDate(s.releaseFrom)||!validDate(s.releaseUntil))return 'Use valid YYYY-MM-DD assignment dates.';if(s.releaseFrom&&s.releaseUntil&&s.releaseFrom>s.releaseUntil)return 'The assignment closing date must not precede its opening date.';if(rubric(s).some(x=>x.trim().length<10))return 'Write three meaningful rubric criteria before submitting for approval.';return null;}
function templatesHtml(ch){return '<section class="p5-template-panel" aria-label="Reusable chapter activity templates"><div><span class="eyebrow">Quick-start experiences</span><h3>Build from Chapter '+ch.number+'</h3><p>Start with independently written exercises based on this chapter, then edit and review before publication.</p></div><div class="p5-template-grid">'+templates.map(t=>'<button type="button" data-p5-template="'+t.id+'" data-p5-chapter="'+ch.number+'"><strong>'+esc(t.title)+'</strong><span>'+esc(t.description)+'</span><small>Use template →</small></button>').join('')+'</div></section>';}
function makeBlocks(mode,ch,lesson,fromBlock,pick){
 const words=(lesson?.words||[]).slice(0,5).map(([de,en])=>de+' | '+en).join('\n');
 const phrase=lesson?.phrase?.de||'Guten Tag. Wie geht es Ihnen?';
 const qGrammar=pick('Grammar')||pick('Vocabulary')||pick('Listening');
 const qVocab=pick('Vocabulary')||pick('Grammar');
 const mkQ=(type,q)=>({...fromBlock(type),title:type==='assessment'?'Final chapter check':'Check the language',question:q?.prompt||'Which answer is correct?',options:(q?.options||['Ja','Nein','Danke']).join('\n'),correct:String(q?.correct??0),explanation:q?.why||'Review the example and the relevant phrase.'});
 const vocab={...fromBlock('vocabulary'),title:'Notice useful chapter words',entries:words||'Hallo | hello\nDanke | thank you'};
 const listen={...fromBlock('listening'),title:'Listen and repeat the chapter model',phrase,instruction:'Listen twice. Repeat slowly, then explain the meaning in your own words.'};
 const dialog={...fromBlock('roleplay'),title:'Use this chapter in conversation',prompt:ch.originalTeacherStudioActivity||ch.originalLessonGoal,starter:phrase,criteria:'Complete the conversation; use accurate chapter language and suitable politeness.'};
 if(mode==='listening')return [listen,vocab,{...listen,id:fromBlock('listening').id,title:'Repeat with a new purpose',instruction:'Listen again. Identify the important nouns and verbs, then repeat the complete phrase.'},mkQ('assessment',qVocab)];
 if(mode==='grammar')return [vocab,mkQ('quiz',qGrammar),dialog,mkQ('assessment',qVocab)];
 if(mode==='assessment')return [listen,mkQ('quiz',qGrammar),dialog,mkQ('assessment',qVocab)];
 return [vocab,listen,dialog,mkQ('assessment',qVocab)];
}
function composerFields(s){
 const options=[['supported','Guided · more support'],['core','Standard · independent'],['challenge','Extension · extra challenge']];
 const select='<label class="composer-field"><span>Practice difficulty</span><select data-session-field="difficulty">'+options.map(([key,label])=>'<option value="'+key+'" '+((s.difficulty||'core')===key?'selected':'')+'>'+label+'</option>').join('')+'</select><small>Changes hints and expected independence, not the textbook level.</small></label>';
 const date=(key,label)=>'<label class="composer-field"><span>'+label+'</span><input type="date" data-session-field="'+key+'" value="'+esc(s[key]||'')+'" /><small>Optional · dates apply in the learner browser’s local time.</small></label>';
 const r=rubric(s);
 return '<section class="p5-config"><div class="p5-config-title"><h4>Classroom configuration</h4><p>All audiences are illustrative in this demo. Date windows control visibility; no invitations or notifications are sent.</p></div><div class="composer-meta-grid">'+select+date('releaseFrom','Open assignment from')+date('releaseUntil','Close assignment after')+'</div><h4>Three-part assessment rubric</h4><p>Reviewers use these criteria when grading a written role-play. No automatic speech scoring is performed.</p><div class="p5-rubric-editor">'+r.map((v,i)=>'<label class="composer-field"><span>Criterion '+(i+1)+'</span><input data-p5-rubric="'+i+'" maxlength="140" value="'+esc(v)+'" /></label>').join('')+'</div><p class="p5-review-rule"><b>Review workflow:</b> Save draft → Submit for review → Approve content → Publish to demo learner/group. Editing resets approval. Existing published demonstration sessions are retained.</p></section>';
}
function shelfInfo(s){
 const status=s.status==='published'?'Assigned':s.reviewStatus==='approved'?'Approved':s.reviewStatus==='pending'?'Awaiting content review':'Draft';
 const availability=windowState(s);
 return '<div class="p5-shelf-meta"><span>'+esc(status)+'</span> · <span>'+esc((s.difficulty||'core'))+' practice</span>'+ (s.releaseFrom?' · Opens '+esc(s.releaseFrom):'')+(s.releaseUntil?' · Closes '+esc(s.releaseUntil):'')+(availability==='upcoming'?' · Not yet visible to learner':availability==='closed'?' · Closed to learner':'')+'</div>';
}
function shelfActions(s){
 if(s.status==='published')return '';
 return '<div class="p5-approval-actions">'+(s.reviewStatus==='pending'?'<button type="button" class="btn btn-primary btn-small" data-p5-approve="'+esc(s.id)+'">Approve content</button><button type="button" class="btn btn-outline btn-small" data-p5-changes="'+esc(s.id)+'">Request changes</button>':s.reviewStatus==='approved'?'<span class="p5-approved">✓ Content approved for demo publication</span>':'<span class="p5-pending">Save and submit the completed session for review.</span>')+'</div>';
}
function difficultyInfo(s){
 const level=s.difficulty||'core';
 const guidance=level==='supported'?'Supported: follow the model phrase, keep sentences short and use the provided vocabulary.':level==='challenge'?'Extension: add two relevant original sentences and justify your choice of wording.':'Standard: complete the conversation independently using your chapter language.';
 return '<div class="p5-difficulty-note"><b>'+esc(level.charAt(0).toUpperCase()+level.slice(1))+' practice</b><p>'+esc(guidance)+'</p></div>';
}
function reviewInputs(s,id){
 return '<fieldset class="p5-score-form"><legend>Teacher rubric · 1–4 for each criterion</legend>'+rubric(s).map((criterion,i)=>'<label><span>'+esc(criterion)+'</span><select data-p5-grade="'+esc(id)+'|'+i+'"><option value="">Select score</option>'+[[1,'1 · Emerging'],[2,'2 · Developing'],[3,'3 · Meets goal'],[4,'4 · Strong']].map(([n,desc])=>'<option value="'+n+'">'+desc+'</option>').join('')+'</select></label>').join('')+'</fieldset>';
}
function feedbackText(s,review){
 if(!review?.rubricScores)return '';
 const score=review.rubricScores.reduce((a,b)=>a+Number(b),0);
 return '<div class="p5-graded"><strong>Teacher rubric: '+score+'/12 (practice only)</strong>'+rubric(s).map((c,i)=>'<p>'+esc(c)+': '+Number(review.rubricScores[i])+'/4</p>').join('')+'</div>';
}
window.GERMAN_CLASSROOM={templates,defaultRubric,rubric,validate,windowState,templatesHtml,makeBlocks,composerFields,shelfInfo,shelfActions,difficultyInfo,reviewInputs,feedbackText};
})();
</script>
