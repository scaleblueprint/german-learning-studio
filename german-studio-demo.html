/* Teacher-created learning experiences */
.experience-studio{margin:43px 0 37px}
.experience-intro{margin:0 0 21px;align-items:center}
.experience-intro h2{max-width:720px;margin-top:8px}
.experience-intro> .tag{font-size:11px;padding:10px 14px}
.experience-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:15px}
.experience-flow>div{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:10px;row-gap:3px;padding:19px;background:#eaece4;border-radius:14px;min-width:0}
.experience-flow b{grid-row:span 2;display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:#dfe6d8;color:#496457;font-size:11px}
.experience-flow strong{font-size:12px}
.experience-flow span{color:var(--muted);font-size:10px;line-height:1.45}
.template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.template-card{min-width:0;padding:24px;border:1px solid #dfdfd5;border-radius:17px;background:var(--paper);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:11px;align-items:flex-start;transition:transform .2s,border-color .2s,box-shadow .2s}
.template-card:hover,.template-card:focus-visible{transform:translateY(-3px);border-color:#b1c4b1;box-shadow:0 17px 37px #2b413a18}
.template-glyph{display:grid;place-items:center;width:48px;height:48px;background:#e6ece1;border-radius:14px;color:#31594b;font-size:24px}
.template-glyph.small{width:40px;height:40px;font-size:21px;border-radius:12px}
.template-card:nth-child(2) .template-glyph{background:#f2e8d9;color:#a4653e}
.template-card:nth-child(3) .template-glyph{background:#e3e8ea;color:#56757e}
.template-card strong{font-family:Fraunces,Georgia,serif;font-size:23px;font-weight:500}
.template-card>span:not(.template-glyph){font-size:12px;color:var(--ink-soft);line-height:1.6}
.template-card em{margin-top:auto;font-style:normal;font-size:11px;color:var(--copper-dark);font-weight:800}
.experience-work-heading{margin:42px 0 19px}

.experience-shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.experience-shelf-card{min-width:0;padding:20px;display:flex;flex-direction:column;gap:11px}
.experience-shelf-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.experience-shelf-head .tag{white-space:normal;text-align:right;line-height:1.3}
.experience-shelf-card h3{font-size:23px;overflow-wrap:anywhere}
.experience-shelf-card p{font-size:12px;color:var(--ink-soft);line-height:1.6}
.experience-responses{font-size:11px;color:var(--muted);font-weight:700;margin-top:auto}
.experience-shelf-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.experience-shelf-actions .btn{padding:9px 11px}
.mission-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;font-size:9px}
.builder-panel{margin:18px 0 30px;padding:29px;background:#fdfbf5;scroll-margin-top:98px}
.builder-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
.builder-top h3{font-size:28px;margin:8px 0}
.builder-top p{font-size:12px;color:var(--ink-soft);max-width:600px}
.builder-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.75fr);gap:25px}
.builder-fields{display:grid;gap:15px;min-width:0}
.builder-double{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.builder-field{display:flex;flex-direction:column;gap:7px;min-width:0}
.builder-field>span{font-size:11px;font-weight:800;color:var(--ink-soft)}
.builder-field input,.builder-field textarea,.builder-field select{display:block;width:100%;min-width:0;border-radius:10px;border:1px solid #d7dcd2;background:#fff;padding:12px 13px;font-size:13px;color:var(--ink);outline-offset:2px}
.builder-field textarea{resize:vertical;line-height:1.6}
.builder-field input:focus,.builder-field textarea:focus,.builder-field select:focus{border-color:var(--forest)}
.builder-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.builder-aside{align-self:start;background:#e7ede5;border-radius:17px;padding:24px;min-width:0}
.builder-aside-icon{font-size:32px;margin-bottom:15px}
.builder-aside h3{font-size:27px;margin:15px 0 10px}
.builder-aside p{font-size:12px;line-height:1.75;color:#52675b}
.builder-aside ul{padding-left:18px;margin:18px 0;font-size:12px;line-height:1.85;color:#496054}
.builder-aside .study-note{font-size:11px;background:#fafcf8}
.experience-preview{padding:27px;margin-top:16px;background:#fdfcf8}
.experience-preview h3{margin:8px 0 10px}
.experience-preview>p{font-size:13px;color:var(--ink-soft)}
.experience-preview .phrase-panel{margin-bottom:14px}
.experience-preview .stage-foot{margin-top:16px}
.rubric-note{font-size:11px;color:var(--forest);background:#eef3e9;padding:12px;border-radius:8px;line-height:1.6;margin-top:8px}

.learner-sessions{margin:31px 0 27px}

.student-session{max-width:1190px;margin:auto}

.student-session-layout{display:grid;grid-template-columns:minmax(210px,.65fr) minmax(0,1.5fr);gap:17px;align-items:start}

.session-outline-step:hover{background:#f4f5ed}
.session-outline-step>span{flex-shrink:0;display:grid;place-items:center;width:31px;height:31px;background:#e8ecdf;color:var(--forest);border-radius:9px;font-size:11px;font-weight:900}

.session-step-navigation{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.session-choice-grid{display:grid;gap:10px;margin-top:17px}
.session-response-history{display:grid;gap:10px;margin:18px 0}
.session-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:22px 0}
.session-summary-grid>div{padding:17px 13px;border-radius:12px;background:#eaf0e8;display:flex;flex-direction:column;gap:7px;min-width:0}

@media(max-width:1000px){
  .composer-workspace{grid-template-columns:minmax(0,1fr)}
  .composer-palette{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
  .composer-palette>.eyebrow,.composer-palette>h4,.composer-palette>p,.composer-palette-foot{grid-column:1/-1}
  .composer-palette-item{margin:0}
  .student-session-layout{grid-template-columns:minmax(0,1fr)}
  .session-outline{display:flex;flex-direction:row;overflow-x:auto;padding:12px}
  .session-outline>.eyebrow{display:none}
  .session-outline-step{flex:0 0 190px}
}
@media(max-width:760px){
  .session-studio{margin:29px 0}
  .session-studio>.section-intro{align-items:flex-start}
  .session-studio-lead{flex-direction:column;align-items:flex-start;padding:23px}
  .session-studio-lead strong{font-size:23px}
  .session-shelf-grid,.learner-session-grid,.session-preview-steps{grid-template-columns:minmax(0,1fr)}

  .composer-panel{padding:18px 14px;scroll-margin-top:72px}
  .composer-panel-head{flex-wrap:wrap}
  .composer-panel-head h3{font-size:27px}
  .composer-meta-grid{grid-template-columns:minmax(0,1fr);padding:15px}
  .composer-meta-grid>.composer-field:first-child,.composer-meta-grid>.composer-field:nth-child(2){grid-column:auto}
  .composer-palette{grid-template-columns:minmax(0,1fr);padding:18px}
  .composer-block{padding:15px 13px}
  .composer-block-top{flex-wrap:wrap}
  .composer-block-controls{margin-left:auto}
  .composer-actions .btn{flex:1 1 145px}
  .student-session-hero{padding:29px 22px}
  .student-session-hero h1{font-size:clamp(2.1rem,9vw,3rem)}
  .session-activity{padding:20px}
  .session-word-grid{grid-template-columns:minmax(0,1fr)}
  .session-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:410px){

  .learner-session-mark{width:39px;height:39px;font-size:21px}
  .session-studio-lead .btn,.composer-actions .btn{width:100%}
  .session-step-navigation .btn{flex:1 1 100%}
  .session-listen-phrase{flex-direction:column;align-items:flex-start;padding:20px}
}

/* A first-class, self-hosted homepage demo; no third-party player or tracking. */
.walkthrough{margin:34px 0 4px;padding:28px;border:1px solid #dce6dc;border-radius:23px;background:linear-gradient(145deg,#e9f0e8,#f7f6ef);scroll-margin-top:92px}
.walkthrough-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.walkthrough-intro h2{margin:11px 0 9px;font-size:clamp(25px,3vw,37px)}
.walkthrough-intro p{max-width:720px;color:var(--ink-soft);font-size:14px;line-height:1.65}
.walkthrough-duration{white-space:nowrap;padding:10px 13px;border-radius:30px;background:#dae9dc;color:#345d50;font-size:12px;font-weight:800}
.walkthrough-player{overflow:hidden;border-radius:15px;background:#1f302d;box-shadow:0 15px 35px rgba(27,45,37,.16)}
.walkthrough-player video{display:block;width:100%;height:auto;aspect-ratio:16/9;max-height:min(72vh,710px);object-fit:contain;background:#1f302d}
.walkthrough-note{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;color:#687b70;font-size:12px}
.walkthrough-note .view-link{padding:3px 0;font-size:12px}
@media(max-width:760px){
  .walkthrough{padding:17px;margin-top:25px;border-radius:17px}
  .walkthrough-intro{align-items:flex-start;flex-direction:column;gap:10px}
  .walkthrough-duration{font-size:11px}
  .walkthrough-player{border-radius:10px}
}

/* Two clear workspaces. There is no extra overview or second role toggle. */
.simplified-nav{margin-left:auto;margin-right:0;padding:5px;border-radius:999px;background:#e9ece6;gap:2px}
.simplified-nav .nav-btn{padding:12px 19px;border-radius:999px;font-size:13px}
.simplified-nav .nav-btn.active{background:var(--ink);color:#fff;box-shadow:0 3px 9px #26302f1a}
.workspace-hint{color:#74837a;font-size:11px;font-weight:700;white-space:nowrap}
.workspace-shortcuts{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0}
.workspace-shortcuts .btn{white-space:nowrap}
.simplified-mobile-nav button{flex:1;font-size:11px}
@media(max-width:960px){.workspace-hint{display:none}}
@media(max-width:760px){
  .workspace-shortcuts{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .dash-header{flex-direction:column}
  .simplified-mobile-nav button{min-width:0;padding:9px 14px}
}
@media(max-width:440px){
  .workspace-shortcuts .tag{width:100%;max-width:max-content}
  .workspace-shortcuts .btn{white-space:normal}
}

/* Match the whole visible phone viewport, including the fixed bottom navigation. */
@media(max-width:760px){
  html,body{width:100%;max-width:100%;min-width:0}
  #app{display:block;width:100vw;max-width:100vw;min-width:0}
  .top-notice,.site-header,.page,.footer{width:100%;max-width:100%;min-width:0}
  .shell{width:100%;max-width:100%;min-width:0}
  .dash-grid,.learning-panel,.card{min-width:0}
  .learning-panel{width:100%;max-width:100%}
  .learning-panel .tag{display:inline-flex;max-width:100%;white-space:normal;line-height:1.4}
  .learning-panel h2{font-size:clamp(27px,8vw,34px);overflow-wrap:break-word}
}

/* Task-oriented navigation: one workspace switch, then one clear section menu. */
.section-nav{border-top:1px solid #e9e7de;background:#faf9f5}

.view-pane[hidden]{display:none!important}

/* Lessons, assignments and hands-on work. */
.lesson-banner,.mission-banner,.student-session-hero {background:linear-gradient(125deg,#fff0d8,#f7e5e6)}
.lesson-banner:after {color:#e4c9b4}
.sidebar-lesson:hover,.sidebar-lesson.active {background:#ffe8d8}
.sidebar-lesson .count {background:#fff5e9;border-color:#ebd8c9}
.stage-tab {background:#f5e9e0;color:#634d57}
.stage-tab:hover:not(.active) {background:#ffe6d5}
.stage-tab.done:not(.active) {color:var(--green)}
.lesson-body .explain {color:var(--ink-soft)}
.sound-button {color:var(--plum)}
.sound-button:hover {background:#fff0e0}
.speech {background:#fff0e3}
.speech:nth-child(even) {background:#f5e5e7}
.speech span {color:#8a6872}
.tip,.study-note {background:#fff4e8;border-color:#efd9c7}
.choice {border-color:#ebd9d4}
.choice:before {border-color:#c7aaa5}
.choice:hover {border-color:#cd9487;background:#fff5ed}
.choice.selected {border-color:var(--plum);background:#fae8e8}
.choice.selected:before {background:var(--plum);border-color:var(--plum);box-shadow:inset 0 0 0 4px #fae8e8}
.choice.correct,.finish-panel,.status-success {background:#e2f4e9}
.finish-score {color:var(--green)}
.mission-banner p,.student-session-hero p {color:var(--ink-soft)}
.mission-banner-meta {color:var(--plum)}
.stage-tab.active,.session-outline-step.active {background:var(--plum);color:#fff}
.session-outline-step.active small {color:#f6e7ec}
.session-outline-step:hover:not(.active) {background:#fff1e9}
.session-outline-step>span {background:#ffedda;color:var(--plum-dark)}
.course-sidebar,.phrase-panel,.task-card,.teacher-prompt,.assignment-strip {background:#fff0e3}
.feature.green {background:#642b42}
.feature.cream {background:#fff0d9}
.mission-icon,.template-glyph,.composer-block-symbol {background:#ffeddb;color:#7d3c49}
.template-card {background:#fff;border-color:var(--line);border-top:4px solid #d47f3b}
.template-card:nth-child(2) {border-top-color:#cf5b53}
.template-card:nth-child(3) {border-top-color:#7e4056}
.template-card:hover {border-color:#da9c75;box-shadow:0 18px 35px rgba(95,53,65,.12)}
.template-card strong {font-family:'Space Grotesk',sans-serif;font-weight:700}
.template-card:nth-child(2) .template-glyph {background:#ffe8df;color:#a94342}
.template-card:nth-child(3) .template-glyph {background:#f5e2ed;color:#743d54}
.experience-flow>div {background:#fff0e5}
.experience-flow b {background:#ffdfc5;color:#75384b}

/* Teacher Studio: creative tools and readable data. */
.teacher-stat {border-top:4px solid #ce843d}
.teacher-stat:nth-child(4n+2) {border-top-color:#cf5b53}
.teacher-stat:nth-child(4n+3) {border-top-color:#7e4056}
.teacher-stat:nth-child(4n) {border-top-color:#218b69}
.avatar {background:#f8e4dd;color:#70394b}
.queue-item blockquote {background:#fff3e9}
.session-studio-lead {background:linear-gradient(116deg,#49283c,#984c55);box-shadow:0 20px 42px rgba(96,44,63,.16);position:relative;overflow:hidden}
.session-studio-lead:after {content:"";position:absolute;right:17%;top:-75px;width:200px;height:200px;border:40px solid #ffffff17;border-radius:50%;pointer-events:none}
.session-studio-lead span {color:#ffcc81}
.session-studio-lead strong {font-family:'Space Grotesk',sans-serif;font-weight:700}
.session-studio-lead p {color:#f9e7ef}
.session-studio-lead .btn {background:var(--amber);color:#492a3b;z-index:1}
.session-shelf-metrics {color:var(--plum)}
.composer-meta-grid,.composer-palette,.exam-builder {background:#fff1e8;border-color:#ead9ce}
.composer-field {color:var(--ink-soft)}
.composer-block {background:#fff}
.composer-palette>p,.composer-palette-foot,.composer-note {color:var(--ink-soft)}
.composer-palette-item {background:#fff;border-color:#eddad1}
.composer-palette-item>span {background:#ffebd8;color:var(--plum)}
.composer-palette-item>b {color:var(--plum)}
.composer-palette-item:hover {border-color:#c88a77}
.mini-action {background:#fff2e9;border-color:#eadad4;color:var(--plum)}
.mini-action:hover {background:#ffe7d7}
.composer-block-fields input,.composer-field input,.composer-field textarea,.composer-field select {border-color:#e4d0ca}

/* Exam preparation: strong selected states and readable practice content. */
.exam-hero {background:linear-gradient(112deg,#ffedda 0%,#f7e2e3 100%)}
.exam-hero p {color:var(--ink-soft)}
.exam-hero-symbol {color:#dca588}
.exam-provider,.exam-level {background:#fffaf6}
.exam-provider strong {font-family:'Space Grotesk',sans-serif;font-weight:700}
.exam-provider.active {border-color:#9e4a4e;background:#fae7e6;box-shadow:inset 0 0 0 1px #9e4a4e}
.exam-provider:hover {border-color:#c78d82}
.exam-level.active {background:var(--plum);border-color:var(--plum)}
.exam-level.active small {color:#f8e7ef}
.exam-main-cta {background:linear-gradient(116deg,#4d2d42,#994c57);box-shadow:0 18px 42px rgba(96,45,65,.15)}
.exam-main-cta .eyebrow {color:#ffcd80}
.exam-main-cta p,.exam-cta-meta {color:#f8e6ed}
.exam-skill-icon {background:#ffe6d5;color:#853f44}
.exam-skill:nth-child(2) .exam-skill-icon {background:#ffeadf;color:#ab4740}
.exam-skill:nth-child(3) .exam-skill-icon {background:#fff0c9;color:#815927}
.exam-skill:nth-child(4) .exam-skill-icon {background:#e2f5ea;color:#146c53}
.exam-attempt-head,.exam-result-hero {background:#fff0e2}
.exam-timer strong {color:var(--plum-dark)}
.exam-step {background:#f6eae5;color:#735b68}
.exam-step.active {background:var(--plum);color:#fff}
.exam-step.answered:not(.active) {background:#dff2e5;color:#12674a}
.exam-audio {background:#fff3e6}
.exam-passage {background:#fff2e2;border-left-color:#d66b45}
.exam-choice {border-color:#eadbd5}
.exam-choice>span {background:#f9eee8}
.exam-choice.selected {background:#fbe8e6;border-color:var(--plum)}
.exam-choice.selected>span {background:var(--plum);color:#fff}
.exam-choice:hover {border-color:#c8928e}
.exam-result-grid>div {background:#fff}
.exam-review-item blockquote,.exam-feedback-card blockquote {background:#fff3e8}
.exam-teacher-stats .card:nth-child(3n+1) {border-top:4px solid #ce843d}
.exam-teacher-stats .card:nth-child(3n+2) {border-top:4px solid #cf5b53}
.exam-teacher-stats .card:nth-child(3n) {border-top:4px solid #208a6a}

@media(max-width:960px) {
  .brand-logo {width:180px}
  .brand-product {font-size:9px;padding-left:11px}
}
@media(max-width:760px) {
  .head-inner {min-height:73px}
  .brand-logo {width:175px}
  .brand-product {font-size:9px;letter-spacing:.08em}
  .simplified-nav {display:none}
  .section-nav-item.active {border-color:#e7b8a4;box-shadow:inset 0 -2px 0 #d65c41}
  .milestone-track {gap:7px}
  .milestone {flex-basis:32px;width:32px;height:32px}
  .milestone-track:before {top:15px}
  .learning-panel:after {right:-165px;opacity:.75}
}
@media(max-width:390px) {
  .brand-logo {width:145px}
  .brand-product {font-size:8px;padding-left:8px}
}
@media(prefers-reduced-motion:reduce) {
  .btn,.milestone,.lesson-card,.quick-path,.template-card {transition:none}
  .view-pane {animation:none}
}

/* Public welcome page: distinct from the learner and teacher workspaces. */
.public-shell{max-width:1340px}
.public-landing{display:flex;flex-direction:column;gap:56px}
.public-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.86fr);min-height:540px;border-radius:28px;overflow:hidden;background:#fff1e3;border:1px solid #eacfc1;box-shadow:0 26px 65px rgba(94,42,54,.1)}
.public-hero-copy{padding:clamp(30px,5vw,76px) clamp(25px,4.3vw,68px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.public-kicker{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.13em;font-weight:800;text-transform:uppercase;color:#8f4550;margin-bottom:22px}
.public-kicker-dot{width:10px;height:10px;border-radius:50%;background:#e98148;box-shadow:0 0 0 5px #f8ddc9}
.public-hero h1{margin:0;font-size:clamp(38px,4.7vw,69px);line-height:1.07;letter-spacing:-.065em;color:#4b263a;max-width:680px}
.public-hero h1 em{font-style:normal;color:#d25940}
.public-hero-copy>p:not(.public-hero-caveat){font-size:clamp(15px,1.35vw,18px);line-height:1.75;max-width:490px;color:#6d535b;margin:22px 0 0}
.public-actions{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 14px}
.public-actions .btn{padding:15px 20px;min-height:49px;white-space:normal;text-align:center}
.public-start{background:#70354a}
.public-secondary{border:1px solid #d4b4aa}
.public-demo-link{border:none;background:transparent;color:#964d3b;font-weight:800;font-size:12px;padding:10px 0;text-align:left}
.public-demo-link:hover{text-decoration:underline}
.public-hero-caveat{margin-top:17px;font-size:11px;color:#907b7f;line-height:1.6}
.public-hero-art{position:relative;overflow:hidden;min-height:440px;background:radial-gradient(circle at 76% 20%,#f9a753 0,transparent 43%),linear-gradient(135deg,#5b2c48 3%,#923f53 57%,#c66845);display:flex;align-items:center;justify-content:center;padding:55px 32px;isolation:isolate}
.public-art-orbit{position:absolute;border:2px solid #ffe1a94f;border-radius:50%;pointer-events:none}
.orbit-one{width:570px;height:570px;top:-280px;right:-220px}
.orbit-two{width:390px;height:390px;bottom:-240px;left:-150px}
.public-preview-card{z-index:1;width:min(100%,375px);background:#fff9f2;padding:30px;border-radius:22px;box-shadow:0 25px 54px #2c112c4f;transform:rotate(-3deg)}
.public-preview-overline{font-size:10px;letter-spacing:.15em;font-weight:900;color:#b45c40}
.public-preview-speech{font-family:Fraunces,Georgia,serif;font-size:clamp(34px,3.4vw,53px);line-height:1.1;color:#533147;margin:21px 0 10px}
.public-preview-speech span{display:block;color:#bb6546}
.public-preview-card p{color:#73646c;font-size:13px;margin-bottom:24px}
.public-preview-steps{display:flex;flex-wrap:wrap;gap:7px}
.public-preview-steps span{border:1px solid #ead8ce;border-radius:20px;padding:7px 9px;font-size:10px;color:#735760;background:#fff}
.public-preview-steps .done{color:#186c52;background:#ddf4e9;border-color:#c3e7d8}
.public-art-note{position:absolute;right:19px;bottom:33px;display:flex;gap:12px;align-items:center;color:#432438;background:#ffcd7d;padding:13px 15px;border-radius:16px;z-index:2;box-shadow:0 14px 30px #35203a42}
.public-art-note>span{font-size:24px}
.public-art-note strong,.public-art-note small{display:block}
.public-art-note strong{font-size:11px}
.public-art-note small{font-size:10px;opacity:.75;margin-top:3px}
.public-intro{text-align:center;max-width:1100px;margin:0 auto;width:100%}
.public-intro h2,.public-how h2{font-size:clamp(29px,3.4vw,43px);color:#482536;margin:9px 0 12px}
.public-intro>p{font-size:14px;color:#716269;line-height:1.7}
.public-paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;text-align:left;margin-top:30px}
.public-path{background:#fff;border:1px solid #eedbd3;border-radius:22px;padding:29px;box-shadow:0 14px 35px #48253609}
.public-path-student{border-top:5px solid #d88043}
.public-path-teacher{border-top:5px solid #843c5d}
.public-path-symbol{width:52px;height:52px;border-radius:15px;background:#fff0df;color:#9e4b37;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-size:26px;margin-bottom:18px}
.public-path-teacher .public-path-symbol{background:#f3e2e8;color:#6d3152}
.public-path h3{font-size:25px;color:#492a3d;margin:8px 0}
.public-path p{font-size:13px;color:#725e67;line-height:1.75;min-height:70px}
.public-path ul{padding-left:20px;color:#62525b;font-size:12px;line-height:2}
.public-card-link{width:100%;display:flex;align-items:center;justify-content:space-between;border:none;border-top:1px solid #efddd4;background:transparent;color:#6c3048;font-weight:800;font-size:13px;text-align:left;margin-top:21px;padding:18px 0 0}
.public-card-link:hover{color:#c55b3d}
.public-card-link span{font-size:20px}
.public-how{background:#f6e8e8;border:1px solid #edd6d9;border-radius:24px;padding:32px;display:grid;grid-template-columns:.75fr 1.25fr;gap:28px}
.public-how>div>p{font-size:13px;line-height:1.8;color:#705c63}
.public-how-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
.public-how-steps>div{background:#fffaf6;padding:19px;border-radius:15px}
.public-how-steps b{font-size:20px;color:#bd6146;display:block;margin-bottom:20px}
.public-how-steps strong,.public-how-steps small{display:block}
.public-how-steps strong{font-size:12px;line-height:1.5;color:#552c42}
.public-how-steps small{font-size:11px;line-height:1.6;color:#76646a;margin-top:8px}
.public-landing>.walkthrough{margin-top:0}
.public-end-cta{background:#472738;border-radius:22px;padding:30px;display:flex;justify-content:space-between;align-items:center;gap:22px;color:#fff}
.public-end-cta h2{font-size:clamp(23px,2.5vw,33px);max-width:610px;margin:7px 0}
.public-end-cta .eyebrow{color:#ffd29a}
.public-end-cta .btn{background:#ffca80;color:#472738;flex-shrink:0}
@media(max-width:990px){.public-hero{grid-template-columns:1fr 1fr}.public-hero-copy{padding:32px}.public-hero-art{padding:35px 18px}.public-art-note{right:8px;bottom:8px}}
@media(max-width:760px){.public-landing{gap:35px}.public-hero{grid-template-columns:1fr;min-height:0;border-radius:19px}.public-hero-copy{padding:32px 25px}.public-hero-art{min-height:325px}.public-preview-card{width:min(88%,340px);padding:25px}.public-preview-speech{font-size:41px}.public-art-note{bottom:12px}.public-paths,.public-how{grid-template-columns:1fr}.public-how-steps{grid-template-columns:1fr}.public-how-steps>div{display:grid;grid-template-columns:40px 1fr;column-gap:7px;padding:14px}.public-how-steps b{grid-row:span 2;margin:0}.public-how-steps small{margin-top:3px}.public-path p{min-height:0}.public-end-cta{flex-direction:column;align-items:flex-start}.public-actions .btn{flex:1}.public-intro h2{font-size:32px}.public-shell{padding-top:17px}}
@media(max-width:390px){.public-hero h1{font-size:35px}.public-hero-copy{padding:24px 18px}.public-actions{flex-direction:column;width:100%}.public-actions .btn{width:100%}.public-hero-art{min-height:290px}.public-art-note{position:relative;right:auto;bottom:auto;align-self:flex-end;margin-left:-90px;font-size:10px}.public-preview-card{padding:18px;width:82%}}


/* Netzwerk A1 book-aligned reference: visibly separate from the playable demo lessons. */
.book-reference{margin:24px 0 30px;padding:22px;border:1px solid #e9d5c7;border-radius:20px;background:#fffaf5}
.book-reference-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
.book-reference-heading h3{font-size:clamp(21px,2.5vw,28px);margin:6px 0 9px;color:#472738}
.book-reference-heading p{max-width:730px;color:#715b63;line-height:1.6;margin:0;font-size:14px}
.book-reference-heading>.tag{flex-shrink:0}
.book-level+.book-level{margin-top:24px}
.book-level-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 10px}
.book-level-heading h4{font-size:18px;color:#472738;margin:0}
.book-level-heading span{color:#806b70;font-size:12px}
.book-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.book-chapter{min-width:0;border:1px solid #eddccf;box-shadow:none;background:#fff;border-radius:14px;overflow:hidden}
.book-chapter summary{display:flex;align-items:center;gap:12px;padding:17px;cursor:pointer;list-style:none}
.book-chapter summary::-webkit-details-marker{display:none}
.book-chapter summary:focus-visible{outline:3px solid #a96872;outline-offset:-3px}
.book-number{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:38px;height:38px;border-radius:11px;background:#f9e5d4;font-size:13px;font-weight:800;color:#6b374a}
.book-title{display:block;min-width:0;flex:1}
.book-title strong{display:block;color:#432638;font-size:14px;line-height:1.4}
.book-title small{display:block;color:#75626a;font-size:12px;line-height:1.5;margin-top:3px}
.book-expand{color:#87586c;font-size:20px}
.book-chapter[open] .book-expand{transform:rotate(180deg)}
.book-chapter-details{padding:4px 18px 18px;border-top:1px solid #f1e3d9}
.book-detail{font-size:12px;color:#5d5155;line-height:1.6;margin:11px 0 0}
.book-detail b{color:#432638}
.book-chapter-status{font-size:12px;color:#8b5a3c;margin:14px 0 0;font-weight:700}
.book-source-note{font-size:12px;color:#6f5e64;line-height:1.6;margin:20px 0 0}
.book-source-note a{color:#7d3958;text-decoration:underline}
@media(max-width:800px){.book-list{grid-template-columns:1fr}.book-reference{padding:16px}.book-reference-heading{flex-direction:column;gap:12px}}


/* Distinct roles: learner course journey versus teacher curriculum workbench */
.learner-book-route{margin:24px 0 32px}
.learner-book-head{padding:25px 27px;border-radius:20px;background:linear-gradient(118deg,#5c3045 0%,#9a4a4b 100%);color:#fff}
.learner-book-head .eyebrow{color:#ffdaaa}
.learner-book-head h3{font-size:clamp(22px,2.7vw,31px);line-height:1.22;letter-spacing:-.02em;margin:10px 0}
.learner-book-head p{max-width:680px;font-size:14px;line-height:1.6;color:#fff2e8;margin:0}
.learner-book-level{margin:25px 0}
.learner-book-level-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.learner-book-level-title h4{font-size:20px;margin:0;color:#4e2b3b}
.learner-book-level-title span{font-size:12px;color:#8c6772}
.learner-book-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.learner-book-card{min-width:0;padding:19px 18px 17px;border-radius:16px;border:1px solid #eedbd5;background:#fff;display:flex;flex-direction:column;gap:9px;box-shadow:0 3px 15px rgba(83,45,59,.035)}
.learner-book-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.learner-book-number{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#f6e7d7;color:#7a3b47;font-size:14px;font-weight:800}
.learner-book-status{font-size:10px;letter-spacing:.015em;font-weight:700;color:#815c67;background:#fcf2e8;padding:6px 8px;border-radius:999px;white-space:nowrap}
.learner-book-card h5{color:#48283a;font-size:16px;font-weight:800;line-height:1.3;margin:3px 0 0}
.learner-book-card p{font-size:13px;color:#675a60;line-height:1.52;margin:0;flex:1}
.learner-book-card small{font-size:11px;font-weight:700;color:#906b5b}
.learner-checkpoint{font-size:12px;margin:13px 0 0;color:#7d626c;padding-left:3px}
.learner-book-foot{font-size:12px;color:#6e5c64;line-height:1.65;padding:12px 15px;background:#fbf1e8;border-radius:10px}
.teacher-planner{margin:10px 0 34px;background:#fffaf7;border:1px solid #eeded6;border-radius:22px;padding:23px}
.teacher-planner-head{display:flex;gap:22px;align-items:start;justify-content:space-between;margin-bottom:21px}
.teacher-planner-head>div{max-width:720px}
.teacher-planner-head h2{font-size:clamp(23px,2.8vw,30px);color:#48293a;margin:8px 0 12px}
.teacher-planner-head p{font-size:14px;color:#725b64;line-height:1.65;margin:0}
.teacher-planner-head>.tag{flex-shrink:0}
.teacher-planner-layout{display:grid;grid-template-columns:minmax(210px,250px) minmax(0,1fr);gap:17px;align-items:start}
.teacher-chapter-list{background:#5b3447;padding:16px;border-radius:16px;display:flex;flex-direction:column;gap:5px}
.teacher-chapter-list h3{font-size:16px;margin:0;color:#fff}
.teacher-chapter-list p{font-size:12px;color:#e9cdcf;margin:0 0 13px}
.teacher-chapter-choice{border:1px solid transparent;width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;text-align:left;cursor:pointer;background:transparent;color:#f9edf0;padding:10px;border-radius:9px;font:inherit}
.teacher-chapter-choice span{font-size:12px;color:#f5bd94;font-weight:800}
.teacher-chapter-choice strong{font-size:12px;font-weight:700;line-height:1.3}
.teacher-chapter-choice small{font-size:10px;color:#eac5bf}
.teacher-chapter-choice:hover{background:#754759}
.teacher-chapter-choice.active{background:#fff2e5;color:#522c41}

(()=>{'use strict';
const chapters=[{"n":2,"title":"Before your Chapter 2 activities","blocks":[{"key":"numbers","title":"Numbers beyond 20","purpose":"Read ages, work hours, quantities and everyday profile numbers.","text":"You already learned one through twenty. German now builds many larger numbers by putting the ones first and the tens last. Twenty-one is einundzwanzig: literally one-and-twenty. Notice that eins becomes ein inside the compound. Thirty is dreißig, forty is vierzig, sixty is sechzig and seventy is siebzig. Say each compound as one word. In a profile you might see 24 years old, a starting time or a phone number. Recognising larger numbers lets you understand these details before answering questions about them.","examples":[["21 = einundzwanzig","one-and-twenty"],["32 = zweiunddreißig","two-and-thirty"],["47 = siebenundvierzig","seven-and-forty"],["80 = achtzig · 100 = hundert","eighty; one hundred"],["75 = fünfundsiebzig","five-and-seventy"]],"note":"The tens are zwanzig (20), dreißig (30), vierzig (40), fünfzig (50), sechzig (60), siebzig (70), achtzig (80), neunzig (90), hundert (100).","task":"Say 26, 41 and 73 in German before continuing.","answer":"sechsundzwanzig · einundvierzig · dreiundsiebzig"},{"key":"calendar","title":"All weekdays and months","purpose":"Read a date and propose a day rather than guessing it.","text":"For meetings, you need more than Freitag and Samstag. The seven weekdays are Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag and Sonntag. The twelve months are Januar, Februar, März, April, Mai, Juni, Juli, August, September, Oktober, November and Dezember. German capitalises these names. Say am Mittwoch when planning a weekday, and im Sommer when talking about a season. A calendar gives context: it lets you check whether a suggested day is available, choose another, and read a work or leisure profile. You will practise full dates with endings in Chapter 6. When describing someone's workday, von … bis means from … to, as in Ich arbeite von neun bis fünfzehn Uhr. The useful phrase keine Zeit haben means to be unavailable; you can learn it as a complete expression before studying the grammar of kein in Chapter 3.","examples":[["Hast du am Mittwoch Zeit?","Are you free on Wednesday?"],["Im Dezember arbeite ich.","I work in December."],["Im Frühling schwimme ich gern.","I enjoy swimming in spring."],["Ich arbeite von neun bis fünfzehn Uhr.","I work from nine to three p.m."]],"note":"Weekdays take am. Months can take im when referring generally to the month. Full dates with ordinal endings are introduced later.","task":"Name the weekday after Dienstag and the month after August.","answer":"Mittwoch · September"},{"key":"conjugation","title":"Build statements and yes/no questions","purpose":"Use haben, sein and everyday hobby verbs before responding to questions.","text":"German verb endings change with the person. Learn complete examples: ich bin, du bist, er/sie ist; ich habe, du hast, er/sie hat. For regular verbs, ich spiele, du spielst, er/sie spielt. A normal statement places the conjugated verb in second position: Am Samstag habe ich Zeit. A yes/no question begins with the verb: Hast du am Samstag Zeit? When asking about hobbies, put gern after the action verb: Ich lese gern. Listening matters too: your voice normally falls at the end of a statement, while a yes/no question may sound inviting or questioning.","examples":[["Ich bin Studentin. Du bist Student.","I am a student. You are a student."],["Ich habe Zeit. Hast du Zeit?","I have time. Do you have time?"],["Sie spielt gern Tennis.","She enjoys playing tennis."]],"note":"In informal speech, du uses bist/hast/spielst. Polite Sie uses sind/haben/spielen; don't mix those forms.","task":"Make a question out of Du hast am Freitag Zeit.","answer":"Hast du am Freitag Zeit?"}]},{"n":3,"title":"Before your Chapter 3 activities","blocks":[{"key":"articles","title":"Name, introduce and negate a place","purpose":"Understand der/ein/kein and die/eine/keine before city-map choices.","text":"The articles in a city map depend on the noun. Bahnhof is masculine: der Bahnhof, ein Bahnhof, kein Bahnhof. Bank is feminine: die Bank, eine Bank, keine Bank. Museum is neuter: das Museum, ein Museum, kein Museum. Use the indefinite article when introducing an unfamiliar place and a definite article after the place has been identified. To say no such place is present, use kein/keine rather than simply saying nein plus the noun. These examples use simple nominative sentences with ist. The accusative after other verbs is introduced in Chapter 4.","examples":[["Das ist ein Bahnhof.","That is a station."],["Der Bahnhof ist groß.","The station is big."],["Hier ist kein Bahnhof.","There is no station here."],["Hier ist keine Bank.","There is no bank here."]],"note":"Learn the noun with its article, not as an isolated English translation. A complete negative sentence needs the verb.","task":"Say 'There is no museum here' using ist.","answer":"Hier ist kein Museum."},{"key":"map","title":"A city map and ordered directions","purpose":"Practise routes before you are asked to guide somebody.","text":"A direction task needs a starting point and a destination. Imagine the station on a straight street, a crossing ahead, and the museum on the street to the left. First say Entschuldigung, wo ist das Museum? Then describe the route: Gehen Sie geradeaus. Dann biegen Sie links ab. The finite verb comes first in this polite Sie instruction, followed by Sie. Links means left, rechts right and geradeaus straight ahead. Listen for then/next words because changing one step can change the destination. After practising, check a route against the accompanying city illustration. When asking about public transport, zum is a common combination of zu and dem, as in Fährt der Bus zum Museum? Learn this as a useful complete route question for now.","examples":[["Wo ist der Bahnhof?","Where is the station?"],["Gehen Sie bitte geradeaus.","Please go straight ahead."],["Dann biegen Sie links ab.","Then turn left."],["Vielen Dank!","Thank you very much!"],["Fährt der Bus zum Museum?","Does the bus go to the museum?"]],"note":"When you give directions to a stranger, use Gehen Sie / Biegen Sie, not an informal du question.","task":"Say two polite instructions: go straight, then turn right.","answer":"Gehen Sie geradeaus. Dann biegen Sie rechts ab."},{"key":"vowels","title":"Long and short German vowels","purpose":"Hear place names and short route messages more clearly.","text":"German distinguishes vowel length. In Stadt, the a is short; in Straße, the a is long. In bitte, the i is short; in sieben, the ie is pronounced as a long i sound. Listen to the complete word before repeating it. A longer vowel is not simply a louder vowel. This helps when you hear a place name on a route. Read a short, original notice such as 'Bus zum Museum. Samstag, zehn Uhr.' Ask which transport, destination and day it names. You should be able to find these facts without having to know every German sign in a town.","examples":[["die Stadt","the city; short a"],["die Straße","the street; long a"],["bitte","please; short i"],["sieben","seven; long ie"]],"note":"Pronunciation cues are approximations; use the German speech playback and compare short versus long vowels.","task":"Which word has a long i sound: bitte or sieben?","answer":"sieben"}]},{"n":4,"title":"Before your Chapter 4 activities","blocks":[{"key":"quantities","title":"Food quantities and prices","purpose":"Make a shopping list and read prices without guessing what to buy.","text":"Shop talk needs quantities. Say zwei Tomaten when buying countable tomatoes, ein Kilo Äpfel for a kilogram of apples, eine Packung Milch for a carton of milk, and ein Stück Käse for a piece of cheese. The quantity word is part of the request, so read it alongside the food. German shop prices use Euro and Cent: drei Euro fünfzig means €3.50. A short shopping note can tell you which item, how much, and where to buy it. Ask Was kostet das? for the price of an item, or Was kostet das zusammen? for the combined total.","examples":[["Zwei Tomaten, bitte.","Two tomatoes, please."],["Ein Kilo Äpfel, bitte.","One kilogram of apples, please."],["Eine Packung Milch, bitte.","One carton of milk, please."],["Das kostet drei Euro fünfzig.","That costs €3.50."]],"note":"Brötchen is a bread roll, not a sandwich. Bäckerei names the shop where bread products are sold.","task":"Ask politely for one carton of milk.","answer":"Eine Packung Milch, bitte."},{"key":"accusative","title":"The accusative you need for shopping","purpose":"Understand the article change before buying, ordering and checking grammar.","text":"A direct object tells you what somebody buys or wants. In Der Apfel ist rot, Apfel is the subject and uses der. In Ich kaufe den Apfel, it is the object, so der becomes den. In a similar sentence, ein becomes einen: Ich kaufe einen Apfel. Feminine die/eine and neuter das/ein do not change in these simple accusative examples. Identify the noun's article first, then ask what role it plays in the sentence. The object article is why a person says einen Saft, eine Suppe and ein Brötchen. This is the grammar you need before the chapter's ordering tasks.","examples":[["der Apfel → Ich kaufe den Apfel.","the apple → I buy the apple."],["ein Saft → Ich möchte einen Saft.","a juice → I would like a juice."],["eine Suppe → Ich möchte eine Suppe.","a soup → I would like a soup."],["ein Brötchen → Ich nehme ein Brötchen.","a bread roll → I'll take a bread roll."]],"note":"Do not generalise den to every gender. The masculine article changes here; feminine and neuter articles do not.","task":"Complete: Ich kaufe ___ Käse (der Käse).","answer":"den Käse"},{"key":"shop-vowels","title":"Hear umlauts and finish a food exchange","purpose":"Pronounce key foods and use a complete, polite purchase conversation.","text":"Food vocabulary introduces ä, ö and ü. You will hear ä in Käse, ö in Brötchen and ü in Gemüse. The rounded vowel sounds ö and ü are different from plain o and u; listen and repeat rather than guessing their English equivalents. A simple purchase begins with Guten Tag, continues with a request and a price question, then ends with Danke or Auf Wiedersehen. A brief food order is fine here, but full restaurant menus, paying together or separately, and recounting a dinner belong to the later Chapter 6 social situation.","examples":[["Ich möchte zwei Brötchen, bitte.","I would like two rolls, please."],["Was kostet das zusammen?","How much is that altogether?"],["Das macht vier Euro.","That comes to four euros."],["Vielen Dank. Auf Wiedersehen.","Many thanks. Goodbye."]],"note":"Brötchen contains ö; Gemüse contains ü; Käse contains ä. Say the full word with German audio rather than replacing the umlaut.","task":"Say an order for two bread rolls and ask what they cost.","answer":"Ich möchte zwei Brötchen, bitte. Was kostet das?"}]},{"n":5,"title":"Before your Chapter 5 activities","blocks":[{"key":"clocks","title":"Hours, half-hours and schedules","purpose":"Read clock times before describing routines or changing appointments.","text":"In German, um introduces a clock time. Learn that um acht Uhr is at 8:00 and um achtzehn Uhr is at 18:00. Everyday speech uses halb for the coming hour, so halb acht means 7:30, not 8:30. Viertel nach acht is 8:15 and Viertel vor neun is 8:45. A digital timetable might use 15:30, which is read as fünfzehn Uhr dreißig, while conversation might say halb vier. To describe a whole work period, use von neun bis fünfzehn Uhr. Match the expression to an actual clock or schedule before writing a routine.","examples":[["7:30 → halb acht","half past seven"],["8:15 → Viertel nach acht","quarter past eight"],["8:45 → Viertel vor neun","quarter to nine"],["15:30 → fünfzehn Uhr dreißig / halb vier","three thirty p.m."]],"note":"The half-hour points FORWARD: halb neun is 8:30. Am goes with a weekday; um goes with the time.","task":"When does a class start if it starts um halb neun?","answer":"At 08:30."},{"key":"modals","title":"Can, must and want: three modal verbs","purpose":"Understand scheduling conflicts and the sentence bracket.","text":"Use können for can, müssen for must and wollen for want. With a second action, the finite modal comes near the beginning and the other verb stays in the infinitive at the end: Ich kann am Freitag kommen; Ich muss am Samstag arbeiten; Ich will morgen einkaufen. Notice how the forms change: ich kann/muss/will, du kannst/musst/willst, er oder sie kann/muss/will. For questions, move the finite modal to the front: Kannst du am Dienstag kommen? Learn the reason and the alternative day together. This will help you answer appointment questions and understand apologies, not just select a verb from a list.","examples":[["Ich kann heute kommen.","I can come today."],["Ich muss morgen arbeiten.","I must work tomorrow."],["Ich will einkaufen.","I want to shop."],["Kannst du am Freitag kommen?","Can you come on Friday?"]],"note":"Do not conjugate the final action verb after a modal: Ich muss arbeiten, not Ich muss arbeite.","task":"Say 'I want to study German tomorrow' with wollen.","answer":"Ich will morgen Deutsch lernen."},{"key":"phone","title":"Appointments, delays and a clear phone reply","purpose":"Respond politely rather than being tested on unseen appointment language.","text":"An appointment message should clearly state the day, time and response. Ask Haben Sie am Mittwoch um elf Uhr Zeit? If the time does not work, say Leider kann ich nicht, then suggest an alternative. Verspätung means delay or lateness. Mein Bus hat Verspätung tells someone why you cannot arrive on time. In a short phone exchange, state your name, confirm the planned time, explain the problem and propose another time. Pronunciation also matters: German r has different regional realisations, so practise hearing it in arbeiten, Freitag and Termin rather than forcing one English r sound.","examples":[["Haben Sie am Mittwoch um elf Uhr Zeit?","Are you free Wednesday at eleven?"],["Mein Bus hat Verspätung.","My bus is delayed."],["Leider kann ich nicht kommen.","Unfortunately I cannot come."],["Können wir uns um halb vier treffen?","Can we meet at 3:30?"]],"note":"Keep time expressions precise: am Mittwoch (day), um elf Uhr (hour), von neun bis zwölf (range).","task":"Say the bus is delayed and suggest 15:30 instead.","answer":"Mein Bus hat Verspätung. Können wir uns um halb vier treffen?"}]},{"n":6,"title":"Before your Chapter 6 activities","blocks":[{"key":"dates","title":"Write and say calendar dates","purpose":"Understand birthday invitations and announced dates before writing them.","text":"You already know the cardinal numbers. Calendar dates after am usually use ordinal forms: am ersten Mai (1 May), am zweiten Mai, am dritten Mai and am vierten Mai. Notice special forms such as am sechsten, am siebten and am achten. Dates through 19 commonly end in -ten, while dates from 20 onward normally end in -sten: am zwanzigsten Mai and am einundzwanzigsten Mai. In an invitation, write the day, month and time clearly and read all of them aloud. Asking Wann? means when, while Wo? asks for a place. Do not forget the location of the event.","examples":[["am ersten Mai","on 1 May"],["am dritten Mai","on 3 May"],["am zwölften Mai","on 12 May"],["am einundzwanzigsten Mai","on 21 May"]],"note":"An ordinal needs its ending: am drei Mai is not the expected date phrase; am dritten Mai is.","task":"Say 7 May and 20 May as calendar dates.","answer":"am siebten Mai · am zwanzigsten Mai"},{"key":"pronouns","title":"For whom? Direct objects and pronouns","purpose":"Use für + accusative and replace a repeated name in an invitation.","text":"An invitation or gift may be for a person: für dich (for you, informal), für ihn (for him), für sie (for her) or für uns (for us). The preposition für takes the accusative: für den Freund, für einen Freund. You already met accusative articles while shopping in Chapter 4. The same idea helps with personal pronouns: Ich sehe Paul becomes Ich sehe ihn; Ich sehe Anna becomes Ich sehe sie. Other useful forms are mich (me) and dich (you, informal). Name the person first, then choose the object form. This makes a short conversation less repetitive and prepares you for the workbook grammar question.","examples":[["Das ist für dich.","This is for you."],["Das Geschenk ist für den Freund.","The gift is for the friend."],["Ich sehe Paul. Ich sehe ihn.","I see Paul. I see him."],["Ich sehe Anna. Ich sehe sie.","I see Anna. I see her."]],"note":"For a masculine direct object use ihn, not er. With für, the masculine article der becomes den.","task":"Complete: Das Geschenk ist ___ dich. Ich sehe Paul. Ich sehe ___.","answer":"für · ihn"},{"key":"sounds","title":"Ei, eu and au in social situations","purpose":"Hear dates, leisure activities and invitations without confusing similar words.","text":"German combines some vowels into one sound. Ei sounds like the English vowel in eye, as in Zeit and drei. Eu and äu share a sound similar to oy, as in Freunde, heute and Häuser. Au resembles ow in house, as in Haus and auch. Practise the whole word, not just the letters. In a short event notice, find the name of the event, date, time, place and possibly ticket price. A friend might write: 'Treffen am Samstag um 18 Uhr im Park. Eintritt frei.' That tells you the day, time, place and that entry is free. Then practise saying whether you can attend.","examples":[["die Zeit · drei","time · three (ei)"],["die Freunde · heute","friends · today (eu)"],["das Haus · auch","house · also (au)"],["Die Feier ist am Samstag.","The celebration is on Saturday."]],"note":"German ei and ie are not interchangeable: drei has the ei diphthong, but sieben has a long ie sound.","task":"Which sound group is in Freunde? Which is in Haus?","answer":"Freunde has eu; Haus has au."}]}];
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const get=n=>chapters.find(c=>c.n===Number(n));
const render=n=>{
const c=get(n);if(!c)return '';
return `<section class="a11-prerequisites" aria-label="Chapter ${c.n} essential language foundations" id="chapter-${c.n}-foundations"><div class="a11-prerequisite-head"><span class="eyebrow">Chapter ${c.n} · Learn this before the chapter challenge</span><h5>${esc(c.title)}</h5><p>Study the complete examples and patterns here before completing the related workbook questions or the final chapter task. The examples are original and follow the uploaded A1.1 chapter objectives.</p></div><nav class="a11-prerequisite-nav" aria-label="Chapter ${c.n} foundational topics">${c.blocks.map((b,i)=>`<button type="button" data-jump-target="ch${c.n}-foundation-${esc(b.key)}">${c.n}.${i+1} ${esc(b.title)} ↓</button>`).join('')}</nav><div class="a11-prerequisite-lessons">${c.blocks.map((b,i)=>`<article class="a11-prerequisite-block" id="ch${c.n}-foundation-${esc(b.key)}"><header><span class="a11-prerequisite-index">${c.n}.${i+1}</span><div><h6>${esc(b.title)}</h6><p>${esc(b.purpose)}</p></div></header><p class="a11-prerequisite-explain">${esc(b.text)}</p><div class="a11-prerequisite-examples">${b.examples.map(([de,en])=>`<div><strong lang="de">${esc(de)}</strong><span>${esc(en)}</span><button type="button" class="view-link" data-speak="${esc(de)}">♫ Listen</button></div>`).join('')}</div><p class="a11-prerequisite-note"><strong>Remember:</strong> ${esc(b.note)}</p><div class="a11-prerequisite-check"><strong>Try it yourself</strong><p>${esc(b.task)}</p><details><summary>Reveal a model answer</summary><p lang="de">${esc(b.answer)}</p></details></div></article>`).join('')}</div></section>`;
};
window.GERMAN_PREREQUISITES={chapters,get,render};
})();

const data=[
