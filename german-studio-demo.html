        {id:'g-r3',skill:'reading',context:'Small advertisement',passage:'Fahrrad zu verkaufen. 60 Euro. Bitte ab 18 Uhr anrufen.',question:'When should you call about the bicycle?',options:['Before 8:00','At 16:00','From 18:00'],answer:2,explanation:'„Ab 18 Uhr“ means from 18:00 onward.'},
        {id:'g-r4',skill:'reading',context:'Language school notice',passage:'Deutschkurs: Dienstag und Donnerstag, 17 Uhr, Raum 204.',question:'Which room is the course in?',options:['Room 17','Room 240','Room 204'],answer:2,explanation:'„Raum 204“ gives the classroom number.'}
      ],
      writing:{id:'g-w1',title:'A message to your course teacher',prompt:'You cannot attend German class on Tuesday. Write a short message to your teacher: say you cannot come, give a simple reason, ask for the homework, and thank them.',guidance:'Aim for 25–40 German words. Include a greeting and a closing.',criteria:['Clear greeting and purpose','Simple reason','Question about homework','Polite closing']},
      speaking:{id:'g-s1',title:'Introduce yourself and make a request',prompt:'First introduce yourself: name, home city and one language you speak. Then imagine you are in a café: ask politely for water and ask the price.',guidance:'Speak aloud for about a minute. Afterwards, write brief notes of what you said; the browser does not record or grade your voice.',criteria:['Simple self-introduction','Understandable polite request','Question about price','Clear everyday German']}
    },
    telc: {
      title:'telc Deutsch A1',subtitle:'Start Deutsch 1 · Adult exam',
      official:'https://www.telc.net/en/language-examinations/certificate-exams/german/start-german1-telc-german-a1/',
      note:'This mini-mock uses original prompts inspired by common A1 language tasks. It does not reproduce telc materials or official scoring.',
      tips:[
        'For listening, look for the practical outcome: when, where, how much, or what someone must do.',
        'Read notices carefully for opening times, appointments, addresses and small restrictions.',
        'For writing, answer all parts of the situation using familiar vocabulary and short sentences.',
        'For speaking, practise everyday introductions, questions and requests with a partner or teacher.'
      ],
      questions: [
        {id:'t-l1',skill:'listening',context:'Telephone message',audio:'Hallo Paul! Unser Termin ist am Freitag um zehn Uhr, nicht am Donnerstag.',question:'When is the appointment?',options:['Thursday at 10:00','Friday at 10:00','Friday at 12:00'],answer:1,explanation:'The speaker says „am Freitag um zehn Uhr“.'},
        {id:'t-l2',skill:'listening',context:'At the supermarket',audio:'Die Bananen kosten heute ein Euro achtzig pro Kilo.',question:'What is the price per kilogram?',options:['€1.80','€1.18','€2.80'],answer:0,explanation:'„Ein Euro achtzig“ is €1.80.'},
        {id:'t-l3',skill:'listening',context:'Directions',audio:'Gehen Sie geradeaus und dann links. Die Apotheke ist neben der Bank.',question:'Where is the pharmacy?',options:['Behind the station','In the bank','Next to the bank'],answer:2,explanation:'„Neben der Bank“ means next to the bank.'},
        {id:'t-l4',skill:'listening',context:'A family invitation',audio:'Wir essen am Sonntag um zwölf Uhr zusammen. Komm bitte pünktlich!',question:'When is the family meal?',options:['Sunday at 12:00','Saturday at 12:00','Sunday at 20:00'],answer:0,explanation:'„Am Sonntag um zwölf Uhr“ means Sunday at noon.'},
        {id:'t-r1',skill:'reading',context:'Public notice',passage:'Bibliothek: Montag bis Freitag 10–18 Uhr. Am Mittwoch nur bis 14 Uhr.',question:'When does the library close on Wednesday?',options:['18:00','14:00','10:00'],answer:1,explanation:'„Am Mittwoch nur bis 14 Uhr“ means Wednesday until 14:00.'},
        {id:'t-r2',skill:'reading',context:'Message from a friend',passage:'Hi Tim, treffen wir uns heute um 19 Uhr vor dem Kino? Ich habe zwei Karten. – Lea',question:'Where does Lea want to meet?',options:['At the park','At the restaurant','In front of the cinema'],answer:2,explanation:'„Vor dem Kino“ means in front of the cinema.'},
        {id:'t-r3',skill:'reading',context:'Flat advertisement',passage:'Kleines Zimmer frei. 350 Euro im Monat. Küche und Bad gemeinsam.',question:'What is the monthly rent?',options:['€350','€530','€300'],answer:0,explanation:'„350 Euro im Monat“ is the monthly rent.'},
        {id:'t-r4',skill:'reading',context:'Doctor office sign',passage:'Praxis Dr. Müller: Bitte bringen Sie Ihre Versicherungskarte mit.',question:'What should patients bring?',options:['A photo','An insurance card','A book'],answer:1,explanation:'„Versicherungskarte“ means insurance card.'}
      ],
      writing:{id:'t-w1',title:'Invite a friend',prompt:'Write a short message inviting a German-speaking friend for coffee this weekend. Say where, suggest a day and time, and ask whether they can come.',guidance:'Aim for 25–40 German words. Use a greeting, an invitation, a question and a closing.',criteria:['Clear invitation','Place and time','Question to the friend','Friendly closing']},
      speaking:{id:'t-s1',title:'Everyday conversation',prompt:'Introduce yourself and say where you live. Imagine you need to get to the railway station: politely ask someone where it is, then thank them.',guidance:'Practise aloud, ideally with another person. Note the sentences you used for teacher feedback; this is not an audio assessment.',criteria:['Self-introduction','Polite question','Everyday location vocabulary','Appropriate thanks']}
    }
  }
});

</script>
<script>
(() => {
  'use strict';
  const data = window.GERMAN_EXAM_DATA;
  if (!data) return;
  const key = 'ambertheory-german-exams-v1';
  const limitMs = 18 * 60 * 1000; // Short independent mock; NOT the official examination time.
  const blank = () => ({provider:'goethe',level:'A1',active:null,attempts:[],reviews:{},customQuestions:[]});
  const stored = (() => {try {return JSON.parse(localStorage.getItem(key));} catch {return null;}})();
  let state = {...blank(),...(stored && typeof stored === 'object' ? stored : {})};
  if (!data.tracks[state.provider]) state.provider = 'goethe';
  if (!Array.isArray(state.attempts)) state.attempts = [];
  if (!Array.isArray(state.customQuestions)) state.customQuestions = [];
  if (!state.reviews || typeof state.reviews !== 'object') state.reviews = {};
  let page = 'home';
  let viewedResult = null;
  let editItem = null;
  let builderOpen = false;
  const esc = value => String(value ?? '').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const save = () => {try {localStorage.setItem(key,JSON.stringify(state));} catch {message('Storage unavailable: this attempt may not be saved.');}};
  const track = () => data.tracks[state.provider];
  const formatTime = milliseconds => {const n=Math.max(0,Math.ceil(milliseconds/1000));return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;};
  const elapsed = attempt => attempt.elapsedMs + (attempt.paused ? 0 : Math.max(0,Date.now()-attempt.resumedAt));
  const remaining = attempt => Math.max(0,limitMs-elapsed(attempt));
  const questionItems = (provider,skill) => {
    const base=data.tracks[provider];
    const approved=state.customQuestions.filter(q=>q.provider===provider&&q.level==='A1'&&q.status==='published');
    const choices=[...base.questions,...approved].filter(q=>skill==='all'||q.skill===skill).map(q=>({...q,type:'choice'}));
    const written=['writing','speaking'].filter(s=>skill==='all'||skill===s).map(s=>({...base[s],skill:s,type:'written'}));
    return [...choices,...written];
  };
  const totalCorrect = attempt => attempt.items.filter(q=>q.type==='choice'&&attempt.answers[q.id]===q.answer).length;
  const totalAuto = attempt => attempt.items.filter(q=>q.type==='choice').length;
  const countAnswered = attempt => attempt.items.filter(q=>q.type==='choice'?Number.isInteger(attempt.answers[q.id]):Boolean((attempt.texts[q.id]||'').trim())).length;
  const skillLabel = id => data.skills.find(s=>s.id===id)?.name||id;
  function message(text){const el=document.getElementById('toast');if(el){el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3800);}}
  function refresh(){const learner=document.getElementById('exam-root'),teacher=document.getElementById('exam-teacher-root');if(learner)learner.innerHTML=renderLearner();if(teacher)teacher.innerHTML=renderTeacher();}
  function start(mode,skill){
    if(state.active && !confirm('Replace your unfinished practice? Your completed attempts will be kept.'))return;
    const items=questionItems(state.provider,skill);
    if(!items.length){message('No reviewed questions available for this skill yet.');return;}
    state.active={id:`exam-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,provider:state.provider,level:'A1',mode,skill,items,answers:{},texts:{},index:0,startedAt:Date.now(),resumedAt:Date.now(),elapsedMs:0,paused:false};
    page='attempt';save();refresh();window.scrollTo({top:0,behavior:'instant'});
  }
  function submit(expired=false){
    const attempt=state.active;if(!attempt)return;
    if(!expired && countAnswered(attempt)<attempt.items.length && !confirm('Some tasks are unanswered. Finish and review your attempt anyway?'))return;
    attempt.elapsedMs=attempt.mode==='mock'?Math.min(limitMs,elapsed(attempt)):0;
    attempt.paused=true;attempt.completedAt=Date.now();attempt.timedOut=expired;
    state.attempts.unshift(attempt);state.attempts=state.attempts.slice(0,30);state.active=null;
    viewedResult=attempt.id;page='result';save();refresh();window.scrollTo({top:0,behavior:'instant'});
  }
  function resume(){if(!state.active)return;state.active.resumedAt=Date.now();state.active.paused=false;save();}
  function pause(){if(!state.active)return;state.active.elapsedMs=elapsed(state.active);state.active.paused=true;save();}
  function readResult(){return state.attempts.find(a=>a.id===viewedResult)||state.attempts[0];}
  function renderLearner(){
    if(page==='attempt' && state.active)return renderAttempt();
    if(page==='result' && readResult())return renderResult(readResult());
    const recent=state.attempts.slice(0,5),active=state.active;
    return `<div class="exam-page">
      <button class="view-link" data-route="student">← Back to Learning</button>
      <section class="exam-hero"><div><span class="eyebrow">Exam preparation · First Steps</span><h1>Practise for the moment that matters.</h1><p>Build confidence in listening, reading, writing and speaking. Choose an exam, practise one skill or try an original A1 mini-mock.</p></div><span class="exam-hero-symbol" aria-hidden="true">✦</span></section>
      <section class="exam-track-panel card"><div class="exam-panel-heading"><div><span class="eyebrow">Choose your exam</span><h2>One goal. Your preparation path.</h2></div><span class="tag tag-warm">Original demo practice · Teacher review needed</span></div>
        <div class="exam-provider-tabs" role="group" aria-label="Exam provider">${Object.entries(data.tracks).map(([id,x])=>`<button class="exam-provider ${state.provider===id?'active':''}" data-exam-action="provider" data-value="${id}" aria-pressed="${state.provider===id}"><strong>${id==='goethe'?'Goethe-Institut':'telc'}</strong><small>${esc(x.subtitle)}</small></button>`).join('')}</div>
        <div class="exam-levels" role="group" aria-label="Language level">${data.levels.map(l=>`<button class="exam-level ${l.available?'active':'planned'}" data-exam-action="level" data-value="${l.id}" ${l.available?'aria-pressed="true"':'disabled aria-disabled="true"'} title="${l.available?'A1 practice available':'Practice content not yet validated'}"><strong>${l.id}</strong><small>${esc(l.available?'Beginner practice':l.name+' · Planned')}</small></button>`).join('')}</div>
        <p class="exam-track-caption"><b>${esc(track().title)}.</b> A1 is the official beginner level. Other levels appear for orientation but are not available until content has been created and reviewed.</p>
      </section>
      ${active?`<div class="exam-resume card"><div><span class="eyebrow">Unfinished attempt</span><h3>${active.mode==='mock'?'A1 mini-mock':skillLabel(active.skill)+' practice'} · ${active.provider==='goethe'?'Goethe':'telc'}</h3><p>${countAnswered(active)} of ${active.items.length} tasks answered${active.mode==='mock'?` · ${formatTime(remaining(active))} remaining`:''}</p></div><button class="btn btn-primary" data-exam-action="resume">Resume →</button></div>`:''}
      <section class="exam-main-cta"><div><span class="eyebrow">Full practice journey</span><h2>Try the A1 mini-mock</h2><p>A shortened practice across all four skills. Multiple-choice questions are automatically checked; writing and speaking notes can be reviewed by your teacher. The 18-minute timer is for this demo only.</p><div class="exam-cta-meta"><span>◷ 18 min</span><span>▤ ${questionItems(state.provider,'all').length} tasks</span><span>✓ Retake and review</span></div></div><button class="btn btn-white" data-exam-action="start" data-mode="mock" data-skill="all">Start mini-mock →</button></section>
      <section class="exam-section"><div class="section-intro"><div><span class="eyebrow">Practise by skill</span><h2>Take one step at a time.</h2><p>Target the part you want to strengthen, without a timer.</p></div></div><div class="exam-skills">${data.skills.map(s=>`<article class="card exam-skill"><span class="exam-skill-icon">${s.icon}</span><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><button class="view-link" data-exam-action="start" data-mode="practice" data-skill="${s.id}">Practise ${esc(s.name.toLowerCase())} →</button></article>`).join('')}</div></section>
      <div class="exam-two-col"><section class="card exam-advice"><span class="eyebrow">Preparation tips · ${state.provider==='goethe'?'Goethe':'telc'}</span><h2>Small habits, calmer exams.</h2><ol>${track().tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><a href="${track().official}" target="_blank" rel="noopener noreferrer">Official ${state.provider==='goethe'?'Goethe':'telc'} preparation resources ↗</a></section>
      <section class="card exam-history"><span class="eyebrow">Your attempt history</span><h2>See your progress.</h2>${recent.length?recent.map(a=>`<div class="exam-history-item"><div><strong>${a.provider==='goethe'?'Goethe':'telc'} · ${a.mode==='mock'?'Mini-mock':skillLabel(a.skill)}</strong><small>${new Date(a.completedAt).toLocaleDateString()} · ${totalCorrect(a)}/${totalAuto(a)} automatically checked</small></div><button class="view-link" data-exam-action="result" data-value="${esc(a.id)}">Review →</button></div>`).join(''):'<p>No attempts yet. Complete a skill practice or mini-mock to see your results here.</p>'}<p class="exam-footnote">Results stay in this browser. They are practice indicators, not official exam grades.</p></section></div></div>`;
  }
  function renderAttempt(){
    const a=state.active,i=Math.min(a.index,a.items.length-1),q=a.items[i];
    return `<div class="exam-page"><div class="exam-attempt-top"><button class="view-link" data-exam-action="home">← Exam Preparation</button><span class="tag tag-warm">${a.provider==='goethe'?'Goethe':'telc'} · A1 ${a.mode==='mock'?'mini-mock':'practice'}</span></div>
    <section class="exam-attempt-head"><div><span class="eyebrow">${a.mode==='mock'?'Timed mini-mock':'Untimed skill practice'} · ${skillLabel(q.skill)}</span><h1>Task ${i+1} of ${a.items.length}</h1><p>${countAnswered(a)} answered · Your answers are saved in this browser.</p></div>${a.mode==='mock'?`<div class="exam-timer"><span>Time remaining</span><strong data-exam-timer>${formatTime(remaining(a))}</strong><button data-exam-action="${a.paused?'unpause':'pause'}" class="btn btn-outline btn-small">${a.paused?'Resume timer':'Pause timer'}</button></div>`:''}</section>
    <div class="exam-step-track">${a.items.map((item,j)=>`<button class="exam-step ${j===i?'active':''} ${item.type==='choice'?Number.isInteger(a.answers[item.id])?'answered':'':(a.texts[item.id]||'').trim()?'answered':''}" data-exam-action="jump" data-value="${j}" aria-label="Go to task ${j+1}: ${skillLabel(item.skill)}" ${a.paused?'disabled':''}>${j+1}</button>`).join('')}</div>
    ${a.paused?`<section class="card exam-paused"><h2>Practice paused</h2><p>Your work is safe in this browser. Resume when you are ready.</p><button class="btn btn-primary" data-exam-action="unpause">Resume attempt →</button></section>`:
    `<article class="card exam-question"><span class="eyebrow">${skillLabel(q.skill)} · ${q.type==='choice'?'Choose one answer':'Teacher-reviewed task'}</span><h2>${q.type==='written'?esc(q.title):esc(q.context)}</h2>
      ${q.type==='choice'?`${q.skill==='listening'?`<div class="exam-audio"><span class="exam-skill-icon">♫</span><div><strong>Listen to the short German message</strong><small>Browser-generated German speech · Repeat as needed</small></div><button class="btn btn-primary btn-small" data-exam-action="speak" data-value="${esc(q.id)}">▶ Play German</button></div>`:`<div class="exam-passage" lang="de">${esc(q.passage)}</div>`}<p class="exam-prompt">${esc(q.question)}</p><div class="exam-choices" role="group" aria-label="Choose one answer">${q.options.map((option,n)=>`<button class="exam-choice ${a.answers[q.id]===n?'selected':''}" data-exam-action="answer" data-value="${n}" aria-pressed="${a.answers[q.id]===n}"><span>${String.fromCharCode(65+n)}</span>${esc(option)}</button>`).join('')}</div>`:
      `<p class="exam-prompt">${esc(q.prompt)}</p><div class="study-note">${esc(q.guidance)}</div><label class="form-field" for="exam-written-response">${q.skill==='speaking'?'Notes from your spoken rehearsal':'Your German response'}</label><textarea id="exam-written-response" class="text-entry exam-written" data-exam-text="${esc(q.id)}" maxlength="1500" placeholder="Schreiben Sie auf Deutsch …">${esc(a.texts[q.id]||'')}</textarea><p class="exam-footnote">${q.skill==='speaking'?'Speak aloud first. Audio is not recorded, uploaded or automatically assessed.':'Your answer will be visible to the demo teacher in this browser for qualitative review.'}</p>`}
      <div class="exam-question-actions"><button class="btn btn-outline" data-exam-action="jump" data-value="${Math.max(0,i-1)}" ${i===0?'disabled':''}>← Previous</button>${i<a.items.length-1?`<button class="btn btn-primary" data-exam-action="jump" data-value="${i+1}">Next task →</button>`:`<button class="btn btn-primary" data-exam-action="submit">Finish & see results →</button>`}</div></article>`}
    <div class="exam-attempt-footer"><span>Original practice content · Not an official examination</span><button class="view-link" data-exam-action="submit">Submit attempt</button></div></div>`;
  }
  function renderResult(a){
    const auto=totalAuto(a),correct=totalCorrect(a),written=a.items.filter(q=>q.type==='written'&&(a.texts[q.id]||'').trim());
    const reviews=state.reviews[a.id]||{};
    const breakdown=['listening','reading'].map(skill=>{const tasks=a.items.filter(q=>q.type==='choice'&&q.skill===skill);const got=tasks.filter(q=>a.answers[q.id]===q.answer).length;return tasks.length?`<div><strong>${got}/${tasks.length}</strong><span>${skillLabel(skill)} · automatically checked</span></div>`:''}).join('');
    return `<div class="exam-page"><button class="view-link" data-exam-action="home">← Exam Preparation</button><section class="exam-result-hero"><span class="eyebrow">Practice complete · ${a.provider==='goethe'?'Goethe':'telc'} A1</span><h1>${a.timedOut?'Time is up — review what you tried.':'Good effort. Now learn from it.'}</h1><p>This shortened mock is independently authored. Only multiple-choice items receive automatic checking; no pass/fail or official score is calculated.</p><div class="exam-result-number"><strong>${auto?`${correct}/${auto}`:'✓'}</strong><span>${auto?'Objective questions correct':'Practice response saved'}</span></div></section>
      <div class="exam-result-grid">${breakdown||'<div><strong>Teacher review</strong><span>This practice has no auto-scored tasks.</span></div>'}<div><strong>${written.length}</strong><span>Responses submitted for teacher review</span></div></div>
      <section class="card exam-review-list"><span class="eyebrow">Review and explanations</span><h2>Understand each answer.</h2>${a.items.map((q,i)=>`<article class="exam-review-item"><div class="exam-review-title"><strong>${i+1}. ${q.type==='choice'?esc(q.question):esc(q.title)}</strong><span class="tag ${q.type==='written'?'tag-warm':a.answers[q.id]===q.answer?'tag-dark':'tag-muted'}">${q.type==='written'?'Teacher review':a.answers[q.id]===q.answer?'Correct':'Review'}</span></div>${q.type==='choice'?`<p>Your answer: ${Number.isInteger(a.answers[q.id])?esc(q.options[a.answers[q.id]]):'Not answered'}</p><p><b>Correct:</b> ${esc(q.options[q.answer])}. ${esc(q.explanation)}</p>`:`<blockquote>${esc(a.texts[q.id]||'No response submitted')}</blockquote><p><b>Practice checklist:</b> ${q.criteria.map(esc).join(' · ')}</p>${reviews[q.id]?`<div class="feedback"><b>Teacher feedback (${reviews[q.id].rating}/5 practice rubric):</b> ${esc(reviews[q.id].note)}</div>`:'<p class="exam-footnote">Awaiting teacher feedback in this browser. This is not an official speaking/writing grade.</p>'}`}</article>`).join('')}</section><div class="exam-result-actions"><button class="btn btn-primary" data-exam-action="start" data-mode="${a.mode}" data-skill="${a.skill}">Retake practice →</button><button class="btn btn-outline" data-exam-action="home">Back to preparation</button></div></div>`;
  }
  function renderTeacher(){
    const writing=state.attempts.flatMap(a=>a.items.filter(q=>q.type==='written'&&(a.texts[q.id]||'').trim()).map(q=>({a,q}))).slice(0,16);
    const pending=writing.filter(({a,q})=>!state.reviews[a.id]?.[q.id]);
    return `<section class="exam-teacher-section"><div class="section-intro"><div><span class="eyebrow">Exam coaching studio</span><h2>Prepare. Review. Improve.</h2><p>Adapt a practice question, publish it to this browser's demo learner, and give targeted feedback on written or spoken-rehearsal notes.</p></div><span class="tag tag-warm">${pending.length} exam responses awaiting review</span></div>
      <div class="exam-teacher-stats"><div class="card"><span>Practice attempts</span><strong>${state.attempts.length}</strong><small>Current browser</small></div><div class="card"><span>Published teacher questions</span><strong>${state.customQuestions.filter(x=>x.status==='published').length}</strong><small>Additional skill practice</small></div><div class="card"><span>Responses to review</span><strong>${pending.length}</strong><small>Writing and speaking notes</small></div></div>
      <div class="exam-teacher-grid"><div class="card exam-teacher-panel"><div class="exam-panel-heading"><div><span class="eyebrow">Question authoring</span><h3>Your practice question bank</h3></div><button class="btn btn-primary btn-small" data-exam-action="new-item">+ Create question</button></div><p>Create original listening or reading multiple-choice questions with explanations. Publish only after checking the German and the correct answer.</p>${builderOpen?renderBuilder():''}${state.customQuestions.length?`<div class="exam-question-bank">${state.customQuestions.map(q=>`<div><div><strong>${esc(q.question)}</strong><small>${q.provider==='goethe'?'Goethe':'telc'} · ${skillLabel(q.skill)} · ${q.status==='published'?'Published':'Draft'}</small></div><button class="view-link" data-exam-action="edit-item" data-value="${esc(q.id)}">Edit</button><button class="view-link" data-exam-action="toggle-item" data-value="${esc(q.id)}">${q.status==='published'?'Unpublish':'Publish'}</button></div>`).join('')}</div>`:'<div class="empty">No teacher-authored questions yet. The demo comes with original sample items for both exams.</div>'}</div>

  function speakQuestion(id){

    const type=button.dataset.examAction,value=button.dataset.value,a=state.active;

    if(type==='home'){page='home';refresh();window.scrollTo({top:0,behavior:'instant'});return;}
    if(type==='result'){viewedResult=value;page='result';refresh();window.scrollTo({top:0,behavior:'instant'});return;}
    if(type==='new-item'){builderOpen=true;editItem=null;refresh();return;}
    if(type==='edit-item'){editItem=value;builderOpen=true;refresh();return;}
    if(type==='close-builder'){builderOpen=false;editItem=null;refresh();return;}
    if(type==='save-item'){saveItem(button.dataset.status);return;}
    if(type==='toggle-item'){const q=state.customQuestions.find(x=>x.id===value);if(q){q.status=q.status==='published'?'draft':'published';save();refresh();}return;}

      const id=button.dataset.attempt,item=button.dataset.item,compound=`${id}:${item}`;
      const note=document.querySelector(`[data-exam-feedback="${compound}"]`)?.value.trim();

      if(!note||note.length<8){message('Give at least one useful strength or next step.');return;}
      state.reviews[id]??={};state.reviews[id][item]={note,rating,reviewedAt:Date.now()};save();refresh();message('Practice feedback saved in this browser.');return;
    }
    if(!a)return;
    if(type==='speak'){speakQuestion(value);return;}
    if(type==='pause'){pause();refresh();return;}
    if(type==='unpause'){resume();refresh();return;}
    if(type==='submit'){submit();return;}
    if(a.paused)return;
    if(type==='jump'){a.index=Math.min(a.items.length-1,Math.max(0,Number(value)||0));save();refresh();return;}
    if(type==='answer'){const q=a.items[a.index];if(q?.type==='choice'){a.answers[q.id]=Number(value);save();refresh();}return;}
  }
  document.addEventListener('click',e=>{const button=e.target.closest?.('button[data-exam-action]');if(button && !button.disabled)act(button);});
  document.addEventListener('input',e=>{const id=e.target.dataset?.examText;if(id && state.active && !state.active.paused){state.active.texts[id]=e.target.value;save();}});
  setInterval(()=>{const a=state.active;if(!a||a.paused||a.mode!=='mock')return;if(remaining(a)<=0){submit(true);message('Mini-mock time has ended. Your answers were saved.');return;}const timer=document.querySelector('[data-exam-timer]');if(timer)timer.textContent=formatTime(remaining(a));},1000);
  function reset(){state=blank();page='home';viewedResult=null;editItem=null;builderOpen=false;save();}
  window.GermanExamStudio={renderLearner,renderTeacher,reset};
})();

rsation.</h2></div><button class=\"btn btn-primary\" data-route=\"student\">Open Student Studio →</button></section>\n</div>";}

  function workbookUnit(id){
  const chapters=window.GERMAN_WORKBOOK?.chapters||[];
  const key=String(id);
  if(/^review-(3|6)$/.test(key)){
    const end=Number(key.split('-')[1]);
    const included=chapters.filter(c=>c.number>end-3&&c.number<=end);
    if(included.length!==3)return null;
    return {id:key,title:`Plattform ${end===3?'1':'2'} · Revision`,number:end,review:true,writing:`Write a six-sentence message using topics from Chapters ${end-2}–${end}: explain a practical situation and ask a question.`,speaking:`Rehearse a short conversation combining themes from Chapters ${end-2}–${end}. Write brief rehearsal notes for your teacher.`,support:included.map(c=>c.title).join(' · '),questions:included.flatMap(c=>[0,2,5].map(i=>({...c.questions[i],id:`${key}-${c.number}-${i}`})))};
  }
  const c=chapters.find(x=>String(x.number)===key);
  return c?{...c,id:key,questions:c.questions.map((q,i)=>({...q,id:`a11-${c.number}-q${i+1}`}))}:null;
}

function workbookResult(id){
  const unit=workbookUnit(id);
  const progress=state.workbookProgress?.[id]||{answers:{},drafts:{}};
  const correct=unit?unit.questions.filter(q=>progress.answers?.[q.id]?.correct).length:0;
  const answered=unit?unit.questions.filter(q=>progress.answers?.[q.id]).length:0;
  return {unit,progress,correct,answered,total:unit?.questions.length||0};
}

function renderWorkbook(){
  const id=ui.workbookId, r=workbookResult(id), unit=r.unit;

  return `<div class="workbook-page"><button class="view-link" data-route="student/chapters/${unit.review?String(unit.number).replace(/^review-/, ''):unit.number}">← Back to chapter</button><header class="workbook-hero">${realPhotos(unit.number,{compact:true,heading:false})||chapterVisual(unit.number)}<span class="eyebrow">${unit.review?'A1.1 revision checkpoint':`A1.1 · Chapter ${unit.number} · Workbook`}</span><h1>${escape(unit.title)}</h1><p>${unit.review?'Original integrated revision, aligned to the textbook’s Plattform checkpoint.':`Independent practice mapped to the coursebook and workbook themes in Chapter ${unit.number}.`}</p><div class="workbook-hero-progress"><strong>${r.answered} / ${r.total} answered</strong><span>${r.answered?`${r.correct} correct so far`:'Answer at your own pace'}</span></div></header>
  <section class="card workbook-check" aria-label="Interactive workbook questions"><div class="workbook-check-top"><span class="eyebrow">Listening · Reading · Grammar · Vocabulary</span><span>${i+1} of ${r.total}</span></div><div class="workbook-pips">${unit.questions.map((item,n)=>`<button class="workbook-pip ${n===i?'active':''} ${r.progress.answers?.[item.id]?'answered':''}" data-workbook-jump="${n}" aria-label="Question ${n+1}${r.progress.answers?.[item.id]?', answered':''}" aria-current="${n===i?'step':'false'}">${n+1}</button>`).join('')}</div><div class="workbook-question-label">${escape(q.skill)}</div>${q.skill==='Listening'&&q.audio?`<div class="workbook-audio"><p>Listen first. The transcript appears after checking.</p><button type="button" class="btn btn-outline btn-small" data-speak="${escape(q.audio)}" aria-label="Play German listening question">♫ Play German</button></div>`:''}${q.skill==='Reading'&&(q.reading||q.audio)?`<blockquote class="workbook-reading" lang="de">${escape(q.reading||q.audio)}</blockquote>`:''}<h2>${escape(q.prompt)}</h2><div class="choice-list">${q.options.map((option,n)=>`<button class="choice ${selected===n?'selected':''} ${answer&&n===q.correct?'correct':''} ${answer&&n===answer.chosen&&!answer.correct?'incorrect':''}" data-workbook-choice="${n}" ${answer?'disabled':''}>${escape(option)}</button>`).join('')}</div>${answer?`<div class="feedback ${answer.correct?'':'error'}"><b>${answer.correct?'Correct!':'Not quite.'}</b> ${escape(q.why)}${q.skill==='Listening'&&q.audio?`<p>Spoken text: <span lang="de">${escape(q.audio)}</span></p>`:''}</div><button class="view-link" data-workbook-retry="${escape(q.id)}">Retry this question</button>`:''}<div class="stage-foot"><button class="btn btn-outline" data-workbook-prev ${i===0?'disabled':''}>← Previous</button>${answer?`<button class="btn btn-primary" data-workbook-next ${i===r.total-1?'disabled':''}>Next question →</button>`:`<button class="btn btn-primary" data-workbook-check ${selected===null?'disabled':''}>Check answer</button>`}</div>${r.answered===r.total?`<div class="status-success">✓ Checkpoint complete: ${r.correct}/${r.total} correct. You can retry individual questions and practise the written and spoken tasks below.</div>`:''}</section>
  ${!unit.review?window.GERMAN_PHOTO_PRACTICE?.render(unit.number,state.photoPractice,ui.photoSelected)||'':''}<section class="workbook-response-grid" aria-label="Production practice">${response('writing','Writing',unit.writing)}${response('speaking','Speaking',unit.speaking)}</section><section class="card card-pad workbook-feedback"><h3>Teacher feedback on this practice</h3>${related.length?related.map(s=>`<div class="queue-item"><strong>${s.kind==='speaking'?'Speaking rehearsal notes':'Writing response'}</strong><blockquote>${escape(s.text)}</blockquote>${state.reviews[s.id]?`<div class="feedback"><b>Teacher response:</b> ${escape(state.reviews[s.id].note)}</div>`:'<p>Awaiting feedback in the Teacher Studio on this device.</p>'}</div>`).join(''):'<p>Submit a response above to request teacher feedback.</p>'}</section><p class="workbook-disclaimer">Original AmberTheory material. Synthetic German voice depends on your browser. Not an official textbook exercise or language assessment; teacher review is pending.</p></div>`;

  // A session is an ordered set of small reusable learning blocks. The static

  function sessionBlock(type){

    const examples={
      vocabulary:{title:'Useful words',entries:'Guten Tag | hello / good day\nbitte | please\ndanke | thank you'},
      listening:{title:'Listen and repeat',phrase:'Guten Tag! Wie geht es Ihnen?',instruction:'Listen twice and repeat the phrase aloud.'},
      quiz:{title:'Check understanding',question:'Which phrase means thank you?',options:'Danke\nBitte\nHallo',correct:'0',explanation:'Danke is German for thank you.'},
      roleplay:{title:'Have a conversation',prompt:'Imagine a short everyday encounter. Write two lines of dialogue in German.',starter:'Guten Tag! Ich hätte gern ...',criteria:'Use a greeting, a polite request and a thank-you.'},
      assessment:{title:'Final knowledge check',question:'Which German expression is polite?',options:'Ein Wasser, bitte.\nGute Nacht!\nNein.',correct:'0',explanation:'Bitte makes the request polite.'}

  function incompleteSessionBlock(session){

      if(!b.title?.trim())return true;
      if(b.type==='vocabulary')return !(b.entries||'').split('\n').some(row=>{const pair=row.split('|');return pair.length===2&&pair.every(part=>part.trim());});
      if(b.type==='listening')return !b.phrase?.trim()||!b.instruction?.trim();
      if(b.type==='roleplay')return !b.prompt?.trim()||!b.starter?.trim()||!b.criteria?.trim();
      if(['quiz','assessment'].includes(b.type)){
        const options=(b.options||'').split('\n').filter(x=>x.trim());

  function sessionStepContent(s,b,p){
    if(b.type==='vocabulary'){

      return `<p class="explain">Tap the sound button on each card, repeat aloud and connect the German word to its meaning.</p><div class="session-word-grid">${entries.map(([de,en])=>`<div class="session-word card"><button class="sound-button" data-speak="${escape(de)}" aria-label="Hear ${escape(de)}">♫</button><strong>${escape(de)}</strong><span>${escape(en)}</span></div>`).join('')}</div>`;
    }
    if(b.type==='listening')return `<p class="explain">${escape(b.instruction)}</p><div class="session-listen-phrase"><button class="sound-button" data-speak="${escape(b.phrase)}" aria-label="Hear German phrase">♫</button><strong>${escape(b.phrase)}</strong></div><p class="muted">Pronunciation uses your device's German speech voice. Repeat at your own pace.</p>`;
    if(b.type==='roleplay'){
      const draft=p.drafts[b.id]||'';const submissions=state.sessionSubmissions.filter(x=>x.sessionId===s.id&&x.blockId===b.id);
      return `<p class="explain">${escape(b.prompt)}</p><div class="study-note"><b>Try this expression:</b> ${escape(b.starter)} <button class="view-link" data-speak="${escape(b.starter)}" aria-label="Hear the example">♫ Listen</button></div>${window.GERMAN_CLASSROOM.difficultyInfo(s)}<div class="rubric-note"><b>Your teacher will look for:</b> ${escape(b.criteria)}</div><label class="form-field" for="session-answer">Write your German conversation</label><textarea class="text-entry" id="session-answer" data-session-writing="${escape(b.id)}" maxlength="900" placeholder="Schreibe deine Antwort …">${escape(draft)}</textarea><div class="stage-foot"><p>Stored in this browser for the teacher review demo.</p><button class="btn btn-copper" data-submit-session-roleplay="${escape(b.id)}" ${draft.trim().length<5?'disabled':''}>Send for feedback →</button></div>${submissions.length?`<div class="session-response-history">${submissions.map(r=>`<div class="queue-item"><div class="queue-head"><strong>Your response</strong><span class="tag ${state.reviews[r.id]?'tag-dark':'tag-warm'}">${state.reviews[r.id]?'Reviewed':'Awaiting feedback'}</span></div><blockquote>${escape(r.text)}</blockquote>${state.reviews[r.id]?`<div class="feedback"><b>Teacher note:</b> ${escape(state.reviews[r.id].note)}</div>${window.GERMAN_CLASSROOM.feedbackText(s,state.reviews[r.id])}`:''}</div>`).join('')}</div>`:''}`;
    }
    const opts=(b.options||'').split('\n').map(x=>x.trim()).filter(Boolean);const previous=p.answers[b.id];const selected=ui.sessionSelection[b.id];
    return `<p class="explain">${escape(b.question)}</p><div class="session-choice-grid">${opts.map((op,i)=>`<button class="choice ${selected===i?'selected':''} ${previous&&i===Number(b.correct)?'correct':''} ${previous&&previous.choice===i&&!previous.correct?'incorrect':''}" data-session-choice="${i}" ${previous?'disabled':''}>${escape(op)}</button>`).join('')}</div>${previous?`<div class="feedback ${previous.correct?'':'error'}"><b>${previous.correct?'Correct — gut gemacht!':'Not quite — keep learning.'}</b> ${escape(b.explanation)}</div>`:''}<div class="stage-foot"><p>${b.type==='assessment'?'Final check · result is saved in this demo':'Quick understanding check'}</p>${previous?`<button class="btn btn-outline btn-small" data-retry-session-answer="${escape(b.id)}">Try again</button>`:`<button class="btn btn-primary" data-check-session-answer="${escape(b.id)}" ${selected===undefined?'disabled':''}>Check my answer →</button>`}</div>`;
  }

cks.length-1?'View summary':'Next step'} →</button>`:['vocabulary','listening'].includes(b.type)?`<button class="btn btn-primary" data-complete-session-block="${escape(b.id)}">Mark complete & continue →</button>`:'<span class="muted">Complete this activity to continue</span>'}</div>`:`<span class="eyebrow">Session summary</span><h2>${finished?'Well done — session complete!':'Your progress so far'}</h2><p class="explain">${finished?'You have worked through every part of the session. You can revisit any step for more practice.':'Return to an unfinished step whenever you are ready.'}</p><div class="session-summary-grid"><div><strong>${done}/${s.blocks.length}</strong><span>Steps completed</span></div><div><strong>${Object.values(p.answers).filter(a=>a.correct&&s.blocks.some(b=>b.id===a.blockId)).length}/${s.blocks.filter(b=>['quiz','assessment'].includes(b.type)).length}</strong><span>Checks answered correctly</span></div><div><strong>${submissions.length}</strong><span>Written conversations</span></div></div><div class="session-response-history">${submissions.map(r=>`<div class="queue-item"><strong>Your conversation</strong><blockquote>${escape(r.text)}</blockquote>${state.reviews[r.id]?`<div class="feedback"><b>Teacher note:</b> ${escape(state.reviews[r.id].note)}</div>${window.GERMAN_CLASSROOM.feedbackText(s,state.reviews[r.id])}`:'<span class="tag tag-warm">Awaiting feedback</span>'}</div>`).join('')}</div><div class="stage-foot"><button class="btn btn-outline" data-route="student">Back to my learning</button><button class="btn btn-primary" data-jump-session-step="0">Revisit from the start →</button></div>`}</article></div></div>`;

  function speak(text,forcedSpeed){
    if(!window.speechSynthesis||typeof window.SpeechSynthesisUtterance!=='function'&&typeof SpeechSynthesisUtterance==='undefined'){notify('German speech playback is unavailable. Check device language/voice settings.');return;}
    const Utterance=window.SpeechSynthesisUtterance||SpeechSynthesisUtterance;
    const voiceList=window.speechSynthesis.getVoices?.()||[];
    const voice=voiceList.find(v=>/^de(-|$)/i.test(v.lang||'')&&(v.voiceURI||v.name)===state.audioSettings.voice)||voiceList.find(v=>/^de(-|$)/i.test(v.lang||''));
    if(!voice&&voiceList.length)notify('No German voice detected. Check your device speech-language settings.');
    const utterance=new Utterance(text);utterance.lang='de-DE';utterance.rate=(forcedSpeed||state.audioSettings.speed)==='slow'?.70:.95;
    if(voice)utterance.voice=voice;
    window.speechSynthesis.cancel();window.speechSynthesis.speak(utterance);
  }

    if(button.hasAttribute('data-p4-model')||button.hasAttribute('data-p4-model-slow')){const id=button.dataset.p4Model||button.dataset.p4ModelSlow,lab=window.GERMAN_AUDIO_LABS?.data[id];if(!lab)return;return speak(lab.phrase,button.hasAttribute('data-p4-model-slow')?'slow':undefined);}
    if(button.hasAttribute('data-p4-choice')){const [id,nRaw,jRaw]=button.dataset.p4Choice.split('|'),n=Number(nRaw),j=Number(jRaw),q=window.GERMAN_AUDIO_LABS?.data[id]?.questions[n];if(!q||state.audioPractice[id]?.answers?.[n]||!Number.isInteger(j)||j<0||j>=q.options.length)return;ui.audioChoices[id+':'+n]=j;render();return;}
    if(button.hasAttribute('data-p4-check')){const [id,nRaw]=button.dataset.p4Check.split('|'),n=Number(nRaw),q=window.GERMAN_AUDIO_LABS?.data[id]?.questions[n],choice=ui.audioChoices[id+':'+n];if(!q||state.audioPractice[id]?.answers?.[n]||!Number.isInteger(choice))return;const p=state.audioPractice[id]||(state.audioPractice[id]={answers:{},reflection:{}});p.answers[n]={chosen:choice,correct:choice===q.correct};save();render();return;}
    if(button.hasAttribute('data-p4-retry')){const [id,nRaw]=button.dataset.p4Retry.split('|'),n=Number(nRaw);if(!window.GERMAN_AUDIO_LABS?.data[id]?.questions[n])return;if(state.audioPractice[id]?.answers)delete state.audioPractice[id].answers[n];delete ui.audioChoices[id+':'+n];save();render();return;}
    if(button.hasAttribute('data-p4-record')){if(!window.GERMAN_AUDIO_LABS?.data[button.dataset.p4Record])return;if(button.dataset.p4Record!==currentLesson().id)return;toggleRecording('hear');return;}
    if(button.hasAttribute('data-stage')){ui.stage=button.dataset.stage;render();return;}
    if(button.hasAttribute('data-speak'))return speak(button.dataset.speak);
    if(button.hasAttribute('data-choice')){if(!ui.checked){ui.selected=Number(button.dataset.choice);render();}return;}
    if(button.hasAttribute('data-check-answer')){const l=currentLesson();const q=l.questions[ui.questionIndex];if(ui.selected===null)return;ui.answers[ui.questionIndex]={chosen:ui.selected,correct:ui.selected===q.correct};ui.checked=true;render();return;}
    if(button.hasAttribute('data-next-question')){ui.questionIndex++;ui.selected=null;ui.checked=false;render();return;}
    if(button.hasAttribute('data-retake')){ui.questionIndex=0;ui.selected=null;ui.checked=false;ui.answers={};render();return;}
    if(button.hasAttribute('data-submit-response')){const id=button.dataset.submitResponse;const draft=(state.drafts[id]||'').trim();if(draft.length<5){notify('Write a sentence before submitting.');return;}state.submissions.unshift({id:`entry-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,lessonId:id,text:draft});save();notify('Response added to the demo teacher queue.');render();return;}
    if(button.hasAttribute('data-finish-lesson')){const l=currentLesson();if(Object.keys(ui.answers).length<l.questions.length){ui.stage='check';notify('Complete the three practice questions to finish.');render();return;}if(!state.completed.includes(l.id))state.completed.push(l.id);state.scores[l.id]=Math.round(100*Object.values(ui.answers).filter(x=>x.correct).length/l.questions.length);save();notify('Lesson progress saved on this device.');navigate(`student/chapters/${l.chapterNumber||1}`);return;}
    if(button.hasAttribute('data-record')){toggleRecording('apply');return;}
    if(button.hasAttribute('data-review')){const id=button.dataset.review;const note=(document.querySelector(`[data-feedback="${CSS.escape(id)}"]`)?.value||'').trim();if(note.length<5){notify('Write a short feedback note first.');return;}const submission=state.sessionSubmissions.find(x=>x.id===id);let rubricScores=null;if(submission){const ss=state.sessions.find(x=>x.id===submission.sessionId);if(ss){rubricScores=window.GERMAN_CLASSROOM.rubric(ss).map((_,i)=>Number(document.querySelector(`[data-p5-grade="${CSS.escape(id)}|${i}"]`)?.value));if(rubricScores.some(n=>!Number.isInteger(n)||n<1||n>4)){notify('Select a 1–4 score for all three rubric criteria.');return;}}}state.reviews[id]={note,at:new Date().toISOString(),...(rubricScores?{rubricScores}:{})};save();notify('Review saved in this browser.');render();return;}
    if(button.hasAttribute('data-assignment')){state.assigned=button.dataset.assignment==='on';save();notify(state.assigned?'Assignment is visible to the demo learner.':'Demo assignment removed.');render();return;}
    if(button.hasAttribute('data-reset')){if(confirm('Clear learning progress, exam attempts, teacher questions and local demo reviews from this browser?')){state=defaultState();save();window.GermanExamStudio?.reset();resetLessonUI('hello');navigate('home');notify('Demo reset.');}return;}
  }
  root.addEventListener('click',e=>{const summary=e.target.closest?.('[data-chapter-select]');const n=Number(summary?.dataset?.chapterSelect);if(ui.route==='student'&&ui.studentView==='chapters'&&textbookChapters().some(ch=>ch.number===n)&&n!==selectedChapterNumber()){e.preventDefault?.();ui.collapsedChapter=null;navigate('student/chapters/'+n);return;}handleAction(e.target);});
  function handleInput(e){
    const target=e.target;
    if(target.matches?.('[data-p4-voice]')){state.audioSettings.voice=target.value||'';save();return;}
    if(target.matches?.('[data-p4-reflect]')){const [id,nRaw]=target.dataset.p4Reflect.split('|'),n=Number(nRaw),lab=window.GERMAN_AUDIO_LABS?.data[id];if(!lab||!Number.isInteger(n)||n<0||n>=lab.checklist.length)return;const p=state.audioPractice[id]||(state.audioPractice[id]={answers:{},reflection:{}});if(!p.reflection)p.reflection={};p.reflection[n]=!!target.checked;p.reflected=lab.checklist.every((_,i)=>!!p.reflection[i]);save();return;}
    if(target.dataset?.workbookDraft&&target.matches('[data-workbook-draft]')){const [id,kind]=target.dataset.workbookDraft.split(':');if(workbookUnit(id)&&['writing','speaking'].includes(kind)){const p=state.workbookProgress[id]||(state.workbookProgress[id]={answers:{},drafts:{}});if(!p.drafts)p.drafts={};p.drafts[kind]=target.value;save();const send=document.querySelector(`[data-workbook-submit="${id}:${kind}"]`);if(send)send.disabled=target.value.trim().length<10;}return;}
    if(target.matches('[data-draft]')){const id=target.dataset.draft;state.drafts[id]=target.value;save();const submit=document.querySelector('[data-submit-response]');if(submit)submit.disabled=target.value.trim().length<5;}
    if(target.matches('[data-experience-draft]')){const id=target.dataset.experienceDraft;state.experienceDrafts[id]=target.value;save();const submit=document.querySelector('[data-submit-experience]');if(submit)submit.disabled=target.value.trim().length<5;}
    if(target.matches?.('[data-p5-rubric]')&&ui.sessionDraft){const i=Number(target.dataset.p5Rubric);if(i>=0&&i<3){ui.sessionDraft.rubric=window.GERMAN_CLASSROOM.rubric(ui.sessionDraft);ui.sessionDraft.rubric[i]=target.value;}return;}
    if(target.matches('[data-session-field]')&&ui.sessionDraft){ui.sessionDraft[target.dataset.sessionField]=target.dataset.sessionField==='chapterNumber'?(target.value?Number(target.value):null):target.value;}
    if(target.matches('[data-session-block-field]')&&ui.sessionDraft){const [i,field]=target.dataset.sessionBlockField.split(':');const b=ui.sessionDraft.blocks[Number(i)];if(b)b[field]=target.value;}
    if(target.matches('[data-session-answer-index]')&&ui.sessionDraft){const b=ui.sessionDraft.blocks[Number(target.dataset.sessionAnswerIndex)];if(b)b.correct=String(Number(target.value)-1);}
    if(target.matches('[data-session-writing]')){const p=mutableSessionProgress(ui.sessionId);p.drafts[target.dataset.sessionWriting]=target.value;save();const submit=document.querySelector('[data-submit-session-roleplay]');if(submit)submit.disabled=target.value.trim().length<5;}
  }
  root.addEventListener('toggle',event=>{
    const target=event.target;
    if(target?.matches?.('[data-chapter-fold]')){if(Number(target.dataset.chapterFold)===selectedChapterNumber())ui.collapsedChapter=target.open?null:Number(target.dataset.chapterFold);return;}
    if(target?.matches?.('[data-reader-shell]')){ui.readerShellOpen[Number(target.dataset.readerShell)]=target.open;return;}
    if(target?.matches?.('[data-reader-topic]')){ui.readerTopicsOpen[target.dataset.readerTopic]=target.open;return;}
    if(!target?.matches?.('[data-reading-panel]')||ui.route!=='lesson'||ui.stage!=='understand')return;
    const id=currentLesson().id;
    const stored=ui.readingPanels[id]||(ui.readingPanels[id]={});
    stored[target.dataset.readingPanel]=target.open;
  },true);
  root.addEventListener('input',handleInput);
  root.addEventListener('change',handleInput);
  window.addEventListener('hashchange',()=>{render();if(ui.pendingChapterSection){const id=ui.pendingChapterSection;ui.pendingChapterSection=null;scrollToChapterSection(id);}else if(ui.route==='student'&&ui.studentView==='chapters'&&ui.studentChapterNumber){document.getElementById('course-chapter-'+ui.studentChapterNumber)?.scrollIntoView?.({block:'start'});}else window.scrollTo({top:0,behavior:'instant'});});
  window.addEventListener('beforeunload',()=>{if(recordedURL)URL.revokeObjectURL(recordedURL);mediaStream?.getTracks().forEach(t=>t.stop());});
  render();
})();

</script>
</body>
</html>
