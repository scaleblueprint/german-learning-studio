/* Teacher-created learning experiences */
.experience-studio{margin:43px 0 37px}
.experience-intro{margin:0 0 21px;align-items:center}
.experience-intro h2{max-width:720px;margin-top:8px}
.experience-intro> .tag{font-size:11px;padding:10px 14px}
.experience-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:15px}
.experience-flow>div{display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:10px;row-gap:3px;padding:19px;background:#eaece4;border-radius:14px;min-width:0}
.experience-flow b{grid-row:span 2;display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:#dfe6d8;color:#496457;font-size:11px}
.experience-flow strong{font-size:12px}
.experience-flow span{color:var(--muted);font-size:10px;line-height:1.45}
.template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.template-card{min-width:0;padding:24px;border:1px solid #dfdfd5;border-radius:17px;background:var(--paper);box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:11px;align-items:flex-start;transition:transform .2s,border-color .2s,box-shadow .2s}
.template-card:hover,.template-card:focus-visible{transform:translateY(-3px);border-color:#b1c4b1;box-shadow:0 17px 37px #2b413a18}
.template-glyph{display:grid;place-items:center;width:48px;height:48px;background:#e6ece1;border-radius:14px;color:#31594b;font-size:24px}
.template-glyph.small{width:40px;height:40px;font-size:21px;border-radius:12px}
.template-card:nth-child(2) .template-glyph{background:#f2e8d9;color:#a4653e}
.template-card:nth-child(3) .template-glyph{background:#e3e8ea;color:#56757e}
.template-card strong{font-family:Fraunces,Georgia,serif;font-size:23px;font-weight:500}
.template-card>span:not(.template-glyph){font-size:12px;color:var(--ink-soft);line-height:1.6}
.template-card em{margin-top:auto;font-style:normal;font-size:11px;color:var(--copper-dark);font-weight:800}
.experience-work-heading{margin:42px 0 19px}

.experience-shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.experience-shelf-card{min-width:0;padding:20px;display:flex;flex-direction:column;gap:11px}
.experience-shelf-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.experience-shelf-head .tag{white-space:normal;text-align:right;line-height:1.3}
.experience-shelf-card h3{font-size:23px;overflow-wrap:anywhere}
.experience-shelf-card p{font-size:12px;color:var(--ink-soft);line-height:1.6}
.experience-responses{font-size:11px;color:var(--muted);font-weight:700;margin-top:auto}
.experience-shelf-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.experience-shelf-actions .btn{padding:9px 11px}
.mission-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;font-size:9px}
.builder-panel{margin:18px 0 30px;padding:29px;background:#fdfbf5;scroll-margin-top:98px}
.builder-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
.builder-top h3{font-size:28px;margin:8px 0}
.builder-top p{font-size:12px;color:var(--ink-soft);max-width:600px}
.builder-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.75fr);gap:25px}
.builder-fields{display:grid;gap:15px;min-width:0}
.builder-double{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.builder-field{display:flex;flex-direction:column;gap:7px;min-width:0}
.builder-field>span{font-size:11px;font-weight:800;color:var(--ink-soft)}
.builder-field input,.builder-field textarea,.builder-field select{display:block;width:100%;min-width:0;border-radius:10px;border:1px solid #d7dcd2;background:#fff;padding:12px 13px;font-size:13px;color:var(--ink);outline-offset:2px}
.builder-field textarea{resize:vertical;line-height:1.6}
.builder-field input:focus,.builder-field textarea:focus,.builder-field select:focus{border-color:var(--forest)}
.builder-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.builder-aside{align-self:start;background:#e7ede5;border-radius:17px;padding:24px;min-width:0}
.builder-aside-icon{font-size:32px;margin-bottom:15px}
.builder-aside h3{font-size:27px;margin:15px 0 10px}
.builder-aside p{font-size:12px;line-height:1.75;color:#52675b}
.builder-aside ul{padding-left:18px;margin:18px 0;font-size:12px;line-height:1.85;color:#496054}
.builder-aside .study-note{font-size:11px;background:#fafcf8}
.experience-preview{padding:27px;margin-top:16px;background:#fdfcf8}
.experience-preview h3{margin:8px 0 10px}
.experience-preview>p{font-size:13px;color:var(--ink-soft)}
.experience-preview .phrase-panel{margin-bottom:14px}
.experience-preview .stage-foot{margin-top:16px}
.rubric-note{font-size:11px;color:var(--forest);background:#eef3e9;padding:12px;border-radius:8px;line-height:1.6;margin-top:8px}

.learner-sessions{margin:31px 0 27px}

.student-session{max-width:1190px;margin:auto}

.student-session-layout{display:grid;grid-template-columns:minmax(210px,.65fr) minmax(0,1.5fr);gap:17px;align-items:start}

.session-outline-step:hover{background:#f4f5ed}
.session-outline-step>span{flex-shrink:0;display:grid;place-items:center;width:31px;height:31px;background:#e8ecdf;color:var(--forest);border-radius:9px;font-size:11px;font-weight:900}

.session-step-navigation{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.session-choice-grid{display:grid;gap:10px;margin-top:17px}
.session-response-history{display:grid;gap:10px;margin:18px 0}
.session-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:22px 0}
.session-summary-grid>div{padding:17px 13px;border-radius:12px;background:#eaf0e8;display:flex;flex-direction:column;gap:7px;min-width:0}

@media(max-width:1000px){
  .composer-workspace{grid-template-columns:minmax(0,1fr)}
  .composer-palette{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
  .composer-palette>.eyebrow,.composer-palette>h4,.composer-palette>p,.composer-palette-foot{grid-column:1/-1}
  .composer-palette-item{margin:0}
  .student-session-layout{grid-template-columns:minmax(0,1fr)}
  .session-outline{display:flex;flex-direction:row;overflow-x:auto;padding:12px}
  .session-outline>.eyebrow{display:none}
  .session-outline-step{flex:0 0 190px}
}
@media(max-width:760px){
  .session-studio{margin:29px 0}
  .session-studio>.section-intro{align-items:flex-start}
  .session-studio-lead{flex-direction:column;align-items:flex-start;padding:23px}
  .session-studio-lead strong{font-size:23px}
  .session-shelf-grid,.learner-session-grid,.session-preview-steps{grid-template-columns:minmax(0,1fr)}

  .composer-panel{padding:18px 14px;scroll-margin-top:72px}
  .composer-panel-head{flex-wrap:wrap}
  .composer-panel-head h3{font-size:27px}
  .composer-meta-grid{grid-template-columns:minmax(0,1fr);padding:15px}
  .composer-meta-grid>.composer-field:first-child,.composer-meta-grid>.composer-field:nth-child(2){grid-column:auto}
  .composer-palette{grid-template-columns:minmax(0,1fr);padding:18px}
  .composer-block{padding:15px 13px}
  .composer-block-top{flex-wrap:wrap}
  .composer-block-controls{margin-left:auto}
  .composer-actions .btn{flex:1 1 145px}
  .student-session-hero{padding:29px 22px}
  .student-session-hero h1{font-size:clamp(2.1rem,9vw,3rem)}
  .session-activity{padding:20px}
  .session-word-grid{grid-template-columns:minmax(0,1fr)}
  .session-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:410px){

  .learner-session-mark{width:39px;height:39px;font-size:21px}
  .session-studio-lead .btn,.composer-actions .btn{width:100%}
  .session-step-navigation .btn{flex:1 1 100%}
  .session-listen-phrase{flex-direction:column;align-items:flex-start;padding:20px}
}

/* A first-class, self-hosted homepage demo; no third-party player or tracking. */
.walkthrough{margin:34px 0 4px;padding:28px;border:1px solid #dce6dc;border-radius:23px;background:linear-gradient(145deg,#e9f0e8,#f7f6ef);scroll-margin-top:92px}
.walkthrough-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.walkthrough-intro h2{margin:11px 0 9px;font-size:clamp(25px,3vw,37px)}
.walkthrough-intro p{max-width:720px;color:var(--ink-soft);font-size:14px;line-height:1.65}
.walkthrough-duration{white-space:nowrap;padding:10px 13px;border-radius:30px;background:#dae9dc;color:#345d50;font-size:12px;font-weight:800}
.walkthrough-player{overflow:hidden;border-radius:15px;background:#1f302d;box-shadow:0 15px 35px rgba(27,45,37,.16)}
.walkthrough-player video{display:block;width:100%;height:auto;aspect-ratio:16/9;max-height:min(72vh,710px);object-fit:contain;background:#1f302d}
.walkthrough-note{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;color:#687b70;font-size:12px}
.walkthrough-note .view-link{padding:3px 0;font-size:12px}
@media(max-width:760px){
  .walkthrough{padding:17px;margin-top:25px;border-radius:17px}
  .walkthrough-intro{align-items:flex-start;flex-direction:column;gap:10px}
  .walkthrough-duration{font-size:11px}
  .walkthrough-player{border-radius:10px}
}

/* Two clear workspaces. There is no extra overview or second role toggle. */
.simplified-nav{margin-left:auto;margin-right:0;padding:5px;border-radius:999px;background:#e9ece6;gap:2px}
.simplified-nav .nav-btn{padding:12px 19px;border-radius:999px;font-size:13px}
.simplified-nav .nav-btn.active{background:var(--ink);color:#fff;box-shadow:0 3px 9px #26302f1a}
.workspace-hint{color:#74837a;font-size:11px;font-weight:700;white-space:nowrap}
.workspace-shortcuts{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0}
.workspace-shortcuts .btn{white-space:nowrap}
.simplified-mobile-nav button{flex:1;font-size:11px}
@media(max-width:960px){.workspace-hint{display:none}}
@media(max-width:760px){
  .workspace-shortcuts{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .dash-header{flex-direction:column}
  .simplified-mobile-nav button{min-width:0;padding:9px 14px}
}
@media(max-width:440px){
  .workspace-shortcuts .tag{width:100%;max-width:max-content}
  .workspace-shortcuts .btn{white-space:normal}
}

/* Match the whole visible phone viewport, including the fixed bottom navigation. */
@media(max-width:760px){
  html,body{width:100%;max-width:100%;min-width:0}
  #app{display:block;width:100vw;max-width:100vw;min-width:0}
  .top-notice,.site-header,.page,.footer{width:100%;max-width:100%;min-width:0}
  .shell{width:100%;max-width:100%;min-width:0}
  .dash-grid,.learning-panel,.card{min-width:0}
  .learning-panel{width:100%;max-width:100%}
  .learning-panel .tag{display:inline-flex;max-width:100%;white-space:normal;line-height:1.4}
  .learning-panel h2{font-size:clamp(27px,8vw,34px);overflow-wrap:break-word}
}

/* Student home. Progress is earned; amber denotes the next useful action. */

.learning-panel:after {content:"";position:absolute;width:290px;height:290px;right:-105px;top:-95px;bottom:auto;border-radius:50%;border:55px solid rgba(255,198,106,.16);font-size:0;z-index:-1}
.learning-panel:before {content:"";position:absolute;width:90px;height:90px;right:100px;bottom:-38px;background:#f68d5c;transform:rotate(-22deg);border-radius:24px;opacity:.34;z-index:-1}
.learning-panel h2 {font-size:clamp(29px,3.3vw,44px);letter-spacing:-.04em;max-width:520px}
.learning-panel p {color:#f6e7ec;font-size:13px}

.learning-panel .progress-shell {height:12px;background:rgba(255,255,255,.24);margin-top:24px}
.learning-panel .progress-fill {background:linear-gradient(90deg,#ffe09b,var(--amber))}
.minor-progress {font-size:12px;color:#f8eaf0;font-weight:700}
.learning-panel .btn-white {background:var(--amber);color:#3c2630}
.learning-panel .btn-white:hover {background:#ffe0a0}
.milestone-heading {font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.12em;color:#f3dfdf;margin:24px 0 10px}
.milestone-track {display:flex;justify-content:space-between;gap:9px;align-items:center;position:relative;max-width:430px;margin-bottom:6px}

.milestone {z-index:1;flex:0 0 35px;width:35px;height:35px;border-radius:50%;border:2px solid #e4b8b5;background:#653147;color:#fff1eb;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(90,42,60,.25);transition:transform .18s,background .18s}
.milestone.done {background:#148260;border-color:#c1f2dd;color:#fff}
.milestone.current {background:var(--amber);border-color:#ffe8bc;color:#482536;box-shadow:0 0 0 4px rgba(255,198,106,.22)}
.milestone:hover {transform:translateY(-3px)}
.milestone:focus-visible {outline-color:#fff}
.next-dot {background:#fff1df;color:var(--plum-dark)}
.next-item {transition:border-color .18s}
.next-item:hover {border-color:#d9a899}
.progress-fill {background:var(--coral)}
.skill:nth-child(2) .progress-fill {background:#e9a638}
.skill:nth-child(3) .progress-fill {background:#158b70}
.skill:nth-child(4) .progress-fill {background:#8f5066}
.skill strong,.stat strong,.teacher-stat strong {font-family:'Space Grotesk',sans-serif;font-weight:700}
.stat-icon {background:#fff0df}
.lesson-card {border-top:5px solid #d77e3e;background:#fff}
.lesson-card:nth-child(4n+2) {border-top-color:#cf5b53}
.lesson-card:nth-child(4n+3) {border-top-color:#7b3d57}
.lesson-card:nth-child(4n) {border-top-color:#1b9376}
.lesson-card:hover {box-shadow:0 22px 42px rgba(94,53,63,.12)}
.lesson-number {color:#96796c}
.mini-phrase {color:#b34d35}
.quick-path {background:#fff;border-color:var(--line);border-top:5px solid #d77e3e}
.quick-path:nth-child(2) {border-top-color:#cd5c58}
.quick-path:hover {border-color:#ce986f}
.quick-path strong {font-family:'Space Grotesk',sans-serif;font-weight:700}
.quick-path small {color:var(--plum)}
.exam-home-card {position:relative;overflow:hidden;background:linear-gradient(112deg,#c15a39,#a84350);box-shadow:0 20px 45px rgba(184,72,69,.16)}
.exam-home-card:after {content:"";position:absolute;width:145px;height:145px;border:24px solid #ffffff26;border-radius:50%;right:25%;top:-120px;pointer-events:none}
.exam-home-card .eyebrow {color:#ffdf9d}

.walkthrough {background:linear-gradient(135deg,#fff0e1,#f6e8ed);border-color:#eed8cd}
.walkthrough-duration {background:#ffe1c2;color:#713b3d}
.walkthrough-player,.walkthrough-player video {background:#271e26}
.walkthrough-note {color:#82646c}

/* Lessons, assignments and hands-on work. */

.speech {background:#fff0e3}
.speech:nth-child(even) {background:#f5e5e7}
.speech span {color:#8a6872}
.tip,.study-note {background:#fff4e8;border-color:#efd9c7}
.choice {border-color:#ebd9d4}

.choice:hover {border-color:#cd9487;background:#fff5ed}
.choice.selected {border-color:var(--plum);background:#fae8e8}
.choice.selected:before {background:var(--plum);border-color:var(--plum);box-shadow:inset 0 0 0 4px #fae8e8}
.choice.correct,.finish-panel,.status-success {background:#e2f4e9}

.mission-banner p,.student-session-hero p {color:var(--ink-soft)}

.stage-tab.active,.session-outline-step.active {background:var(--plum);color:#fff}
.session-outline-step.active small {color:#f6e7ec}

.course-sidebar,.phrase-panel,.task-card,.teacher-prompt,.assignment-strip {background:#fff0e3}
.feature.green {background:#642b42}
.feature.cream {background:#fff0d9}
.mission-icon,.template-glyph,.composer-block-symbol {background:#ffeddb;color:#7d3c49}
.template-card {background:#fff;border-color:var(--line);border-top:4px solid #d47f3b}
.template-card:nth-child(2) {border-top-color:#cf5b53}
.template-card:nth-child(3) {border-top-color:#7e4056}
.template-card:hover {border-color:#da9c75;box-shadow:0 18px 35px rgba(95,53,65,.12)}
.template-card strong {font-family:'Space Grotesk',sans-serif;font-weight:700}
.template-card:nth-child(2) .template-glyph {background:#ffe8df;color:#a94342}
.template-card:nth-child(3) .template-glyph {background:#f5e2ed;color:#743d54}
.experience-flow>div {background:#fff0e5}
.experience-flow b {background:#ffdfc5;color:#75384b}

/* Teacher Studio: creative tools and readable data. */
.teacher-stat {border-top:4px solid #ce843d}

.session-studio-lead span {color:#ffcc81}
.session-studio-lead strong {font-family:'Space Grotesk',sans-serif;font-weight:700}
.session-studio-lead p {color:#f9e7ef}

.composer-meta-grid,.composer-palette,.exam-builder {background:#fff1e8;border-color:#ead9ce}
.composer-field {color:var(--ink-soft)}
.composer-block {background:#fff}
.composer-palette>p,.composer-palette-foot,.composer-note {color:var(--ink-soft)}
.composer-palette-item {background:#fff;border-color:#eddad1}
.composer-palette-item>span {background:#ffebd8;color:var(--plum)}
.composer-palette-item>b {color:var(--plum)}
.composer-palette-item:hover {border-color:#c88a77}
.mini-action {background:#fff2e9;border-color:#eadad4;color:var(--plum)}

/* Exam preparation: strong selected states and readable practice content. */
.exam-hero {background:linear-gradient(112deg,#ffedda 0%,#f7e2e3 100%)}
.exam-hero p {color:var(--ink-soft)}
.exam-hero-symbol {color:#dca588}
.exam-provider,.exam-level {background:#fffaf6}
.exam-provider strong {font-family:'Space Grotesk',sans-serif;font-weight:700}
.exam-provider.active {border-color:#9e4a4e;background:#fae7e6;box-shadow:inset 0 0 0 1px #9e4a4e}

.exam-level.active {background:var(--plum);border-color:var(--plum)}
.exam-level.active small {color:#f8e7ef}
.exam-main-cta {background:linear-gradient(116deg,#4d2d42,#994c57);box-shadow:0 18px 42px rgba(96,45,65,.15)}
.exam-main-cta .eyebrow {color:#ffcd80}
.exam-main-cta p,.exam-cta-meta {color:#f8e6ed}
.exam-skill-icon {background:#ffe6d5;color:#853f44}
.exam-skill:nth-child(2) .exam-skill-icon {background:#ffeadf;color:#ab4740}
.exam-skill:nth-child(3) .exam-skill-icon {background:#fff0c9;color:#815927}

/* Netzwerk A1 book-aligned reference: visibly separate from the playable demo lessons. */

<script>
(() => {
  'use strict';
  const data = window.GERMAN_EXAM_DATA;
  if (!data) return;
  const key = 'ambertheory-german-exams-v1';
  const limitMs = 18 * 60 * 1000; // Short independent mock; NOT the official examination time.
  const blank = () => ({provider:'goethe',level:'A1',active:null,attempts:[],reviews:{},customQuestions:[]});
  const stored = (() => {try {return JSON.parse(localStorage.getItem(key));} catch {return null;}})();
  let state = {...blank(),...(stored && typeof stored === 'object' ? stored : {})};
  if (!data.tracks[state.provider]) state.provider = 'goethe';
  if (!Array.isArray(state.attempts)) state.attempts = [];
  if (!Array.isArray(state.customQuestions)) state.customQuestions = [];
  if (!state.reviews || typeof state.reviews !== 'object') state.reviews = {};
  let page = 'home';
  let viewedResult = null;
  let editItem = null;
  let builderOpen = false;
  const esc = value => String(value ?? '').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const save = () => {try {localStorage.setItem(key,JSON.stringify(state));} catch {message('Storage unavailable: this attempt may not be saved.');}};
  const track = () => data.tracks[state.provider];
  const formatTime = milliseconds => {const n=Math.max(0,Math.ceil(milliseconds/1000));return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;};
  const elapsed = attempt => attempt.elapsedMs + (attempt.paused ? 0 : Math.max(0,Date.now()-attempt.resumedAt));
  const remaining = attempt => Math.max(0,limitMs-elapsed(attempt));
  const questionItems = (provider,skill) => {
    const base=data.tracks[provider];
    const approved=state.customQuestions.filter(q=>q.provider===provider&&q.level==='A1'&&q.status==='published');
    const choices=[...base.questions,...approved].filter(q=>skill==='all'||q.skill===skill).map(q=>({...q,type:'choice'}));
    const written=['writing','speaking'].filter(s=>skill==='all'||skill===s).map(s=>({...base[s],skill:s,type:'written'}));
    return [...choices,...written];
  };
  const totalCorrect = attempt => attempt.items.filter(q=>q.type==='choice'&&attempt.answers[q.id]===q.answer).length;
  const totalAuto = attempt => attempt.items.filter(q=>q.type==='choice').length;
  const countAnswered = attempt => attempt.items.filter(q=>q.type==='choice'?Number.isInteger(attempt.answers[q.id]):Boolean((attempt.texts[q.id]||'').trim())).length;
  const skillLabel = id => data.skills.find(s=>s.id===id)?.name||id;
  function message(text){const el=document.getElementById('toast');if(el){el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3800);}}
  function refresh(){const learner=document.getElementById('exam-root'),teacher=document.getElementById('exam-teacher-root');if(learner)learner.innerHTML=renderLearner();if(teacher)teacher.innerHTML=renderTeacher();}
  function start(mode,skill){
    if(state.active && !confirm('Replace your unfinished practice? Your completed attempts will be kept.'))return;
    const items=questionItems(state.provider,skill);
    if(!items.length){message('No reviewed questions available for this skill yet.');return;}
    state.active={id:`exam-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,provider:state.provider,level:'A1',mode,skill,items,answers:{},texts:{},index:0,startedAt:Date.now(),resumedAt:Date.now(),elapsedMs:0,paused:false};
    page='attempt';save();refresh();window.scrollTo({top:0,behavior:'instant'});
  }
  function submit(expired=false){
    const attempt=state.active;if(!attempt)return;
    if(!expired && countAnswered(attempt)<attempt.items.length && !confirm('Some tasks are unanswered. Finish and review your attempt anyway?'))return;
    attempt.elapsedMs=attempt.mode==='mock'?Math.min(limitMs,elapsed(attempt)):0;
    attempt.paused=true;attempt.completedAt=Date.now();attempt.timedOut=expired;
    state.attempts.unshift(attempt);state.attempts=state.attempts.slice(0,30);state.active=null;
    viewedResult=attempt.id;page='result';save();refresh();window.scrollTo({top:0,behavior:'instant'});
  }
  function resume(){if(!state.active)return;state.active.resumedAt=Date.now();state.active.paused=false;save();}
  function pause(){if(!state.active)return;state.active.elapsedMs=elapsed(state.active);state.active.paused=true;save();}
  function readResult(){return state.attempts.find(a=>a.id===viewedResult)||state.attempts[0];}
  function renderLearner(){
    if(page==='attempt' && state.active)return renderAttempt();
    if(page==='result' && readResult())return renderResult(readResult());
    const recent=state.attempts.slice(0,5),active=state.active;
    return `<div class="exam-page">
      <button class="view-link" data-route="student">← Back to Learning</button>
      <section class="exam-hero"><div><span class="eyebrow">Exam preparation · First Steps</span><h1>Practise for the moment that matters.</h1><p>Build confidence in listening, reading, writing and speaking. Choose an exam, practise one skill or try an original A1 mini-mock.</p></div><span class="exam-hero-symbol" aria-hidden="true">✦</span></section>
      <section class="exam-track-panel card"><div class="exam-panel-heading"><div><span class="eyebrow">Choose your exam</span><h2>One goal. Your preparation path.</h2></div><span class="tag tag-warm">Original demo practice · Teacher review needed</span></div>
        <div class="exam-provider-tabs" role="group" aria-label="Exam provider">${Object.entries(data.tracks).map(([id,x])=>`<button class="exam-provider ${state.provider===id?'active':''}" data-exam-action="provider" data-value="${id}" aria-pressed="${state.provider===id}"><strong>${id==='goethe'?'Goethe-Institut':'telc'}</strong><small>${esc(x.subtitle)}</small></button>`).join('')}</div>
        <div class="exam-levels" role="group" aria-label="Language level">${data.levels.map(l=>`<button class="exam-level ${l.available?'active':'planned'}" data-exam-action="level" data-value="${l.id}" ${l.available?'aria-pressed="true"':'disabled aria-disabled="true"'} title="${l.available?'A1 practice available':'Practice content not yet validated'}"><strong>${l.id}</strong><small>${esc(l.available?'Beginner practice':l.name+' · Planned')}</small></button>`).join('')}</div>
        <p class="exam-track-caption"><b>${esc(track().title)}.</b> A1 is the official beginner level. Other levels appear for orientation but are not available until content has been created and reviewed.</p>
      </section>
      ${active?`<div class="exam-resume card"><div><span class="eyebrow">Unfinished attempt</span><h3>${active.mode==='mock'?'A1 mini-mock':skillLabel(active.skill)+' practice'} · ${active.provider==='goethe'?'Goethe':'telc'}</h3><p>${countAnswered(active)} of ${active.items.length} tasks answered${active.mode==='mock'?` · ${formatTime(remaining(active))} remaining`:''}</p></div><button class="btn btn-primary" data-exam-action="resume">Resume →</button></div>`:''}
      <section class="exam-main-cta"><div><span class="eyebrow">Full practice journey</span><h2>Try the A1 mini-mock</h2><p>A shortened practice across all four skills. Multiple-choice questions are automatically checked; writing and speaking notes can be reviewed by your teacher. The 18-minute timer is for this demo only.</p><div class="exam-cta-meta"><span>◷ 18 min</span><span>▤ ${questionItems(state.provider,'all').length} tasks</span><span>✓ Retake and review</span></div></div><button class="btn btn-white" data-exam-action="start" data-mode="mock" data-skill="all">Start mini-mock →</button></section>
      <section class="exam-section"><div class="section-intro"><div><span class="eyebrow">Practise by skill</span><h2>Take one step at a time.</h2><p>Target the part you want to strengthen, without a timer.</p></div></div><div class="exam-skills">${data.skills.map(s=>`<article class="card exam-skill"><span class="exam-skill-icon">${s.icon}</span><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><button class="view-link" data-exam-action="start" data-mode="practice" data-skill="${s.id}">Practise ${esc(s.name.toLowerCase())} →</button></article>`).join('')}</div></section>
      <div class="exam-two-col"><section class="card exam-advice"><span class="eyebrow">Preparation tips · ${state.provider==='goethe'?'Goethe':'telc'}</span><h2>Small habits, calmer exams.</h2><ol>${track().tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><a href="${track().official}" target="_blank" rel="noopener noreferrer">Official ${state.provider==='goethe'?'Goethe':'telc'} preparation resources ↗</a></section>
      <section class="card exam-history"><span class="eyebrow">Your attempt history</span><h2>See your progress.</h2>${recent.length?recent.map(a=>`<div class="exam-history-item"><div><strong>${a.provider==='goethe'?'Goethe':'telc'} · ${a.mode==='mock'?'Mini-mock':skillLabel(a.skill)}</strong><small>${new Date(a.completedAt).toLocaleDateString()} · ${totalCorrect(a)}/${totalAuto(a)} automatically checked</small></div><button class="view-link" data-exam-action="result" data-value="${esc(a.id)}">Review →</button></div>`).join(''):'<p>No attempts yet. Complete a skill practice or mini-mock to see your results here.</p>'}<p class="exam-footnote">Results stay in this browser. They are practice indicators, not official exam grades.</p></section></div></div>`;
  }
  function renderAttempt(){
    const a=state.active,i=Math.min(a.index,a.items.length-1),q=a.items[i];
    return `<div class="exam-page"><div class="exam-attempt-top"><button class="view-link" data-exam-action="home">← Exam Preparation</button><span class="tag tag-warm">${a.provider==='goethe'?'Goethe':'telc'} · A1 ${a.mode==='mock'?'mini-mock':'practice'}</span></div>
    <section class="exam-attempt-head"><div><span class="eyebrow">${a.mode==='mock'?'Timed mini-mock':'Untimed skill practice'} · ${skillLabel(q.skill)}</span><h1>Task ${i+1} of ${a.items.length}</h1><p>${countAnswered(a)} answered · Your answers are saved in this browser.</p></div>${a.mode==='mock'?`<div class="exam-timer"><span>Time remaining</span><strong data-exam-timer>${formatTime(remaining(a))}</strong><button data-exam-action="${a.paused?'unpause':'pause'}" class="btn btn-outline btn-small">${a.paused?'Resume timer':'Pause timer'}</button></div>`:''}</section>
    <div class="exam-step-track">${a.items.map((item,j)=>`<button class="exam-step ${j===i?'active':''} ${item.type==='choice'?Number.isInteger(a.answers[item.id])?'answered':'':(a.texts[item.id]||'').trim()?'answered':''}" data-exam-action="jump" data-value="${j}" aria-label="Go to task ${j+1}: ${skillLabel(item.skill)}" ${a.paused?'disabled':''}>${j+1}</button>`).join('')}</div>
    ${a.paused?`<section class="card exam-paused"><h2>Practice paused</h2><p>Your work is safe in this browser. Resume when you are ready.</p><button class="btn btn-primary" data-exam-action="unpause">Resume attempt →</button></section>`:
    `<article class="card exam-question"><span class="eyebrow">${skillLabel(q.skill)} · ${q.type==='choice'?'Choose one answer':'Teacher-reviewed task'}</span><h2>${q.type==='written'?esc(q.title):esc(q.context)}</h2>
      ${q.type==='choice'?`${q.skill==='listening'?`<div class="exam-audio"><span class="exam-skill-icon">♫</span><div><strong>Listen to the short German message</strong><small>Browser-generated German speech · Repeat as needed</small></div><button class="btn btn-primary btn-small" data-exam-action="speak" data-value="${esc(q.id)}">▶ Play German</button></div>`:`<div class="exam-passage" lang="de">${esc(q.passage)}</div>`}<p class="exam-prompt">${esc(q.question)}</p><div class="exam-choices" role="group" aria-label="Choose one answer">${q.options.map((option,n)=>`<button class="exam-choice ${a.answers[q.id]===n?'selected':''}" data-exam-action="answer" data-value="${n}" aria-pressed="${a.answers[q.id]===n}"><span>${String.fromCharCode(65+n)}</span>${esc(option)}</button>`).join('')}</div>`:
      `<p class="exam-prompt">${esc(q.prompt)}</p><div class="study-note">${esc(q.guidance)}</div><label class="form-field" for="exam-written-response">${q.skill==='speaking'?'Notes from your spoken rehearsal':'Your German response'}</label><textarea id="exam-written-response" class="text-entry exam-written" data-exam-text="${esc(q.id)}" maxlength="1500" placeholder="Schreiben Sie auf Deutsch …">${esc(a.texts[q.id]||'')}</textarea><p class="exam-footnote">${q.skill==='speaking'?'Speak aloud first. Audio is not recorded, uploaded or automatically assessed.':'Your answer will be visible to the demo teacher in this browser for qualitative review.'}</p>`}

  }
  function renderResult(a){

    const reviews=state.reviews[a.id]||{};
    const breakdown=['listening','reading'].map(skill=>{const tasks=a.items.filter(q=>q.type==='choice'&&q.skill===skill);const got=tasks.filter(q=>a.answers[q.id]===q.answer).length;return tasks.length?`<div><strong>${got}/${tasks.length}</strong><span>${skillLabel(skill)} · automatically checked</span></div>`:''}).join('');
    return `<div class="exam-page"><button class="view-link" data-exam-action="home">← Exam Preparation</button><section class="exam-result-hero"><span class="eyebrow">Practice complete · ${a.provider==='goethe'?'Goethe':'telc'} A1</span><h1>${a.timedOut?'Time is up — review what you tried.':'Good effort. Now learn from it.'}</h1><p>This shortened mock is independently authored. Only multiple-choice items receive automatic checking; no pass/fail or official score is calculated.</p><div class="exam-result-number"><strong>${auto?`${correct}/${auto}`:'✓'}</strong><span>${auto?'Objective questions correct':'Practice response saved'}</span></div></section>
      <div class="exam-result-grid">${breakdown||'<div><strong>Teacher review</strong><span>This practice has no auto-scored tasks.</span></div>'}<div><strong>${written.length}</strong><span>Responses submitted for teacher review</span></div></div>

  function renderBuilder(){

  }
  function saveItem(status){
    const form=document.querySelector('[data-exam-builder]');if(!form)return;
    const field=name=>form.querySelector(`[name="${name}"]`)?.value.trim()||'';
    const options=[0,1,2].map(i=>field(`option${i}`));const source=field('source');
    if(!field('context')||source.length<8||field('question').length<8||options.some(x=>x.length<2)||field('explanation').length<8){message('Complete the scenario, German source, question, all choices and explanation.');return;}
    const previous=state.customQuestions.find(q=>q.id===editItem);
    const skill=field('skill');const entry={id:previous?.id||`teacher-question-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,level:'A1',provider:field('provider'),skill,context:field('context'),audio:skill==='listening'?source:undefined,passage:skill==='reading'?source:undefined,question:field('question'),options,answer:Number(field('answer')),explanation:field('explanation'),status};
    state.customQuestions=previous?state.customQuestions.map(q=>q.id===previous.id?entry:q):[entry,...state.customQuestions];

  }
  function speakQuestion(id){
    const q=state.active?.items.find(x=>x.id===id);if(!q?.audio)return;

    window.speechSynthesis.cancel();window.speechSynthesis.speak(utterance);

  function act(button){
    const type=button.dataset.examAction,value=button.dataset.value,a=state.active;
    if(type==='provider'){state.provider=value;page='home';save();refresh();return;}
    if(type==='level'){message(value==='A1'?'A1 practice is ready.':'That level is planned; no unverified exercises are shown.');return;}
    if(type==='start'){start(button.dataset.mode,button.dataset.skill);return;}
    if(type==='resume'){page='attempt';refresh();window.scrollTo({top:0,behavior:'instant'});return;}
    if(type==='home'){page='home';refresh();window.scrollTo({top:0,behavior:'instant'});return;}
    if(type==='result'){viewedResult=value;page='result';refresh();window.scrollTo({top:0,behavior:'instant'});return;}
    if(type==='new-item'){builderOpen=true;editItem=null;refresh();return;}

    if(type==='close-builder'){builderOpen=false;editItem=null;refresh();return;}
    if(type==='save-item'){saveItem(button.dataset.status);return;}
    if(type==='toggle-item'){const q=state.customQuestions.find(x=>x.id===value);if(q){q.status=q.status==='published'?'draft':'published';save();refresh();}return;}
    if(type==='save-review'){
      const id=button.dataset.attempt,item=button.dataset.item,compound=`${id}:${item}`;
      const note=document.querySelector(`[data-exam-feedback="${compound}"]`)?.value.trim();
      const rating=Number(document.querySelector(`[data-exam-rating="${compound}"]`)?.value);
      if(!note||note.length<8){message('Give at least one useful strength or next step.');return;}
      state.reviews[id]??={};state.reviews[id][item]={note,rating,reviewedAt:Date.now()};save();refresh();message('Practice feedback saved in this browser.');return;
    }
    if(!a)return;
    if(type==='speak'){speakQuestion(value);return;}
    if(type==='pause'){pause();refresh();return;}
    if(type==='unpause'){resume();refresh();return;}
    if(type==='submit'){submit();return;}
    if(a.paused)return;
    if(type==='jump'){a.index=Math.min(a.items.length-1,Math.max(0,Number(value)||0));save();refresh();return;}
    if(type==='answer'){const q=a.items[a.index];if(q?.type==='choice'){a.answers[q.id]=Number(value);save();refresh();}return;}
  }
  document.addEventListener('click',e=>{const button=e.target.closest?.('button[data-exam-action]');if(button && !button.disabled)act(button);});
  document.addEventListener('input',e=>{const id=e.target.dataset?.examText;if(id && state.active && !state.active.paused){state.active.texts[id]=e.target.value;save();}});
  setInterval(()=>{const a=state.active;if(!a||a.paused||a.mode!=='mock')return;if(remaining(a)<=0){submit(true);message('Mini-mock time has ended. Your answers were saved.');return;}const timer=document.querySelector('[data-exam-timer]');if(timer)timer.textContent=formatTime(remaining(a));},1000);
  function reset(){state=blank();page='home';viewedResult=null;editItem=null;builderOpen=false;save();}
  window.GermanExamStudio={renderLearner,renderTeacher,reset};
})();

  if(!Array.isArray(state.workbookSubmissions))state.workbookSubmissions=[];

rsation.</h2></div><button class=\"btn btn-primary\" data-route=\"student\">Open Student Studio →</button></section>\n</div>";}

  function workbookUnit(id){
  const chapters=window.GERMAN_WORKBOOK?.chapters||[];
  const key=String(id);
  if(/^review-(3|6)$/.test(key)){
    const end=Number(key.split('-')[1]);
    const included=chapters.filter(c=>c.number>end-3&&c.number<=end);
    if(included.length!==3)return null;
    return {id:key,title:`Plattform ${end===3?'1':'2'} · Revision`,number:end,review:true,writing:`Write a six-sentence message using topics from Chapters ${end-2}–${end}: explain a practical situation and ask a question.`,speaking:`Rehearse a short conversation combining themes from Chapters ${end-2}–${end}. Write brief rehearsal notes for your teacher.`,support:included.map(c=>c.title).join(' · '),questions:included.flatMap(c=>[0,2,5].map(i=>({...c.questions[i],id:`${key}-${c.number}-${i}`})))};
  }
  const c=chapters.find(x=>String(x.number)===key);
  return c?{...c,id:key,questions:c.questions.map((q,i)=>({...q,id:`a11-${c.number}-q${i+1}`}))}:null;
}

function workbookResult(id){
  const unit=workbookUnit(id);
  const progress=state.workbookProgress?.[id]||{answers:{},drafts:{}};
  const correct=unit?unit.questions.filter(q=>progress.answers?.[q.id]?.correct).length:0;
  const answered=unit?unit.questions.filter(q=>progress.answers?.[q.id]).length:0;
  return {unit,progress,correct,answered,total:unit?.questions.length||0};
}

function renderWorkbook(){

  <section class="card workbook-check" aria-label="Interactive workbook questions"><div class="workbook-check-top"><span class="eyebrow">Listening · Reading · Grammar · Vocabulary</span><span>${i+1} of ${r.total}</span></div><div class="workbook-pips">${unit.questions.map((item,n)=>`<button class="workbook-pip ${n===i?'active':''} ${r.progress.answers?.[item.id]?'answered':''}" data-workbook-jump="${n}" aria-label="Question ${n+1}${r.progress.answers?.[item.id]?', answered':''}" aria-current="${n===i?'step':'false'}">${n+1}</button>`).join('')}</div><div class="workbook-question-label">${escape(q.skill)}</div>${q.audio?`<div class="workbook-audio"><p>Listen first. The transcript appears after checking.</p><button type="button" class="btn btn-outline btn-small" data-speak="${escape(q.audio)}" aria-label="Play German listening question">♫ Play German</button></div>`:''}${q.reading?`<blockquote class="workbook-reading" lang="de">${escape(q.reading)}</blockquote>`:''}<h2>${escape(q.prompt)}</h2><div class="choice-list">${q.options.map((option,n)=>`<button class="choice ${selected===n?'selected':''} ${answer&&n===q.correct?'correct':''} ${answer&&n===answer.chosen&&!answer.correct?'incorrect':''}" data-workbook-choice="${n}" ${answer?'disabled':''}>${escape(option)}</button>`).join('')}</div>${answer?`<div class="feedback ${answer.correct?'':'error'}"><b>${answer.correct?'Correct!':'Not quite.'}</b> ${escape(q.why)}${q.audio?`<p>Spoken text: <span lang="de">${escape(q.audio)}</span></p>`:''}</div><button class="view-link" data-workbook-retry="${escape(q.id)}">Retry this question</button>`:''}<div class="stage-foot"><button class="btn btn-outline" data-workbook-prev ${i===0?'disabled':''}>← Previous</button>${answer?`<button class="btn btn-primary" data-workbook-next ${i===r.total-1?'disabled':''}>Next question →</button>`:`<button class="btn btn-primary" data-workbook-check ${selected===null?'disabled':''}>Check answer</button>`}</div>${r.answered===r.total?`<div class="status-success">✓ Checkpoint complete: ${r.correct}/${r.total} correct. You can retry individual questions and practise the written and spoken tasks below.</div>`:''}</section>
  <section class="workbook-response-grid" aria-label="Production practice">${response('writing','Writing',unit.writing)}${response('speaking','Speaking',unit.speaking)}</section><section class="card card-pad workbook-feedback"><h3>Teacher feedback on this practice</h3>${related.length?related.map(s=>`<div class="queue-item"><strong>${s.kind==='speaking'?'Speaking rehearsal notes':'Writing response'}</strong><blockquote>${escape(s.text)}</blockquote>${state.reviews[s.id]?`<div class="feedback"><b>Teacher response:</b> ${escape(state.reviews[s.id].note)}</div>`:'<p>Awaiting feedback in the Teacher Studio on this device.</p>'}</div>`).join(''):'<p>Submit a response above to request teacher feedback.</p>'}</section><p class="workbook-disclaimer">Original AmberTheory material. Synthetic German voice depends on your browser. Not an official textbook exercise or language assessment; teacher review is pending.</p></div>`;

  function sessionBlock(type){

      roleplay:{title:'Have a conversation',prompt:'Imagine a short everyday encounter. Write two lines of dialogue in German.',starter:'Guten Tag! Ich hätte gern ...',criteria:'Use a greeting, a polite request and a thank-you.'},
      assessment:{title:'Final knowledge check',question:'Which German expression is polite?',options:'Ein Wasser, bitte.\nGute Nacht!\nNein.',correct:'0',explanation:'Bitte makes the request polite.'}

  function incompleteSessionBlock(session){

        const pick=(skill)=>questions.find(q=>q.skill===skill)||questions[0];
        const checker=(type,q,title)=>({...sessionBlock(type),title,question:q?.prompt||'',options:(q?.options||[]).join('\n'),correct:String(q?.correct??0),explanation:q?.why||''});

  function speak(text){if(!('speechSynthesis' in window)){notify('Audio pronunciation is unavailable in this browser.');return;}const utterance=new SpeechSynthesisUtterance(text);utterance.lang='de-DE';utterance.rate=.83;const germanVoice=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('de'));if(germanVoice)utterance.voice=germanVoice;window.speechSynthesis.cancel();window.speechSynthesis.speak(utterance);}
  async function toggleRecording(){

    if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){notify('Microphone recording is unavailable here.');return;}
    try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];mediaRecorder=new MediaRecorder(mediaStream);mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};mediaRecorder.onstop=()=>{if(recordedURL)URL.revokeObjectURL(recordedURL);recordedURL=URL.createObjectURL(new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'}));mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;render();};mediaRecorder.start();recording=true;render();notify('Recording locally — click stop when ready.');}catch{notify('Microphone access was declined or unavailable.');}
  }

    if(button.hasAttribute('data-submit-session-roleplay')){const s=state.sessions.find(x=>x.id===ui.sessionId),b=s?.blocks[ui.sessionBlockIndex];if(!b||b.id!==button.dataset.submitSessionRoleplay)return;const p=mutableSessionProgress(s.id),draft=(p.drafts[b.id]||'').trim();if(draft.length<5){notify('Write your conversation before sending.');return;}state.sessionSubmissions.unshift({id:`session-work-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,sessionId:s.id,blockId:b.id,text:draft});p.drafts[b.id]='';if(!p.completed.includes(b.id))p.completed.push(b.id);save();render();notify('Conversation sent to the demo teacher queue.');return;}
    if(button.hasAttribute('data-open-builder')){ui.builderKind=button.dataset.openBuilder;ui.editingExperienceId=null;ui.previewExperienceId=null;ui.builderOpen=true;render();document.getElementById('experience-builder')?.scrollIntoView?.({behavior:'smooth',block:'start'});return;}
    if(button.hasAttribute('data-edit-experience')){const x=state.experiences.find(e=>e.id===button.dataset.editExperience);if(!x)return;ui.builderKind=x.kind;ui.editingExperienceId=x.id;ui.previewExperienceId=null;ui.builderOpen=true;render();document.getElementById('experience-builder')?.scrollIntoView?.({behavior:'smooth',block:'start'});return;}
    if(button.hasAttribute('data-close-builder')){ui.builderOpen=false;ui.editingExperienceId=null;render();return;}
    if(button.hasAttribute('data-preview-experience')){ui.builderOpen=false;ui.previewExperienceId=ui.previewExperienceId===button.dataset.previewExperience?null:button.dataset.previewExperience;render();return;}
    if(button.hasAttribute('data-close-preview')){ui.previewExperienceId=null;render();return;}
    if(button.hasAttribute('data-publish-experience')){const x=state.experiences.find(e=>e.id===button.dataset.publishExperience);if(!x)return;x.status=x.status==='published'?'draft':'published';save();notify(x.status==='published'?'Mission assigned to the demo learner.':'Mission moved to drafts.');render();return;}
    if(button.hasAttribute('data-save-experience')){
      const field=name=>(document.querySelector(`[data-builder-field="${name}"]`)?.value||'').trim();
      const title=field('title'),goal=field('goal'),prompt=field('prompt'),example=field('example'),criteria=field('criteria');
      if(title.length<4||goal.length<8||prompt.length<15||example.length<5||criteria.length<10){notify('Add a clear title, goal, instructions, example and success criteria.');return;}
      const old=state.experiences.find(x=>x.id===ui.editingExperienceId);const id=old?.id||`exp-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
      const entry={id,kind:old?.kind||ui.builderKind,title,goal,prompt,example,criteria,level:['A1','A2'].includes(field('level'))?field('level'):'A1',duration:field('duration')||'10',status:button.dataset.saveExperience==='publish'?'published':'draft',sample:old?.sample||false};
      state.experiences=old?state.experiences.map(x=>x.id===id?entry:x):[entry,...state.experiences];save();ui.builderOpen=false;ui.editingExperienceId=null;ui.previewExperienceId=id;render();notify(entry.status==='published'?'New mission assigned to the demo learner.':'Experience saved as a draft.');return;
    }
    if(button.hasAttribute('data-submit-experience')){const id=button.dataset.submitExperience;const x=state.experiences.find(e=>e.id===id&&e.status==='published');if(!x)return;const draft=(state.experienceDrafts[id]||'').trim();if(draft.length<5){notify('Write a response before submitting.');return;}state.experienceSubmissions.unshift({id:`mission-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,experienceId:id,text:draft});state.experienceDrafts[id]='';save();notify('Mission response sent to the demo teacher queue.');render();return;}
    if(button.hasAttribute('data-stage')){ui.stage=button.dataset.stage;render();return;}
    if(button.hasAttribute('data-speak'))return speak(button.dataset.speak);
    if(button.hasAttribute('data-choice')){if(!ui.checked){ui.selected=Number(button.dataset.choice);render();}return;}
    if(button.hasAttribute('data-check-answer')){const l=currentLesson();const q=l.questions[ui.questionIndex];if(ui.selected===null)return;ui.answers[ui.questionIndex]={chosen:ui.selected,correct:ui.selected===q.correct};ui.checked=true;render();return;}
    if(button.hasAttribute('data-next-question')){ui.questionIndex++;ui.selected=null;ui.checked=false;render();return;}
    if(button.hasAttribute('data-retake')){ui.questionIndex=0;ui.selected=null;ui.checked=false;ui.answers={};render();return;}
    if(button.hasAttribute('data-submit-response')){const id=button.dataset.submitResponse;const draft=(state.drafts[id]||'').trim();if(draft.length<5){notify('Write a sentence before submitting.');return;}state.submissions.unshift({id:`entry-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,lessonId:id,text:draft});save();notify('Response added to the demo teacher queue.');render();return;}
    if(button.hasAttribute('data-finish-lesson')){const l=currentLesson();if(Object.keys(ui.answers).length<l.questions.length){ui.stage='check';notify('Complete the three practice questions to finish.');render();return;}if(!state.completed.includes(l.id))state.completed.push(l.id);state.scores[l.id]=Math.round(100*Object.values(ui.answers).filter(x=>x.correct).length/l.questions.length);save();notify('Lesson progress saved on this device.');navigate('student/lessons');return;}
    if(button.hasAttribute('data-record')){toggleRecording();return;}
    if(button.hasAttribute('data-review')){const id=button.dataset.review;const note=(document.querySelector(`[data-feedback="${CSS.escape(id)}"]`)?.value||'').trim();if(note.length<5){notify('Write a short feedback note first.');return;}state.reviews[id]={note,at:new Date().toISOString()};save();notify('Review saved in this browser.');render();return;}
    if(button.hasAttribute('data-assignment')){state.assigned=button.dataset.assignment==='on';save();notify(state.assigned?'Assignment is visible to the demo learner.':'Demo assignment removed.');render();return;}
    if(button.hasAttribute('data-reset')){if(confirm('Clear learning progress, exam attempts, teacher questions and local demo reviews from this browser?')){state=defaultState();save();window.GermanExamStudio?.reset();resetLessonUI('hello');navigate('home');notify('Demo reset.');}return;}
  }
  root.addEventListener('click',e=>handleAction(e.target));
  function handleInput(e){
    const target=e.target;
    if(target.dataset?.workbookDraft&&target.matches('[data-workbook-draft]')){const [id,kind]=target.dataset.workbookDraft.split(':');if(workbookUnit(id)&&['writing','speaking'].includes(kind)){const p=state.workbookProgress[id]||(state.workbookProgress[id]={answers:{},drafts:{}});if(!p.drafts)p.drafts={};p.drafts[kind]=target.value;save();const send=document.querySelector(`[data-workbook-submit="${id}:${kind}"]`);if(send)send.disabled=target.value.trim().length<10;}return;}
    if(target.matches('[data-draft]')){const id=target.dataset.draft;state.drafts[id]=target.value;save();const submit=document.querySelector('[data-submit-response]');if(submit)submit.disabled=target.value.trim().length<5;}
    if(target.matches('[data-experience-draft]')){const id=target.dataset.experienceDraft;state.experienceDrafts[id]=target.value;save();const submit=document.querySelector('[data-submit-experience]');if(submit)submit.disabled=target.value.trim().length<5;}
    if(target.matches('[data-session-field]')&&ui.sessionDraft){ui.sessionDraft[target.dataset.sessionField]=target.dataset.sessionField==='chapterNumber'?(target.value?Number(target.value):null):target.value;}
    if(target.matches('[data-session-block-field]')&&ui.sessionDraft){const [i,field]=target.dataset.sessionBlockField.split(':');const b=ui.sessionDraft.blocks[Number(i)];if(b)b[field]=target.value;}
    if(target.matches('[data-session-answer-index]')&&ui.sessionDraft){const b=ui.sessionDraft.blocks[Number(target.dataset.sessionAnswerIndex)];if(b)b.correct=String(Number(target.value)-1);}
    if(target.matches('[data-session-writing]')){const p=mutableSessionProgress(ui.sessionId);p.drafts[target.dataset.sessionWriting]=target.value;save();const submit=document.querySelector('[data-submit-session-roleplay]');if(submit)submit.disabled=target.value.trim().length<5;}
  }
  root.addEventListener('input',handleInput);
  root.addEventListener('change',handleInput);
  window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});});
  window.addEventListener('beforeunload',()=>{if(recordedURL)URL.revokeObjectURL(recordedURL);mediaStream?.getTracks().forEach(t=>t.stop());});
  fetch('./data/tatoeba-cc0.json').then(r=>r.ok?r.json():null).then(data=>{if(data&&Array.isArray(data.sentences)){openPhrases=data.sentences;if(ui.route==='sources')render();}}).catch(()=>{});
  render();
})();

</script>
</body>
</html>
