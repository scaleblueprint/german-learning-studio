name: German Studio content regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate uploaded textbook source and archived editions
        run: |
          node tests/curriculum-a11.mjs
          node tests/chapter-study.mjs
          node tests/chapter-readers.mjs
          node tests/curriculum-neu.mjs
          node tests/workbook.mjs
          node tests/rich-lessons.mjs
          node tests/photo-practice.mjs
          node tests/depth-guides.mjs
          node tests/phase3.mjs
          node tests/phase4.mjs
          node tests/phase5.mjs
          node tests/textbook-alignment.mjs
      - name: Run student and teacher regression checks
        run: |
          node tests/smoke.mjs
          node tests/navigation.mjs
          node tests/role-separation.mjs
          node tests/exam.mjs
      - name: Regenerate and validate standalone demo
        run: |
          node tools/bundle.mjs
          if ! git diff --quiet -- german-studio-demo.html; then
            if [ "${{ github.event_name }}" != "push" ]; then
              echo "Standalone demo is stale; regenerate and commit it before merging."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add german-studio-demo.html
            git commit -m "Sync portable demo with verified German Studio changes [skip ci]"
            git push origin HEAD:main
          fi
          git diff --exit-code -- german-studio-demo.html
